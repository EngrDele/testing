canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#9cc3e6}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}

#mini{display:block;border-radius:8px}

.tst{background:var(--hud);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}

.fbtn{position:fixed;z-index:5;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#phoneBtn{right:106px;bottom:30px}
#camBtn{right:106px;bottom:86px}
#autoBtn{right:106px;bottom:142px;font-size:13px}
#guideBtn{right:106px;bottom:198px;font-size:13px}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.gcard{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.25}
.gcard .gi{font-size:24px}
.gcard small{color:var(--muted)}
.gcard.on{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--chip))}
.ppe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

body,.modal,button,input{font-size:1rem}

.modal label{cursor:pointer}
.consent{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-size:.9rem}
.consent label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.consent input{width:auto;margin-top:3px}
.consent details{margin-top:6px}.consent summary{cursor:pointer;color:var(--muted)}

#slCaption.on{opacity:1}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}

.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}

.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}

.fb{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--chip)}

.big{font-size:1.9rem;font-weight:800}

ook closely": "Duba da kyau", "That is dangerous! Tell an adult": "Wannan haɗari ne! Faɗa wa babba", "That is safe": "Wannan lafiya", "Is it dangerous or safe?": "Haɗari ne ko lafiya?", "Well spotted! You found a danger. ⭐": "Ka gani da kyau! Ka sami haɗari. ⭐", "Correct! That is safe. ⭐": "Daidai! Wannan lafiya. ⭐", "Oh no! That is dangerous. Always tell an adult.": "Kai! Wannan haɗari ne. Ko yaushe ka faɗa wa babba.", "Good thinking, but that one is safe. It helps keep us safe!": "Tunani mai kyau, amma wannan lafiya. Yana taimaka mana mu kasance lafiya!", "Hot! A danger is very close": "Zafi! Haɗari yana kusa sosai", "Warm, keep looking": "Ɗumi, ci gaba da nema", "Cold, look somewhere else": "Sanyi, nemi wani wuri", "My jobs": "Ayyukana", "Find {0} hidden dangers (tap LOOK when you see a ❓)": "Nemo haɗari {0} da ke ɓoye (taɓa DUBA idan ka ga ❓)", "You did it!": "Ka yi nasara!", "Oops! Let's try again": "Kash! Mu sake gwadawa", "Oops! Let us try again.": "Kash! Mu sake gwadawa.", "GOLD": "ZINARI", "SILVER": "AZURFA", "BRONZE": "TAGULLA", "{0} SAFETY STAR": "TAURARON TSARO NA {0}", "{0} stars · 🔎 {1} dangers found · ❤️ {2} hearts left": "{0} taurari · 🔎 haɗari {1} da aka samu · ❤️ zukata {2} sun rage", "Well done {0}! You are a {1} safety star!": "Madalla {0}! Kai tauraron tsaro ne na {1}!", "You ran out of hearts. Every mistake is a chance to learn!": "Zukatanka sun ƙare. Kowane kuskure dama ce ta koyo!", "What we learned": "Abin da muka koya", "Perfect! No mistakes at all. 🌟": "Cikakke! Babu kuskure ko kaɗan. 🌟", "Try again": "Sake gwadawa", "Send to Mummy/Daddy": "Aika wa Mama/Baba", "The school bus is coming! Wait behind the yellow line.": "Motar makaranta tana zuwa! Jira a bayan layin rawaya.", "The bus has stopped. Now you can get on.": "Motar ta tsaya. Yanzu za ka iya shiga.", "Off to school! Seatbelt on.": "Mu je makaranta! Ɗaura bel.", "Get off the road! Only cross at the zebra crossing.": "Fita daga titi! Ka tsallaka a mashigar zebra kawai.", "Well done! Y ou do?": "Wayar caja ta wayarka ta yanke kuma kana ganin tagulla a ciki. Me ya kamata ka yi?", "Use it quickly, it still works": "Yi amfani da shi da sauri, har yanzu yana aiki", "Do not touch it. Unplug nothing. Tell Mummy or Daddy": "Kada ka taɓa shi. Kada ka cire komai. Faɗa wa Mama ko Baba", "Broken wires can shock you or start a fire. Never touch them.": "Wayoyin da suka yanke za su iya ja maka wuta ko su haddasa gobara. Kada ka taɓa su.", "Correct! Always tell an adult about broken wires.": "Daidai! Ko yaushe ka faɗa wa babba game da wayoyin da suka yanke.", "The bathroom floor is wet and soapy. What do you do?": "Ƙasan banɗaki a jike yake kuma da sabulu. Me za ka yi?", "Run and slide, it is fun!": "Gudu ka zame, yana da daɗi!", "Walk slowly, hold on, and dry the floor or tell an adult": "Yi tafiya a hankali, ka riƙe wani abu, ka shanya ƙasa ko ka faɗa wa babba", "Wet floors are slippery. You can fall and hit your head.": "Ƙasa mai jika tana santsi. Za ka iya faɗuwa ka bugi kanka.", "Well done! Walk slowly on wet floors.": "Madalla! Yi tafiya a hankali a ƙasa mai jika.", "A pot of stew is boiling on the gas cooker and the handle is sticking out. What should you do?": "Tukunyar miya tana tafasa a kan murhun gas kuma hannunta ya fito waje. Me ya kamata ka yi?", "Grab the handle to look inside": "Kama hannun tukunyar don ka duba ciki", "Stay away from the cooker and tell Mummy about the handle": "Nisanci murhu ka faɗa wa Mama game da hannun tukunyar", "Hot pots can fall and burn you badly. Stay away from the cooker.": "Tukunya mai zafi za ta iya faɗuwa ta ƙone ka sosai. Nisanci murhu.", "Correct! Keep away from hot things in the kitchen.": "Daidai! Nisanci abubuwa masu zafi a kicin.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ta ɗauke wuta. Ɗan'uwanka ya ajiye kyandir mai ci kusa da labule. Me za ka yi?", "Leave it, the candle is small": "Bar shi, kyandir ɗin ƙarami ne", "Tell an adult to move it away and use a rechargeable lamp": "Faɗa wa babba ya ɗauke shi, a yi amfani da fitila mai caji", "Curtains catch fire very fast. A small flame can burn the whole house.": "Labule yana kama wuta da sauri. Ƙaramar wuta za ta iya ƙone gidan duka.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Madalla! Nisantar da wuta daga labule, ko a yi amfani da fitila mai caji.", "You see some sweet-looking tablets on the table. What should you do?": "Ka ga wasu ƙwayoyin magani masu kama da alewa a kan tebur. Me ya kamata ka yi?", "Taste one, it looks like sweets": "Ɗanɗana ɗaya, yana kama da alewa", "Do not touch. Tell an adult to keep it out of reach": "Kada ka taɓa. Faɗa wa babba ya ajiye shi inda ba za a kai ba", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Magani zai iya sa ka rashin lafiya sosai. Ka sha magani daga iyaye ko likita kawai.", "Correct! Never eat medicine on your own.": "Daidai! Kada ka taɓa shan magani da kanka.", "Daddy's generator is running close to the kitchen window. What should you do?": "Janaretan Baba yana aiki kusa da tagar kicin. Me ya kamata ka yi?", "Go and touch it to see if it is hot": "Je ka taɓa shi ka ga ko yana da zafi", "Stay away and tell Daddy it must be far from windows and doors": "Ka nisance shi ka faɗa wa Baba cewa dole ne ya yi nisa da tagogi da ƙofofi", "Generators are very hot and the smoke is poison (carbon monoxide).": "Janareta yana da zafi sosai kuma hayakinsa guba ne (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Daidai! Hayakin janareta zai iya kashewa. Dole ne ya kasance a waje, nesa da tagogi.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Murfin rijiya a buɗe yake. Ƙwallonka ta mirgina zuwa gefenta. Me za ka yi?", "Run and get the ball": "Gudu ka ɗauko ƙwallon", "Stay away and call an adult to get the ball and close the well": "Ka nisance ta ka kira babba ya ɗauko ƙwallon ya rufe rijiyar", "You could fall into the well. Always stay away from open wells.": "Za ka iya faɗawa cikin rijiya. Ko yaushe ka nisanci rijiya a buɗe.", "Correct! Never play near an open well or soakaway.": "Daidai! Kada ka yi wasa kusa da rijiya ko ramin shara a buɗe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Sannu! Mamarka ce ta aiko ni in kai ka makaranta. Zo mu tafi.\"", "Go with him, he knows Mummy": "Bi shi, ya san Mama", "Do not open the gate. Run back and tell Mummy": "Kada ka buɗe ƙofa. Gudu ka koma ka faɗa wa Mama", "Never go with someone you do not know. Strangers can say anything.": "Kada ka bi wanda ba ka sani ba. Baƙi za su iya faɗin komai.", "Excellent! Never go with a stranger. Always tell your parents.": "Madalla sosai! Kada ka bi baƙo. Ko yaushe ka faɗa wa iyayenka.", "Where should you walk on the street?": "Ina ya kamata ka yi tafiya a titi?", "In the middle of the road": "A tsakiyar titi", "On the walkway, holding an adult's hand": "A hanyar masu tafiya, kana riƙe da hannun babba", "Cars, okadas and kekes use the road. You could be hit.": "Motoci, okada da keke suna amfani da titi. Za su iya bugarka.", "Correct! Walk on the walkway and hold an adult's hand.": "Daidai! Yi tafiya a hanyar masu tafiya ka riƙe hannun babba.", "You want to cross the road. What do you do first?": "Kana so ka tsallaka titi. Me za ka fara yi?", "Run across quickly": "Gudu ka tsallaka da sauri", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Tsaya a zebra, duba hagu, dama, hagu kuma, ka jira motoci su tsaya", "Running across the road is very dangerous.": "Gudun tsallaka titi haɗari ne sosai.", "Well done! Stop, look and listen before you cross.": "Madalla! Tsaya, duba, ka saurara kafin ka tsallaka.", "The school bus is coming. Where should you stand?": "Motar makaranta tana zuwa. Ina ya kamata ka tsaya?", "At the edge of the road, ready to jump in": "A bakin titi, a shirye don tsalle ciki", "Behind the yellow line until the bus stops completely": "A bayan layin rawaya har motar ta tsaya gaba ɗaya", "You could fall or be hit by the bus. Stay back.": "Za ka iya faɗuwa ko motar ta buge ka. Ja da baya.", "Correct! Wait behind the line until the bus stops.": "Daidai! Jira a bayan layi har motar ta tsaya.", "You are on the bus. What should you do?": "Kana cikin mota. Me ya kamata ka yi?", "Stand up and put your head out of the window": "Tashi ka fitar da kanka ta taga", "Sit down, fasten your seatbelt and keep hands inside": "Zauna, ɗaura bel, ka ajiye hannayenka a ciki", "Never put your head or hands out of a moving bus.": "Kada ka fitar da kai ko hannu daga motar da ke tafiya.", "Excellent! Sit down and wear your seatbelt.": "Madalla sosai! Zauna ka ɗaura bel.", "\"Your Daddy is busy. I will take you home. Get in my car.\"": "\"Babanka yana da aiki. Zan kai ka gida. Shiga motata.\"", "Get in, he looks nice": "Shiga, yana kama da mutumin kirki", "Say NO, stay inside, and tell the gatekeeper or teacher": "Ka ce A'A, ka zauna a ciki, ka faɗa wa mai gadi ko malami", "Never go with someone who is not on your pick-up list.": "Kada ka bi wanda ba ya cikin jerin masu ɗaukarka.", "Excellent! Only go home with people your parents chose.": "Madalla sosai! Ka tafi gida da waɗanda iyayenka suka zaɓa kawai.", "\"This is our fire assembly point.\" If the fire alarm rings, where do you go?": "\"Wannan ne wurin taruwarmu na gobara.\" Idan ƙararrawar gobara ta yi ƙara, ina za ka je?", "Hide under my desk": "Ɓoye a ƙarƙashin teburina", "Walk quickly to the assembly point and line up with my class": "Yi tafiya da sauri zuwa wurin taruwa ka jera tare da ajinka", "In a fire you must leave the building. Hiding is dangerous.": "A lokacin gobara dole ka fita daga ginin. Ɓoyewa haɗari ne.", "Correct! Remember this place.": "Daidai! Ka tuna da wannan wuri.", "The socket near your desk is sparking and smells like burning.": "Soket ɗin da ke kusa da teburinka yana tartsatsi kuma yana wari kamar abin da ke ƙonewa.", "Pull out the plug yourself": "Cire filogin da kanka", "Move away and tell the teacher immediately": "Ka matsa nesa ka faɗa wa malami nan da nan", "You could get an electric shock.": "Wutar lantarki za ta iya ja maka.", "Correct! Never touch sparking sockets.": "Daidai! Kada ka taɓa soket mai tartsatsi.", "Your classmate is leaning back on two chair legs.": "Abokin ajinka yana jingina baya a kan ƙafafun kujera biyu.", "Do it too, it is fun": "Kai ma ka yi, yana da daɗi", "Sit with all four chair legs on the floor and tell him to stop": "Zauna da ƙafafun kujera huɗu a ƙasa ka gaya masa ya daina", "The chair can fall back and you can hit your head.": "Kujera za ta iya faɗuwa baya ka bugi kanka.", "Well done! Sit properly on your chair.": "Madalla! Zauna da kyau a kan kujerarka.", "The break bell rings and everyone rushes out.": "Ƙararrawar hutu ta yi kuma kowa yana gaggawar fita.", "Push to be the first one out": "Tura mutane don ka fara fita", "Walk, keep to the right, and do not push": "Yi tafiya, bi gefen dama, kada ka tura kowa", "Pushing causes falls and injuries.": "Turawa yana jawo faɗuwa da rauni.", "Correct! Walk calmly in corridors.": "Daidai! Yi tafiya a hankali a hanyoyin ciki.", "Some big pupils are pushing a small boy and taking his snacks.": "Wasu manyan ɗalibai suna tura wani ƙaramin yaro suna ƙwace masa kayan ciye-ciye.", "Join them and laugh": "Shiga cikinsu ka yi dariya", "Do not join. Go and tell a teacher at once": "Kada ka shiga. Je ka faɗa wa malami nan da nan", "Bullying hurts people. Never join in.": "Cin zali yana cutar da mutane. Kada ka shiga.", "Brave and kind! Always tell a teacher about bullying.": "Jarumi kuma mai kirki! Ko yaushe ka faɗa wa malami game da cin zali.", "There are bottles of coloured liquid on the bench and no teacher.": "Akwai kwalabe na ruwa mai launi a kan benci kuma babu malami.", "Smell or taste them": "Ka ji ƙamshinsu ko ka ɗanɗana", "Do not touch. Wait for the teacher": "Kada ka taɓa. Jira malami", "Chemicals can  Nọrọ ebe dị anya n'ọkụ.", "Correct! Keep away from hot things in the kitchen.": "Ọ ziri ezi! Nọrọ ebe dị anya n'ihe dị ọkụ na kichin.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ewerela ọkụ. Nwanne gị nwoke tinyere kandụl na-enwu n'akụkụ ákwà mkpuchi windo. Gịnị ka ị ga-eme?", "Leave it, the candle is small": "Hapụ ya, kandụl ahụ dị obere", "Tell an adult to move it away and use a rechargeable lamp": "Gwa onye okenye ka o wepụ ya ma jiri oriọna a na-achaji", "Curtains catch fire very fast. A small flame can burn the whole house.": "Ákwà mkpuchi windo na-ere ọkụ ngwa ngwa. Obere ọkụ nwere ike ịgba ụlọ niile.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ọ dị mma! Debe ọkụ ebe dị anya n'ákwà mkpuchi windo, ma ọ bụ jiri oriọna a na-achaji.", "You see some sweet-looking tablets on the table. What should you do?": "Ị hụrụ ụfọdụ ọgwụ yiri swiiti n'elu tebụl. Gịnị ka i kwesịrị ime?", "Taste one, it looks like sweets": "Detụ otu ire, ọ dị ka swiiti", "Do not touch. Tell an adult to keep it out of reach": "Emetụla ya aka. Gwa onye okenye ka o debe ya ebe aka agaghị eru", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Ọgwụ nwere ike ime ka ị rịa ọrịa nke ukwuu. Were ọgwụ naanị n'aka nne, nna ma ọ bụ dọkịta.", "Correct! Never eat medicine on your own.": "Ọ ziri ezi! Aṅụla ọgwụ n'onwe gị.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jenerẹtọ Papa na-arụ ọrụ n'akụkụ windo kichin. Gịnị ka i kwesịrị ime?", "Go and touch it to see if it is hot": "Gaa metụ ya aka ka ị mara ma ọ dị ọkụ", "Stay away and tell Daddy it must be far from windows and doors": "Nọrọ ebe dị anya ma gwa Papa na ọ ga-anọ ebe dị anya na windo na ọnụ ụzọ", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jenerẹtọ na-ekpo ọkụ nke ukwuu, anwụrụ ọkụ ya bụ nsị (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ọ ziri ezi! Anwụrụ ọkụ jenerẹtọ nwere ike igbu mmadụ. Ọ ga-anọ n'èzí, ebe dị anya na windo.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Mkpuchi olulu mmiri meghere emeghe. Bọọlụ gị gbagoro n'akụkụ ya. Gịnị ka ị ga-eme?", "Run and get the ball": "Gbaa ọsọ were bọọlụ ahụ", "Stay away and call an adult to get the ball and close the well": "Nọrọ ebe dị anya ma kpọọ onye okenye ka o were bọọlụ ma mechie olulu mmiri", "You could fall into the well. Always stay away from open wells.": "Ị nwere ike ịdaba n'olulu mmiri. Na-anọ ebe dị anya n'olulu mmiri meghere emeghe mgbe niile.", "Correct! Never play near an open well or soakaway.": "Ọ ziri ezi! Egwula egwu n'akụkụ olulu mmiri ma ọ bụ olulu nsị meghere emeghe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ndewo! Mama gị zitere m ka m kpọga gị ụlọ akwụkwọ. Soro m.\"", "Go with him, he knows Mummy": "Soro ya, ọ maara Mama", "Do not open the gate. Run back and tell Mummy": "Emeghela ọnụ ụzọ ama. Gbaghachi azụ gwa Mama", "Never go with someone you do not know. Strangers can say anything.": "Esorola onye ị na-amaghị. Ndị a na-amaghị nwere ike ikwu ihe ọ bụla.", "Excellent! Never go with a stranger. Always tell your parents.": "Ọ magburu onwe ya! Esorola onye a na-amaghị. Na-agwa nne na nna gị mgbe niile.", "Where should you walk on the street?": "Ebee ka i kwesịrị ije ije n'okporo ámá?", "In the middle of the road": "N'etiti okporo ụzọ", "On the walkway, holding an adult's hand": "N'ụzọ ndị na-eje ije, jide aka onye okenye", "Cars, okadas and kekes use the road. You could be hit.": "Ụgbọ ala, okada na keke na-eji okporo ụzọ. Ha nwere ike ịkụ gị.", "Correct! Walk on the walkway and hold an adult's hand.": "Ọ ziri ezi! Jee ije n'ụzọ ndị na-eje ije ma jide aka onye okenye.", "You want to cross the road. What do you do first?": "Ị chọrọ ịgafe okporo ụzọ. Gịnị ka ị ga-ebu ụzọ mee?", "Run across quickly": "Gbaa ọsọ gafee ngwa ngwa", "Stop at the zebra, u go?": "\"Nke a bụ ebe nzukọ ọkụ anyị.\" Ọ bụrụ na mgbịrịgba ọkụ dara, ebee ka ị ga-aga?", "Hide under my desk": "Zoo n'okpuru tebụl m", "Walk quickly to the assembly point and line up with my class": "Jee ije ọsọ ọsọ gaa ebe nzukọ ma kwụ n'ahịrị na klas m", "In a fire you must leave the building. Hiding is dangerous.": "Mgbe ọkụ na-ere, ị ga-apụ n'ụlọ. Izo ezo dị egwu.", "Correct! Remember this place.": "Ọ ziri ezi! Cheta ebe a.", "The socket near your desk is sparking and smells like burning.": "Soket dị n'akụkụ tebụl gị na-agba ọkụ, ọ na-esikwa isi ihe na-ere ọkụ.", "Pull out the plug yourself": "Wepụ plọg n'onwe gị", "Move away and tell the teacher immediately": "Pụọ ebe ahụ ma gwa onye nkuzi ozugbo", "You could get an electric shock.": "Ọkụ eletrik nwere ike ịgba gị.", "Correct! Never touch sparking sockets.": "Ọ ziri ezi! Emetụla soket na-agba ọkụ aka.", "Your classmate is leaning back on two chair legs.": "Onye klas gị na-adabere azụ n'ụkwụ oche abụọ.", "Do it too, it is fun": "Mee ya kwa, ọ na-atọ ụtọ", "Sit with all four chair legs on the floor and tell him to stop": "Nọdụ ala ka ụkwụ oche anọ niile dị n'ala ma gwa ya ka ọ kwụsị", "The chair can fall back and you can hit your head.": "Oche nwere ike ịda azụ, ị nwekwara ike ịkụ isi gị.", "Well done! Sit properly on your chair.": "I mere nke ọma! Nọdụ ala nke ọma n'oche gị.", "The break bell rings and everyone rushes out.": "Mgbịrịgba ezumike dara, onye ọ bụla na-agba ọsọ apụ.", "Push to be the first one out": "Kwaa mmadụ ka ị bụrụ onye mbụ pụọ", "Walk, keep to the right, and do not push": "Jee ije, nọrọ n'aka nri, akwala onye ọ bụla", "Pushing causes falls and injuries.": "Ịkwa mmadụ na-akpata ọdịda na mmerụ ahụ.", "Correct! Walk calmly in corridors.": "Ọ ziri ezi! Jee ije nwayọ n'okporo ụzọ ime ụlọ.", "Some big pupils are pushing a small boy and taking his snacks.": "Ụfọdụ ụmụ akwụkwọ buru ibu na-akwa otu obere nwata nwoke ma na-anapụ ya nri ya.", "Join them and laugh": "Sonye ha ma chịa ọchị", "Do not join. Go and tell a teacher at once": "Esonyela. Gaa gwa onye nkuzi ozugbo", "Bullying hurts people. Never join in.": "Mmegbu na-emerụ mmadụ. Esonyela ya.", "Brave and kind! Always tell a teacher about bullying.": "Obi ike na obi ọma! Na-agwa onye nkuzi maka mmegbu mgbe niile.", "There are bottles of coloured liquid on the bench and no teacher.": "Karama mmiri nwere agba dị n'elu bench, onye nkuzi anọghịkwa.", "Smell or taste them": "Sie ha isi ma ọ bụ detụ ha ire", "Do not touch. Wait for the teacher": "Emetụla ha aka. Chere onye nkuzi", "Chemicals can burn your skin, eyes and mouth.": "Kemịkalụ nwere ike ịgba akpụkpọ ahụ gị, anya gị na ọnụ gị ọkụ.", "Correct! Only use the lab with a teacher.": "Ọ ziri ezi! Jiri ụlọ nyocha naanị mgbe onye nkuzi nọ.", "You have used the toilet. What next?": "I jirila ụlọ mposi. Gịnị na-esote?", "Go straight back to class": "Laghachi klas ozugbo", "Wash hands with soap and water for 20 seconds": "Jiri ncha na mmiri saa aka ruo sekọnd 20", "Germs on your hands can make you and others sick.": "Nje dị n'aka gị nwere ike ime ka gị na ndị ọzọ rịa ọrịa.", "Great! Clean hands stop germs.": "Ọ dị mma! Aka dị ọcha na-egbochi nje.", "Someone spilled hot pepper soup on the floor.": "Mmadụ wụfuru ofe ose dị ọkụ n'ala.", "Jump over it and run": "Wụfee ya ma gbaa ọsọ", "Walk around it and tell the canteen staff": "Gagharịa ya ma gwa ndị ọrụ ebe nri", "You could slip and get burnt.": "Ị nwere ike ịmị amị ma ọkụ gbaa gị.", "Correct! Report spills so they can be cleaned.": "Ọ ziri ezi! Kọọ ihe wụfuru ka e hichaa ya.", "One chain on the swing is broken.": "Otu agbụ nke swing agbajiela.", "Swing anyway, very high": "Fegharịa ka o sila dị, elu nke ukwuu", "Do not use it. Tell a teacher it is broken": "Ejila ya. Gwa onye nkuzi na ọ gbajiri agbaji", "Broken swings can throw you to the ground.": "Swing gbajiri agbaji nwere ike ịtụba gị n'ala.", "Well done! Report broken play equipment.": "I mere nke ọma! Kọọ ihe egwuregwu mebiri emebi.", "You fell and cut you ": "ÌRÀWỌ̀ ÀÀBÒ {0}", "{0} stars · 🔎 {1} dangers found · ❤️ {2} hearts left": "{0} ìràwọ̀ · 🔎 ewu {1} tí o rí · ❤️ ọkàn {2} tó kù", "Well done {0}! You are a {1} safety star!": "O ṣe dáadáa {0}! Ìwọ ni ìràwọ̀ ààbò {1}!", "You ran out of hearts. Every mistake is a chance to learn!": "Ọkàn rẹ ti tán. Gbogbo àṣìṣe jẹ́ àǹfààní láti kẹ́kọ̀ọ́!", "What we learned": "Ohun tí a kọ́", "Perfect! No mistakes at all. 🌟": "Ó pé! Kò sí àṣìṣe rárá. 🌟", "Try again": "Tún gbìyànjú", "Send to Mummy/Daddy": "Fi ránṣẹ́ sí Màmá/Bàbá", "The school bus is coming! Wait behind the yellow line.": "Ọkọ̀ ilé-ìwé ń bọ̀! Dúró sẹ́yìn ìlà aláwọ̀ ìyeyè.", "The bus has stopped. Now you can get on.": "Ọkọ̀ ti dúró. O lè wọ̀ ọ́ báyìí.", "Off to school! Seatbelt on.": "A ń lọ sí ilé-ìwé! So bẹ́líìtì ìjókòó.", "Get off the road! Only cross at the zebra crossing.": "Kúrò lójú ọ̀nà! Ọ̀nà abilà nìkan ni kí o ti sọdá.", "Well done! You crossed at the zebra and the cars stopped.": "O ṣe dáadáa! O sọdá ní ọ̀nà abilà, àwọn mọ́tò sì dúró.", "You reached the assembly point. Your teacher counted you!": "O ti dé ibi ìpéjọ. Olùkọ́ rẹ ti kà ọ́!", "Great job! Your teacher says: \"Let us practise a fire drill soon.\"": "Iṣẹ́ takuntakun! Olùkọ́ rẹ sọ pé: \"Ẹ jẹ́ ká ṣe ìdánrawò iná láìpẹ́.\"", "Fire drill! Walk quickly to the assembly point. Do not go back for anything.": "Ìdánrawò iná! Rìn kíákíá lọ sí ibi ìpéjọ. Má ṣe padà lọ mú nǹkan kankan.", "Bedroom": "Yàrá ìsùn", "Bathroom": "Balùwẹ̀", "Kitchen": "Ilé ìdáná", "Sitting room": "Pálọ̀", "Store room": "Yàrá ìkẹ́rùsí", "Generator": "Jẹnẹrétọ̀", "Well": "Kànga", "Gate": "Ẹnu-ọ̀nà", "Walkway": "Ọ̀nà ẹlẹ́sẹ̀", "Zebra crossing": "Ọ̀nà abilà", "Cross at the zebra": "Sọdá ní ọ̀nà abilà", "Cross the road on the zebra crossing": "Sọdá títì ní ọ̀nà abilà", "Bus stop": "Ibùdókọ̀", "Bus stop (wait)": "Ibùdókọ̀ (dúró)", "Board the bus": "Wọ ọkọ̀", "School gate": "Ẹnu-ọ̀nà ilé-ìwé", "Assembly ground": "Pápá ìpéjọ", "ASSEMBLY POINT": "IBI ÌPÉJỌ", "assembly point": "ibi ìpéjọ", "Classroom 1": "Kíláàsì 1", "Classroom 2": "Kíláàsì 2", "Corridor": "Ọ̀dẹ̀dẹ̀", "Behind the block": "Lẹ́yìn ilé", "Science lab": "Yàrá ìmọ̀ sáyẹ́ǹsì", "Toilets": "Ilé ìgbọ̀nsẹ̀", "Canteen staff": "Òṣìṣẹ́ ilé oúnjẹ", "Playground": "Pápá ìṣeré", "Sick bay": "Yàrá aláìsàn", "Bus park": "Ibi ìgbọ́kọ̀sí ọkọ̀ ilé-ìwé", "Teacher": "Olùkọ́", "Mummy": "Màmá", "Daddy": "Bàbá", "Stranger": "Àjèjì", "Brother": "Ẹ̀gbọ́n/Àbúrò ọkùnrin", "Your brother": "Àbúrò rẹ ọkùnrin", "Crossing guard": "Olùtọ́jú ọ̀nà", "Gatekeeper": "Olùṣọ́ ẹnu-ọ̀nà", "Nurse": "Nọ́ọ̀sì", "School nurse": "Nọ́ọ̀sì ilé-ìwé", "Bus attendant": "Olùtọ́jú ọkọ̀", "Your bedroom": "Yàrá rẹ", "Mummy in the kitchen": "Màmá ní ilé ìdáná", "The well": "Kànga náà", "A stranger at the gate": "Àjèjì ní ẹnu-ọ̀nà", "Walking to the bus stop": "Rírìn lọ sí ibùdókọ̀", "A man in a car outside": "Ọkùnrin kan nínú mọ́tò níta", "Your classmate": "Ọmọ kíláàsì rẹ", "A younger pupil": "Akẹ́kọ̀ọ́ kékeré kan", "Your phone charger wire is cut and you can see the copper inside. What should you do?": "Wáyà ṣájà fóònù rẹ ti gé, o sì ń rí bàbà inú rẹ̀. Kí ni o yẹ kí o ṣe?", "Use it quickly, it still works": "Lò ó kíákíá, ó ṣì ń ṣiṣẹ́", "Do not touch it. Unplug nothing. Tell Mummy or Daddy": "Má fọwọ́ kàn án. Má yọ nǹkan kankan. Sọ fún Màmá tàbí Bàbá", "Broken wires can shock you or start a fire. Never touch them.": "Wáyà tó ti gé lè gbá ọ ní iná tàbí dá iná sílẹ̀. Má ṣe fọwọ́ kàn wọ́n láé.", "Correct! Always tell an adult about broken wires.": "Ó tọ̀nà! Máa sọ fún àgbàlagbà nípa wáyà tó ti gé nígbà gbogbo.", "The bathroom floor is wet and soapy. What do you do?": "Ilẹ̀ balùwẹ̀ tutù, ọṣẹ sì wà níbẹ̀. Kí ni o máa ṣe?", "Run and slide, it is fun!": "Sáré kí o sì yọ̀, ó dùn!", "Walk slowly, hold on, and dry the floor or tell an adult": "Rìn díẹ̀díẹ̀, di nǹkan mú, kí o sì nu ilẹ̀ tàbí sọ fún àgbàlagbà", "Wet floors are slippery. You can fall and hit your head.": "Ilẹ̀ tó tutù máa ń yọ̀. O lè ṣubú kí orí rẹ sì fara pa.", "Well done! Walk slowly on wet floors.": "O ṣe dáadáa! Rìn díẹ̀díẹ̀ lórí ilẹ̀ tó tutù.", "A pot of stew is boiling on the gas cooker and the handle is sticking out. What should you do?": "Ìkòkò ọbẹ̀ ń hó lórí ìdáná gáàsì, ọwọ́ rẹ̀ sì yọ síta. Kí ni o yẹ kí o ṣe?", "Grab the handle to look inside": "Di ọwọ́ ìkòkò mú láti wo inú rẹ̀", "Stay away from the cooker and tell Mummy about the handle": "Jìnnà sí ìdáná kí o sì sọ fún Màmá nípa ọwọ́ ìkòkò", "Hot pots can fall and burn you badly. Stay away from the cooker.": "Ìkòkò gbígbóná lè ṣubú kí ó sì jó ọ gidigidi. Jìnnà sí ìdáná.", "Correct! Keep away from hot things in the kitchen.": "Ó tọ̀nà! Jìnnà sí àwọn nǹkan gbígbóná ní ilé ìdáná.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ti mú iná lọ. Àbúrò rẹ gbé àbẹ́là tó ń jó sí ẹ̀gbẹ́ aṣọ fèrèsé. Kí ni o máa ṣe?", "Leave it, the candle is small": "Fi sílẹ̀, àbẹ́là náà kéré", "Tell an adult to move it away and use a rechargeable lamp": "Sọ fún àgbàlagbà kí ó gbé e kúrò kí ẹ sì lo àtùpà ìgbàná", "Curtains catch fire very fast. A small flame can burn the whole house.": "Aṣọ fèrèsé máa ń tètè gbiná. Iná kékeré lè jó gbogbo ilé.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ó dára! Jẹ́ kí iná jìnnà sí aṣọ fèrèsé, tàbí lo àtùpà ìgbàná.", "You see some sweet-looking tablets on the table. What should you do?": "O rí àwọn òògùn tó dà bí súwíìtì lórí tábìlì. Kí ni o yẹ kí o ṣe?", "Taste one, it looks like sweets": "Tọ́ ọ̀kan wò, ó dà bí súwíìtì", "Do not touch. Tell an adult to keep it out of reach": "Má fọwọ́ kàn án. Sọ fún àgbàlagbà kí ó gbé e sí ibi tí ọwọ́ kò ti lè tó o", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Òògùn lè mú ọ ṣàìsàn gidigidi. Gba òògùn lọ́wọ́ òbí tàbí dókítà nìkan.", "Correct! Never eat medicine on your own.": "Ó tọ̀nà! Má ṣe lo òògùn fúnra rẹ láé.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jẹnẹrétọ̀ Bàbá ń ṣiṣẹ́ nítòsí fèrèsé ilé ìdáná. Kí ni o yẹ kí o ṣe?", "Go and touch it to see if it is hot": "Lọ fọwọ́ kàn án láti mọ̀ bóyá ó gbóná", "Stay away and tell Daddy it must be far from windows and doors": "Jìnnà sí i kí o sì sọ fún Bàbá pé ó gbọ́dọ̀ jìnnà sí fèrèsé àti ilẹ̀kùn", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jẹnẹrétọ̀ máa ń gbóná gan-an, èéfín rẹ̀ sì jẹ́ májèlé (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ó tọ̀nà! Èéfín jẹnẹrétọ̀ lè pa ènìyàn. Ó gbọ́dọ̀ wà níta, jìnnà sí fèrèsé.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Ìdérí kànga wà ní ṣíṣí. Bọ́ọ̀lù rẹ yí lọ sí ẹ̀gbẹ́ rẹ̀. Kí ni o máa ṣe?", "Run and get the ball": "Sáré lọ mú bọ́ọ̀lù náà", "Stay away and call an adult to get the ball and close the well": "Jìnnà sí i kí o sì pe àgbàlagbà láti mú bọ́ọ̀lù kí ó sì dé kànga", "You could fall into the well. Always stay away from open wells.": "O lè já sínú kànga. Máa jìnnà sí kànga tó ṣí sílẹ̀ nígbà gbogbo.", "Correct! Never play near an open well or soakaway.": "Ó tọ̀nà! Má ṣe ṣeré nítòsí kànga tàbí ihò ìdọ̀tí tó ṣí sílẹ̀ láé.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ẹ n lẹ́ o! Màmá rẹ ló rán mi láti mú ọ lọ sí ilé-ìwé. Tẹ̀lé mi.\"", "Go with him, he knows Mummy": "Tẹ̀lé e, ó mọ Màmá", "Do not open the gate. Run back and tell Mummy": "Má ṣí ẹnu-ọ̀nà. Sáré padà kí o sì sọ fún Màmá", "Never go with someone you do not know. Strangers can say anything.": "Má ṣe tẹ̀lé ẹni tí o kò mọ̀ láé. Àjèjì lè sọ ohunkóhun.", "Excellent! Never go with a stranger. Always tell your parents.": "Ó dára jù! Má ṣe tẹ̀lé àjèjì láé. Máa sọ fún àwọn òbí rẹ nígbà gbogbo.", "Where should you walk on the street?": "Níbo ló yẹ kí o rìn lójú pópó?", "In the middle of the road": "Ní àárín títì", "On the walkway, holding an adult's hand": "Lórí ọ̀nà ẹlẹ́sẹ̀, kí o di ọwọ́ àgbàlagbà mú", "Cars, okadas and kekes use the road. You could be hit.": "Mọ́tò, ọ̀kadà àti kẹ̀kẹ́ ń lo títì. Wọ́n lè gbá ọ.", "Correct! Walk on the walkway and hold an adult's hand.": "Ó tọ̀nà! Rìn lórí ọ̀nà ẹlẹ́sẹ̀ kí o sì di ọwọ́ àgbàlagbà mú.", "You want to cross the road. What do you do first?": "O fẹ́ sọdá títì. Kí ni o máa kọ́kọ́ ṣe?", "Run across quickly": "Sáré sọdá kíákíá", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Dúró ní ọ̀nà abilà, wo òsì, ọ̀tún, òsì lẹ́ẹ̀kan sí i, kí o sì dúró kí àwọn mọ́tò dúró", "Running across the road is very dangerous.": "Sísáré sọdá títì léwu gan-an.", "Well done! Stop, look and listen before you cross.": "O ṣe dáadáa! Dúró, wò, kí o sì fetí sílẹ̀ kí o tó sọdá.", "The school bus is coming. Where should you stand?": "Ọkọ̀ ilé-ìwé ń bọ̀. Níbo ló yẹ kí o dúró sí?", "At the edge of the road, ready to jump in": "Ní etí títì, ní ìmúrasílẹ̀ láti bẹ́ wọlé", "Behind the yellow line until the bus stops completely": "Lẹ́yìn ìlà aláwọ̀ ìyeyè títí ọkọ̀ yóò fi dúró pátápátá", "You could fall or be hit by the bus. Stay back.": "O lè ṣubú tàbí kí ọkọ̀ gbá ọ. Dúró sẹ́yìn.", "Correct! Wait behind the line until the bus stops.": "Ó tọ̀nà! Dúró sẹ́yìn ìlà títí ọkọ̀ yóò fi dúró.", "You are on the bus. What should you do?": "O ti wà nínú ọkọ̀. Kí ni o yẹ kí o ṣe?", "Stand up and put your head out of the window": "Dìde dúró kí o sì yọ orí rẹ síta fèrèsé", "Sit down, fasten your seatbelt and keep hands inside": "Jókòó, so bẹ́líìtì ìjókòó, kí o sì pa ọwọ́ mọ́ inú", "Never put your head or hands out of a moving bus.": "Má ṣe yọ orí tàbí ọwọ́ síta ọkọ̀ tó ń lọ láé.", "Excellent! Sit down and wear your seatbelt.": "Ó dára jù! Jókòó kí o sì so bẹ́líìtì ìjókòó.", "\"Your Daddy is busy. I will take you home. Get in my car.\"": "\"Bàbá rẹ kò ráyè. Màá gbé ọ lọ sí ilé. Wọ mọ́tò mi.\"", "Get in, he looks nice": "Wọlé, ó dà bí ènìyàn rere", "Say NO, stay inside, and tell the gatekeeper or teacher": "Sọ pé RÁRÁ, dúró sínú, kí o sì sọ fún olùṣọ́ ẹnu-ọ̀nà tàbí olùkọ́", "Never go with someone who is not on your pick-up list.": "Má ṣe tẹ̀lé ẹni tí kò sí lórí àkọsílẹ̀ àwọn tó máa wá gbé ọ láé.", "Excellent! Only go home with people your parents chose.": "Ó dára jù! Bá àwọn tí òbí rẹ yàn nìkan lọ sílé.", "\"This is our fire assembly point.\" If the fire alarm rings, where do you go?": "\"Ibí ni ibi ìpéjọ iná wa.\" Tí agogo iná bá dún, níbo ni o máa lọ?", "Hide under my desk": "Farapamọ́ sábẹ́ tábìlì mi", "Walk quickly to the assembly point and line up with my class": "Rìn kíákíá lọ sí ibi ìpéjọ kí o sì tò pẹ̀lú kíláàsì mi", "In a fire you must leave the building. Hiding is dangerous.": "Nígbà iná, o gbọ́dọ̀ jáde kúrò nínú ilé. Fífarapamọ́ léwu.", "Correct! Remember this place.": "Ó tọ̀nà! Rántí ibí yìí.", "The socket near your desk is sparking and smells like burning.": "Sọ́kẹ́ẹ̀tì nítòsí tábìlì rẹ ń ta iná, ó sì ń rùn bí ohun tó ń jóná.", "Pull out the plug yourself": "Yọ pulọ́ọ̀gì náà fúnra rẹ", "Move away and tell the teacher immediately": "Kúrò níbẹ̀ kí o sì sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "You could get an electric shock.": "Iná mànàmáná lè gbá ọ.", "Correct! Never touch sparking sockets.": "Ó tọ̀nà! Má ṣe fọwọ́ kan sọ́kẹ́ẹ̀tì tó ń ta iná láé.", "Your classmate is leaning back on two chair legs.": "Ọmọ kíláàsì rẹ ń fẹ̀yìn tì lórí ẹsẹ̀ àga méjì.", "Do it too, it is fun": "Ṣe é náà, ó dùn", "Sit with all four chair legs on the floor and tell him to stop": "Jókòó pẹ̀lú ẹsẹ̀ àga mẹ́rẹ̀ẹ̀rin lórí ilẹ̀ kí o sì sọ fún un kí ó dáwọ́ dúró", "The chair can fall back and you can hit your head.": "Àga lè ṣubú sẹ́yìn kí orí rẹ sì fara pa.", "Well done! Sit properly on your chair.": "O ṣe dáadáa! Jókòó dáadáa lórí àga rẹ.", "The break bell rings and everyone rushes out.": "Agogo ìsinmi dún, gbogbo ènìyàn sì ń sáré jáde.", "Push to be the first one out": "Tì àwọn ẹlòmíràn kí o lè jáde ṣáájú", "Walk, keep to the right, and do not push": "Rìn, tọ apá ọ̀tún, má sì ṣe tì ẹnikẹ́ni", "Pushing causes falls and injuries.": "Títì ẹlòmíràn máa ń fa ìṣubú àti ìpalára.", "Correct! Walk calmly in corridors.": "Ó tọ̀nà! Rìn jẹ́jẹ́ ní ọ̀dẹ̀dẹ̀.", "Some big pupils are pushing a small boy and taking his snacks.": "Àwọn akẹ́kọ̀ọ́ ńlá kan ń ti ọmọkùnrin kékeré kan, wọ́n sì ń gba ìpanu rẹ̀.", "Join them and laugh": "Dara pọ̀ mọ́ wọn kí o sì rẹ́rìn-ín", "Do not join. Go and tell a teacher at once": "Má dara pọ̀ mọ́ wọn. Lọ sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "Bullying hurts people. Never join in.": "Ìfòòró ń pa àwọn ènìyàn lára. Má ṣe dara pọ̀ láé.", "Brave and kind! Always tell a teacher about bullying.": "O ní ìgboyà àti inú rere! Máa sọ fún olùkọ́ nípa ìfòòró nígbà gbogbo.", "There are bottles of coloured liquid on the bench and no teacher.": "Ìgò omi aláwọ̀ wà lórí bẹ́ǹṣì, kò sì sí olùkọ́.", "Smell or taste them": "Gbóòórùn wọn tàbí tọ́ wọn wò", "Do not touch. Wait for the teacher": "Má fọwọ́ kàn án. Dúró de olùkọ́", "Chemicals can burn your skin, eyes and mouth.": "Kẹ́míkà lè jó ara rẹ, ojú rẹ àti ẹnu rẹ.", "Correct! Only use the lab with a teacher.": "Ó tọ̀nà! Lo yàrá sáyẹ́ǹsì pẹ̀lú olùkọ́ nìkan.", "You have used the toilet. What next?": "O ti lo ilé ìgbọ̀nsẹ̀. Kí ló kàn?", "Go straight back to class": "Padà sí kíláàsì tààrà", "Wash hands with soap and water for 20 seconds": "Fọ ọwọ́ pẹ̀lú ọṣẹ àti omi fún ìṣẹ́jú-àáyá 20", "Germs on your hands can make you and others sick.": "Kòkòrò àrùn ní ọwọ́ rẹ lè mú ìwọ àti àwọn mìíràn ṣàìsàn.", "Great! Clean hands stop germs.": "Ó dára! Ọwọ́ mímọ́ ń dá kòkòrò àrùn dúró.", "Someone spilled hot pepper soup on the floor.": "Ẹnìkan da ọbẹ̀ ata gbígbóná sílẹ̀.", "Jump over it and run": "Fò ó kọjá kí o sì sáré", "Walk around it and tell the canteen staff": "Rìn yí i ká kí o sì sọ fún òṣìṣẹ́ ilé oúnjẹ", "You could slip and get burnt.": "O lè yọ̀ ṣubú kí ó sì jó ọ.", "Correct! Report spills so they can be cleaned.": "Ó tọ̀nà! Jábọ̀ ohun tó dà sílẹ̀ kí wọ́n lè nù ún.", "One chain on the swing is broken.": "Ẹ̀wọ̀n kan lára ẹ̀rọ ìjọ̀ngbọ̀n ti já.", "Swing anyway, very high": "Jọ̀ngbọ̀n bẹ́ẹ̀, ga gan-an", "Do not use it. Tell a teacher it is broken": "Má lò ó. Sọ // Site Life shared features for all games. Built into pages by src/build.py.
// SL.consent  privacy notice and consent (NDPA 2023)
// SL.t        translation with English fallback; SL.lang current language
// SL.settings graphics quality, text size, captions, colour-blind palette
// SL.caption  on-screen captions for spoken text
// SL.post     send a result to our server / Google Sheets with an offline queue (IndexedDB); SL.lastId, SL.certLink(id)
// SL.lms      SCORM 1.2 reporting when the game runs inside an LMS frame
const SL = (() => {
  const QS = new URLSearchParams(location.search);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sl-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sl-' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- language ----------
  const LANGS = [
    { id: 'en', name: 'English', voice: 'en' },
    { id: 'pcm', name: 'Pidgin', voice: 'en' },
    { id: 'yo', name: 'Yorùbá', voice: 'yo' },
    { id: 'ha', name: 'Hausa', voice: 'ha' },
    { id: 'ig', name: 'Igbo', voice: 'ig' },
  ];
  const I18N = (typeof SL_I18N !== 'undefined') ? SL_I18N : {};
  let lang = QS.get('lang') || store.get('lang', 'en');
  if (!LANGS.some(l => l.id === lang)) lang = 'en';
  const misses = new Set();
  function t(s) { return s == null ? '' : trText(String(s)); }
  function setLang(id) { lang = id; store.set('lang', id); }

  // Automatic on-screen translation: every text node added to the page is looked up in the
  // dictionary (exact match, then with a leading emoji/symbol prefix removed, then {0}-patterns).
  const PAT = {}, VALUES = {};
  for (const [l, d] of Object.entries(I18N)) {
    PAT[l] = Object.keys(d).filter(k => k.includes('{0}')).map(k => {
      const parts = k.split(/\{\d\}/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      return { re: new RegExp('^' + parts.join('(.+?)') + '$'), out: d[k] };
    });
    VALUES[l] = new Set(Object.values(d));
  }
  const PREFIX = /^([\s\p{Extended_Pictographic}\p{S}\p{P}‍️]*?)((?!\p{Extended_Pictographic})[\p{L}"'(].*?)([\s.!?…:]*)$/su;
  // OUT remembers what we produced, so text we already translated is not looked up (and reported missing) again
  const OUT = new Set();
  function trText(s) {
    if (lang === 'en' || !s) return s;
    if (OUT.has(String(s).trim())) return s;
    const r = trText0(s); if (r !== s) OUT.add(String(r).trim()); return r;
  }
  function trText0(s) {
    if (lang === 'en' || !s || !/\p{L}/u.test(s)) return s;
    const d = I18N[lang] || {}, core = s.trim();
    if (d[core] != null) return s.replace(core, d[core]);
    if (VALUES[lang] && VALUES[lang].has(core)) return s;
    const m = core.match(PREFIX);
    if (m) {
      const body = m[2] + m[3];
      if (d[body] != null) return s.replace(core, m[1] + d[body]);
      if (d[m[2]] != null) return s.replace(core, m[1] + d[m[2]] + m[3]);
    }
    const sub = v => (I18N[lang] || {})[v] != null ? I18N[lang][v] : v.split(', ').map(x => { const d2 = I18N[lang] || {}; return d2[x] != null ? d2[x] : x; }).join(', ');
    for (const p of PAT[lang] || []) {
      const mm = core.match(p.re); if (mm) return s.replace(core, p.out.replace(/\{(\d)\}/g, (_, i) => sub(mm[+i + 1])));
      if (m) { const m2 = (m[2] + m[3]).match(p.re); if (m2) return s.replace(core, m[1] + p.out.replace(/\{(\d)\}/g, (_, i) => sub(m2[+i + 1]))); }
    }
    if (core.length > 2 && core.length < 400) misses.add(core);
    return s;
  }
  function translateTree(root) {
    if (lang === 'en' || !root) return;
    if (root.nodeType === 3) { if (root.parentElement && root.parentElement.closest('[data-notr],textarea')) return; const v = trText(root.data); if (v !== root.data) root.data = v; return; }
    if (root.nodeType !== 1 || root.closest && root.closest('[data-notr],script,style,textarea')) return;
    for (const a of ['placeholder', 'title', 'aria-label']) if (root.hasAttribute && root.hasAttribute(a)) root.setAttribute(a, trText(root.getAttribute(a)));
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (n.nodeType === 1) { if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName) || n.hasAttribute('data-notr')) continue;
        for (const a of ['placeholder', 'title', 'aria-label']) if (n.hasAttribute(a)) n.setAttribute(a, trText(n.getAttribute(a))); continue; }
      if (n.parentElement && n.parentElement.closest('[data-notr],textarea')) continue;
      const v = trText(n.data); if (v !== n.data) n.data = v;
    }
  }
  if (lang !== 'en') {
    const mo = new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') translateTree(m.target); else m.addedNodes.forEach(translateTree); } });
    const startObs = () => { translateTree(document.body); mo.observe(document.body, { childList: true, subtree: true, characterData: true }); };
    document.body ? startObs() : addEventListener('DOMContentLoaded', startObs);
  }

  // ---------- consent ----------
  const CONSENT_V = 1;
  const consent = {
    ok() { return store.get('consent', 0) >= CONSENT_V; },
    give() { store.set('consent', CONSENT_V); },
    notice(kids) {
      return kids
        ? t('A parent or teacher should read this: the game saves the child\'s first name, stars and answers so parents and teachers can see progress. It is only sent if the game is opened from a school or family link, is kept only as long as the school decides, and is never sold or shared.')
        : t('This induction saves your name, company, role, answers and result so the HSE team can confirm you completed it. Only HSE can see the results. They are kept for the period set by the company (normally 12 months) and then deleted. You can ask HSE to see or delete your record.');
    },
    // Returns HTML for a checkbox block; call bind(modal, startBtn) after rendering.
    html(kids) {
      const ok = this.ok();
      return `<div class="consent"><label><input type="checkbox" id="slConsent" ${ok ? 'checked' : ''}> ${escH(t(kids ? 'A parent or teacher agrees to the privacy notice' : 'I have read and agree to the privacy notice'))}</label>
        <details><summary>${escH(t('Privacy notice'))}</summary><p>${escH(this.notice(kids))}</p></details></div>`;
    },
    bind(m, btn) {
      const cb = m.querySelector('#slConsent'); if (!cb) return;
      const upd = () => { if (btn) btn.disabled = !cb.checked || btn.dataset.waiting === '1'; if (cb.checked) consent.give(); else store.set('consent', 0); };
      cb.onchange = upd; upd();
    },
  };

  // ---------- settings ----------
  const DEF = { quality: 'auto', text: 1, captions: true, cb: false, voice: true };
  const settings = Object.assign({}, DEF, store.get('settings', {}));
  const save = () => store.set('settings', settings);
  function applyCss() {
    document.documentElement.style.setProperty('--fs', settings.text);
    document.documentElement.classList.toggle('cbsafe', !!settings.cb);
  }
  const autoQuality = () => (Math.min(innerWidth, innerHeight) < 700 || /Android|iPhone|iPad/i.test(navigator.userAgent)) ? 'medium' : 'high';
  function quality() { return settings.quality === 'auto' ? (store.get('autoLow', false) ? 'low' : autoQuality()) : settings.quality; }
  const markerColor = () => settings.cb ? '#1f77ff' : '#ffd400';

  // fps watchdog: switch to low quality when the device struggles (auto mode only)
  const fps = { acc: 0, n: 0, low: 0, cb: null,
    tick(dt) {
      if (settings.quality !== 'auto' || quality() === 'low') return;
      this.acc += dt; this.n++;
      if (this.acc >= 2) { const f = this.n / this.acc; this.acc = 0; this.n = 0; this.low = f < 25 ? this.low + 1 : 0;
        if (this.low >= 3) { store.set('autoLow', true); this.cb && this.cb('low'); } }
    } };

  function settingsHtml() {
    const q = settings.quality, opt = (v, l) => `<option value="${v}" ${q === v ? 'selected' : ''}>${escH(t(l))}</option>`;
    return `<h2>⚙️ ${escH(t('Settings'))}</h2>
      <p><b>${escH(t('Language'))}</b></p><div class="row" id="slLangs">${LANGS.map(l => `<button data-lang="${l.id}" class="${l.id === lang ? 'primary' : ''}">${escH(l.name)}</button>`).join('')}</div>

function normalFrom(src, strength=3){

  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=(L(x+1,y)-L(x-1,y))*strength, dy=(L(x,y+1)-L(x,y-1))*strength, l=Math.hypot(dx,dy,1), i=(y*w+x)*4;

function mergeGeos(list){
  let vC=0,iC=0; for(const {geo} of list){ vC+=geo.attributes.position.count; iC+=geo.index?geo.index.count:geo.attributes.position.count; }
  const pos=new Float32Array(vC*3), nor=new Float32Array(vC*3), uv=new Float32Array(vC*2), idx=new Uint32Array(iC);
  let vo=0, io=0; const v=new THREE.Vector3(), nm=new THREE.Matrix3();
  for(const {geo,matrix} of list){ const P=geo.attributes.position, N=geo.attributes.normal, U=geo.attributes.uv; nm.getNormalMatrix(matrix);
    for(let i=0;i<P.count;i++){ v.fromBufferAttribute(P,i).applyMatrix4(matrix); pos[(vo+i)*3]=v.x; pos[(vo+i)*3+1]=v.y; pos[(vo+i)*3+2]=v.z;
      if(N){ v.fromBufferAttribute(N,i).applyMatrix3(nm).normalize(); nor[(vo+i)*3]=v.x; nor[(vo+i)*3+1]=v.y; nor[(vo+i)*3+2]=v.z; }
      if(U){ uv[(vo+i)*2]=U.getX(i); uv[(vo+i)*2+1]=U.getY(i); } }
    if(geo.index){ for(let i=0;i<geo.index.count;i++) idx[io+i]=geo.index.getX(i)+vo; io+=geo.index.count; } else { for(let i=0;i<P.count;i++) idx[io+i]=vo+i; io+=P.count; }
    vo+=P.count; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeBoundingSphere(); return g;
}
function consolidate(root){
  const groups=[]; root.traverse(o=>{ if(o.children && o.children.length) groups.push(o); });
  for(const grp of groups){
    const buckets=new Map();
    for(const c of grp.children.slice()){ if(!c.isMesh || c.isInstancedMesh || c.children.length || c.userData.keep || Array.isArray(c.material)) continue; const k=c.material.uuid; if(!buckets.has(k)) buckets.set(k,[]); buckets.get(k).push(c); }
    for(const arr of buckets.values()){ if(arr.length<2) continue; arr.forEach(m=>m.updateMatrix());
      const nmsh=new THREE.Mesh(mergeGeos(arr.map(m=>({geo:m.geometry,matrix:m.matrix}))),arr[0].material); nmsh.castShadow=arr.some(m=>m.castShadow); nmsh.receiveShadow=true; arr.forEach(m=>grp.remove(m)); grp.add(nmsh); }
  }
  return root;
}

function setPPE(g,p){
  const u=g.userData; if(!u.ppe) return;

  u.legs.forEach(l=>{ l.shoe.visible=!p.boots; l.boot.visible=!!p.boots; });
  if(p.muffs && p.hat){ u.ppe.muffs.position.y=0; }
}
function animHuman(g,step,moving,t,seated){
  const u=g.userData; if(u.gltf){ animGLTF(u,moving&&!seated,t); return; }
  if(!u.legs) return;
  if(seated){ u.legs.forEach(l=>{l.hp.rotation.x=1.45; l.kn.rotation.x=-1.45;}); u.arms.forEach(a=>{a.sh.rotation.x=.9; a.el.rotation.x=.35;}); return; }
  const s=step, a=moving? Math.sin(s):0;
  u.legs[0].hp.rotation.x= a*.42; u.legs[1].hp.rotation.x=-a*.42;
  u.legs[0].kn.rotation.x= moving? -Math.max(0,Math.sin(s+Math.PI*.5))*.7-.04 : -.02;
  u.legs[1].kn.rotation.x= moving? -Math.max(0,Math.sin(s-Math.PI*.5))*.7-.04 : -.02;
  u.arms[0].sh.rotation.x=-a*.36; u.arms[1].sh.rotation.x=a*.36;
  u.arms.forEach((x,i)=>{ x.el.rotation.x= moving? .32 : .1+Math.sin(t*1.3+i)*.03; });
  u.hips.position.y = .95 + (moving? Math.abs(Math.cos(s))*.022 : Math.sin(t*2.2)*.003);
  u.hips.rotation.y = moving? a*.06 : 0;
  u.torso.scale.x = 1 + Math.sin(t*2.2)*.006;
  if(!moving) u.head.rotation.y = Math.sin(t*.45)*.18;
}

// Everything here is optional and lazy: nothing is fetched unless a glTF URL is given (opts.gltf,
// a global SL_AVATAR_URL, or placeSiteModel). On any failure (offline, blocked CDN, bad file) it

// opts: x, y (map units), rot (radians about Y), scale (default 1), elev (m, default 0). Resolves the model, or null on failure.

// ---------- WebXR VR mode (ROADMAP 14) ----------
// XR.setup(renderer, scene, camera, opts) shows a "🥽 Enter VR" button only when the browser has an
// immersive-vr device; otherwise it does nothing else (no objects, no listeners).
// opts: frame(t)       one game frame (update + render3D); called from renderer.setAnimationLoop in VR.
//                      Without it XR renders scene/camera itself.
//       getPlayer()    -> {x, y} map position; the VR viewpoint (rig) follows it.
//       getYaw()       -> camera yaw when entering VR (0 = north / -Z).
//       onTeleport(x,y) map position the user pointed at on the floor (trigger, or flick the thumbstick forward).
//       interactive    array of meshes/groups the controller can select; onSelect(obj, hit) is called.

    btn.onclick=()=>{ session? session.end() : enter().catch(e=>console.warn('Site Life: VR could not start',e)); };

    marker.rotation.x=-Math.PI/2; marker.visible=false; SC.add(marker);

    y+=16; P.rects=[]; c.font='bold 34px system-ui,sans-serif';
    P.options.forEach((o,i)=>{ const ls=wrap(c,(i+1)+'. '+o,W-pad*2-40).slice(0,3), h=ls.length*42+28; P.rects.push({x:pad,y,w:W-pad*2,h,ls}); y+=h+14; });
    P.W=W; P.H=Math.ceil(y+pad-14); P.rows=rows;
  }
  function drawPanel(){
    const P=panel, cv=P.canvas; cv.width=P.W; cv.height=P.H; const c=cv.getContext('2d');
    c.fillStyle='rgba(16,26,32,.94)'; rr(c,0,0,P.W,P.H,36); c.fill(); c.strokeStyle='#0f7a4f'; c.lineWidth=8; rr(c,4,4,P.W-8,P.H-8,32); c.stroke();
    for(const r of P.rows){ c.font=r.f; c.fillStyle=r.col; c.fillText(r.t,40,r.y); }
    c.font='bold 34px system-ui,sans-serif';
    P.rects.forEach((r,i)=>{ c.fillStyle=i===P.hover?'#ffd400':'#2b3b45'; rr(c,r.x,r.y,r.w,r.h,18); c.fill(); c.fillStyle=i===P.hover?'#1d1f22':'#ffffff'; r.ls.forEach((l,k)=>c.fillText(l,r.x+20,r.y+14+34+k*42)); });
    P.tex.needsUpdate=true;
  }
  function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function showPanel(title,options,cb,o={}){
    if(!st.active) return null;
    hidePanel();
    const canvas=document.createElement('canvas'), tx=new THREE.CanvasTexture(canvas); tx.encoding=THREE.sRGBEncoding;
    panel={title:String(title||''),text:o.text||'',options:(options||[]).map(String),cb,hover:-1,canvas,tex:tx};
    layout(); drawPanel();
    const w=1.3, h=w*panel.H/panel.W;
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tx,transparent:true,depthTest:false,depthWrite:false,toneMapped:false,side:THREE.DoubleSide}));
    m.renderOrder=999; panel.mesh=m;
    // 1.4 m in front of the head, at eye height, facing the user
    const head=new THREE.Vector3(), dir=new THREE.Vector3(); CAM.getWorldPosition(head); CAM.getWorldDirection(dir); dir.y=0; if(dir.lengthSq()<1e-4) dir.set(0,0,-1); dir.normalize();
    m.position.copy(head).addScaledVector(dir,1.4); m.position.y=Math.max(.9,head.y-.05); m.lookAt(head.x,m.position.y,head.z);
    SC.add(m);
    return {close:hidePanel};
  }
  function hidePanel(){ if(!panel) return; SC&&SC.remove(panel.mesh); panel.mesh.geometry.dispose(); panel.mesh.material.dispose(); panel.tex.dispose(); panel=null; lastSig=''; }
  // ----- mirror the game's DOM modals as panels while in VR -----
  function watchModals(){
    if(O.mirror===false) return;
    const root=O.modalRoot||document.getElementById('ovl'); if(!root) return;
    mo=new MutationObserver(()=>{ clearTimeout(moT); moT=setTimeout(()=>mirror(root),60); });
    mo.observe(root,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','class']});
    mirror(root);
  }
  function mirror(root){
    if(!st.active) return;
    const m=root.querySelector('.modal');
    if(!m){ if(panel&&panel.mirrored) hidePanel(); return; }
    const btns=[...m.querySelectorAll('button:not([disabled]), a.btnlink')].filter(b=>b.getClientRects().length && (b.textContent||'').trim()).slice(0,8); // colour swatches etc. have no text
    const title=((m.querySelector('h1,h2')||{}).textContent||'').trim();
    const fb=m.querySelector('#fb .fb'), p=m.querySelector('p.qt')||[...m.querySelectorAll('p')].find(x=>!x.classList.contains('muted'));
    const text=[p&&p.textContent.trim(), fb&&fb.textContent.trim()].filter(Boolean).join('\n').slice(0,420);
    const labels=btns.map(b=>b.textContent.trim());

    showPanel(title,labels,i=>{ const b=btns[i]; if(b&&b.isConnected) b.click(); },{text});
    if(panel){ panel.mirrored=true; lastSig=sig; }
  }
  return { setup, showPanel, hidePanel, enter, get active(){ return st.active; }, get supported(){ return st.supported; }, interactive:st.interactive, _mirror:mirror };
})();

const MISS = DATA.missions;

function ask(m, onDone){
  const q=m.q; const opts=shuffle(q.o.map((o,i)=>({o,i})));
  const mm=openModal(`<div class="who"><span class="av">${q.e}</span><div><div class="muted" style="font-size:.85rem">${esc(q.who)}</div><h2>${esc(m.name)}</h2></div><button class="spk" id="spk" title="Read aloud">🔊</button></div>

  speak(tr(q.text)+'. '+opts.map(({o},k)=>tr('Option')+' '+(k+1)+': '+tr(o.t)).join('. '));
  mm.querySelector('#spk').onclick=()=>{ const v=SL.settings.voice; SL.settings.voice=true; speak(q.text); SL.settings.voice=v; };
  mm.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const o=q.o[+b.dataset.i]; mm.querySelectorAll('[data-i]').forEach(x=>x.disabled=true);
    if(o.ok){ S.stars++; chime(); } else { buzz(); S.mistakes.push({where:m.name,why:o.why}); if(o.heart) loseHeart(); }

  });

function blocked(x,y,r){ for(const b of SOLIDS){ const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h); if((x-cx)**2+(y-cy)**2<r*r) return true; } return x<5||y<5||x>WW-5||y>WH-5; }

    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx,ny=y+dy; if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx; if(GRID[j]||closed[j]) continue; if(dx&&dy&&(GRID[y*GW+nx]||GRID[ny*GW+x])) continue;

  for(const v of VEH){
    const L=LANES[v.lane]; let stop=false;
    const zx=930, ahead=(zx-v.x)*L.dir;
    if((onZebra||(inRoad&&Math.abs(p.x-v.x)<260)) && ahead>40 && ahead<260) stop=true;
    for(const o of VEH){ if(o!==v && o.lane===v.lane){ const d=(o.x-v.x)*L.dir; if(d>0&&d<v.len+60) stop=true; } }

function update(dt){
  S.t+=dt; const p=S.p;
  if(S.phase==='ride'){ S.rideT+=dt; const v=VEH.find(v=>v.bus); v.x-=Math.min(160,40+S.rideT*60)*dt; if(S.rideT>5) endGame(true); return; }
  if(keys.ArrowLeft) yaw+=2.2*dt; if(keys.ArrowRight) yaw-=2.2*dt;
  let fwd=0,str=0; if(keys.KeyW||keys.ArrowUp) fwd+=1; if(keys.KeyS||keys.ArrowDown) fwd-=1; if(keys.KeyD) str+=1; if(keys.KeyA) str-=1; if(joy){ fwd=-joy.dy; str=joy.dx; }
  const fx=-Math.sin(yaw), fy=-Math.cos(yaw), rx=Math.cos(yaw), ry=-Math.sin(yaw); let mx=fx*fwd+rx*str, my=fy*fwd+ry*str; const len=Math.hypot(mx,my); p.moving=len>.1;
  if(p.moving){ const sp=95*(len>1?1/len:1); mx*=sp; my*=sp; if(!blocked(p.x+mx*dt,p.y,10)) p.x+=mx*dt; if(!blocked(p.x,p.y+my*dt,10)) p.y+=my*dt; p.face=Math.atan2(-mx,-my); p.step+=dt*11; }
  if(WORLD==='home') vehiclesUpdate(dt);
  if(S.drill&&!S.drill.done){ const d=S.drill; d.left-=dt; d.smokeR+=dt*8; if(Math.floor(S.t*1.5)%2===0) beep(Math.floor(S.t*1.5)%4<2?900:700,.05,'square',.02);
    $('timer').textContent='🚨 '+Math.max(0,Math.ceil(d.left))+'s';
    if(dist(p.x,p.y,1150,240)<d.smokeR && S.t-S.lastHit>3){ S.lastHit=S.t; loseHeart(); toast('😷 Smoke! Move away from the lab!','bad'); }
    if(dist(p.x,p.y,750,760)<70){ d.done=true; S.stars++; toast('⭐ You reached the assembly point. Your teacher counted you!'); endGame(true); return; }
    if(d.left<=0){ S.mistakes.push({where:'Fire drill',why:'You did not reach the assembly point in time. Know where it is before you need it.'}); endGame(false); return; } }
  guideUpdate(dt);
  const near=interactables().filter(i=>dist(p.x,p.y,i.x,i.y)<i.r).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y))[0]; S.near=near;
  if(near&&near.auto&&!paused&&dist(p.x,p.y,near.x,near.y)<near.r*.75){ near.run(); return; }

  else { $('prompt').classList.add('hidden'); $('act').textContent='E'; $('act').disabled=true; }
}

  G.scene.traverse(o=>{ if(o.userData&&o.userData.decor) o.visible=q!=='low'; });

  const m=$('mini'), c=m.getContext('2d'), sx=m.width/WW, sy=m.height/WH; c.fillStyle='#9bbf7a'; c.fillRect(0,0,m.width,m.height);
  ROADS.forEach(r=>{ c.fillStyle='#555'; c.fillRect(r.x1*sx,r.y1*sy,(r.x2-r.x1)*sx,(r.y2-r.y1)*sy); }); c.fillStyle='#8a7f72'; SOLIDS.forEach(b=>c.fillRect(b.x*sx,b.y*sy,Math.max(1,b.w*sx),Math.max(1,b.h*sy)));
  MISS.forEach(mm=>{ if(!mm.r||!missionActive(mm)) return; c.fillStyle='#e0b800'; c.fillRect(mm.x*sx-2,mm.y*sy-2,4,4); });
  if(S.guide&&S.guide.path&&guideOn){ c.strokeStyle='#0f7a4f'; c.lineWidth=2; c.setLineDash([3,2]); c.beginPath(); S.guide.path.forEach(([x,y],i)=>i?c.lineTo(x*sx,y*sy):c.moveTo(x*sx,y*sy)); c.stroke(); c.setLineDash([]); }
  c.fillStyle='#e00'; c.beginPath(); c.arc(S.p.x*sx,S.p.y*sy,3.5,0,7); c.fill();
  const gp=$('guidePanel'), T=S.guide&&S.guide.target;
  if(guideOn&&T&&S.guide.path&&started&&!S.over&&$('prompt').classList.contains('hidden')&&S.phase==='play'){ gp.classList.remove('hidden'); const pth=S.guide.path, nx=pth[Math.min(3,pth.length-1)], dx=nx[0]-S.p.x, dy=nx[1]-S.p.y, fx=-Math.sin(yaw), fy=-Math.cos(yaw); $('gArrow').style.transform=`rotate(${Math.atan2(fx*dy-fy*dx,fx*dx+fy*dy)}rad)`; $('gText').textContent=`Next: ${T.name} · ${Math.max(1,Math.round(pathLen(pth)*K))} m`; } else gp.classList.add('hidden');
  // hazard hint: warmer/colder for remaining dangers
  const left=S.items.filter(i=>i.h&&!i.done); const doneQ=MISS.filter(m=>m.id in S.results).length; if(left.length && (WORLD==='home'? doneQ>=5 && !('gate' in S.results) : MISS.filter(m=>m.q).every(m=>m.id in S.results))){ const dmin=Math.min(...left.map(i=>dist(S.p.x,S.p.y,i.x,i.y))); $('hint2').classList.remove('hidden'); $('hint2').textContent= dmin<120?'🔥 Hot! A danger is very close':dmin<300?'🌡️ Warm, keep looking':'❄️ Cold, look somewhere else'; } else $('hint2').classList.add('hidden');
}

// ================== LOOP & INPUT ==================
let last=performance.now(), hudT=0;
function loop(now){ const dt=Math.min(.05,(now-last)/1000); last=now; if(G&&S){ if(!started) renderIntro(now/1000); else { if(!paused) SL.fps.tick(dt); if(!paused&&!S.over) update(dt); render3D(dt); hudT+=dt; if(hudT>.12){ hudT=0; drawHUD(); } } } requestAnimationFrame(loop); }
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||paused) return; keys[e.code]=true; if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doAct(); } if(e.code==='KeyV') firstPerson=!firstPerson; if(e.code.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });
function bindInput(){ const cv=$('game');
  cv.addEventListener('pointerdown',e=>{ ensureAudio(); if(paused||!started) return; cv.setPointerCapture(e.pointerId); if(e.pointerType!=='mouse'&&e.clientX<innerWidth*.5&&!joy){ joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0}; const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform=''; } else if(!look) look={id:e.pointerId,x:e.clientX,y:e.clientY}; });
  cv.addEventListener('pointermove',e=>{ if(joy&&e.pointerId===joy.id){ let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const l=Math.hypot(dx,dy), m=50; if(l>m){dx=dx/l*m; dy=dy/l*m;} joy.dx=dx/m; joy.dy=dy/m; $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`; } else if(look&&e.pointerId===look.id){ yaw-=(e.clientX-look.x)*.006; pitch=clamp(pitch+(e.clientY-look.y)*.004,.12,1.1); look.x=e.clientX; look.y=e.clientY; } });
  const end=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; $('joy').classList.add('hidden'); } if(look&&e.pointerId===look.id) look=null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  $('act').onclick=doAct; $('camBtn').onclick=()=>{ if(!paused) firstPerson=!firstPerson; };
  $('guideBtn').onclick=()=>{ guideOn=!guideOn; $('guideBtn').textContent='🧭 Guide: '+(guideOn?'ON':'OFF'); };
  const vb=()=>{ $('voiceBtn').textContent=SL.settings.voice?'🗣️ Voice: ON':'🗣️ Voice: OFF'; }; vb();
  $('voiceBtn').onclick=()=>{ SL.settings.voice=!SL.settings.voice; SL.store.set('settings',SL.settings); vb(); if(!SL.settings.voice) SL.stopSpeak(); };
  $('setBtn').onclick=()=>{ if(!paused) openSettings(); };
  $('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };
  $('tasksBtn').onclick=()=>{ if(paused) return; const m=openModal(`<h2>📋 My jobs</h2><ul class="tasks">${MISS.map(mm=>{ const r=S.results[mm.id]; return `<li><span>${r===true?'✅':r===false?'⚠️':'⬜'}</span><span>${esc(mm.hint||mm.name)}</span></li>`; }).join('')}<li><span>🔎</span><span>Find ${S.hazTotal} hidden dangers (tap LOOK when you see a ❓)</span></li></ul><button class="primary" id="cl">Close</button>`); m.querySelector('#cl').onclick=closeModal; };
}
function setHud(on){ ['hud','act','camBtn','guideBtn','voiceBtn','muteBtn','setBtn','tasksBtn'].forEach(id=>$(id).classList.toggle('hidden',!on)); if(!on){ $('prompt').classList.add('hidden'); $('guidePanel').classList.add('hidden'); $('hint2').classList.add('hidden'); } }

// ================== START ==================
function showStart(){
  setHud(false); started=false; newGame(); if(G) resetDynamic(); paused=true;
  const m=openModal(`<div class="row" style="justify-content:space-between"><a class="btnlink" href="index.html">◀ All games</a><span class="pill">For children 6–12</span></div>
    <h1 style="margin:.4em 0 .1em">${DATA.icon} ${esc(DATA.title)}</h1><p class="muted">${esc(DATA.intro)}</p>
    <p><b>Your name</b></p><input id="nm" maxlength="24" placeholder="e.g. Ada" value="${esc(kid.name)}">
    <p><b>I am a</b></p><div class="row"><button data-x="f" class="${kid.sex==='f'?'primary':''}">👧🏾 Girl</button><button data-x="m" class="${kid.sex==='m'?'primary':''}">👦🏾 Boy</button></div>
    <p class="muted" style="margin:.6em 0 .3em">Uniform colour and skin tone</p>
    <div class="row">${UNIS.map(c=>`<button class="sw ${c===kid.uni?'on':''}" data-u="${c}" style="background:${c}"></button>`).join('')}</div>
    <div class="row" style="margin-top:6px">${SKINS.map(c=>`<button class="sw ${c===kid.skin?'on':''}" data-s="${c}" style="background:${c}"></button>`).join('')}</div>
    ${SL.consent.html(true)}
    <div class="row" style="margin-top:14px"><button class="primary big2" id="start">Let's go! ▶</button><button id="stSet">⚙️ Language &amp; settings</button></div>
    <p class="muted" style="font-size:.85rem;margin-top:10px">🎮 Drag the left side of the screen to walk, drag the right side to look. Questions pop up when you reach a yellow ring. Tap LOOK when you see a ❓. 🗣️ Questions are read aloud.</p>`);
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{ kid.sex=b.dataset.x; m.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('primary',x===b)); });
  m.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{ kid.uni=b.dataset.u; m.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('on',x===b)); });
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ kid.skin=b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b)); });
  SL.consent.bind(m,null); m.querySelector('#stSet').onclick=()=>openSettings(showStart);
  m.querySelector('#start').onclick=()=>{ if(!SL.consent.ok()){ const c=m.querySelector('.consent'); c.style.outline='3px solid var(--bad)'; c.scrollIntoView({block:'center'}); toast(tr('Please ask a parent or teacher to tick the privacy box.'),'bad'); return; } ensureAudio(); kid.name=(m.querySelector('#nm').value.trim()||'Safety Star').slice(0,24); resetDynamic(); started=true; closeModal(); setHud(true);
    toast(WORLD==='home'?'☀️ Good morning, '+kid.name+'! Follow Mummy and the yellow arrows.':'🏫 Welcome to school, '+kid.name+'! Follow your teacher and the yellow arrows.'); speak(DATA.intro); };
}
window.addEventListener('load',()=>{
  if(!window.THREE){ $('loading').innerHTML='Could not load the 3D engine. Please check your internet connection.'; return; }
  try{ newGame(); initScene(); spawnNPCs(); }catch(err){ $('loading').textContent='Your device could not start 3D.'; console.error(err); return; }
  $('loading').remove(); document.title=DATA.title; bindInput(); showStart(); requestAnimationFrame(loop);
});

</script></body></html>
