 "FÀDÁKÀ", "BRONZE": "BÀBÀ", "{0} SAFETY STAR": "ÌRÀWỌ̀ ÀÀBÒ {0}", "{0} stars · 🔎 {1} dangers found · ❤️ {2} hearts left": "{0} ìràwọ̀ · 🔎 ewu {1} tí o rí · ❤️ ọkàn {2} tó kù", "Well done {0}! You are a {1} safety star!": "O ṣe dáadáa {0}! Ìwọ ni ìràwọ̀ ààbò {1}!", "You ran out of hearts. Every mistake is a chance to learn!": "Ọkàn rẹ ti tán. Gbogbo àṣìṣe jẹ́ àǹfààní láti kẹ́kọ̀ọ́!", "What we learned": "Ohun tí a kọ́", "Perfect! No mistakes at all. 🌟": "Ó pé! Kò sí àṣìṣe rárá. 🌟", "Try again": "Tún gbìyànjú", "Send to Mummy/Daddy": "Fi ránṣẹ́ sí Màmá/Bàbá", "The school bus is coming! Wait behind the yellow line.": "Ọkọ̀ ilé-ìwé ń bọ̀! Dúró sẹ́yìn ìlà aláwọ̀ ìyeyè.", "The bus has stopped. Now you can get on.": "Ọkọ̀ ti dúró. O lè wọ̀ ọ́ báyìí.", "Off to school! Seatbelt on.": "A ń lọ sí ilé-ìwé! So bẹ́líìtì ìjókòó.", "Get off the road! Only cross at the zebra crossing.": "Kúrò lójú ọ̀nà! Ọ̀nà abilà nìkan ni kí o ti sọdá.", "Well done! You crossed at the zebra and the cars stopped.": "O ṣe dáadáa! O sọdá ní ọ̀nà abilà, àwọn mọ́tò sì dúró.", "You reached the assembly point. Your teacher counted you!": "O ti dé ibi ìpéjọ. Olùkọ́ rẹ ti kà ọ́!", "Great job! Your teacher says: \"Let us practise a fire drill soon.\"": "Iṣẹ́ takuntakun! Olùkọ́ rẹ sọ pé: \"Ẹ jẹ́ ká ṣe ìdánrawò iná láìpẹ́.\"", "Fire drill! Walk quickly to the assembly point. Do not go back for anything.": "Ìdánrawò iná! Rìn kíákíá lọ sí ibi ìpéjọ. Má ṣe padà lọ mú nǹkan kankan.", "Bedroom": "Yàrá ìsùn", "Bathroom": "Balùwẹ̀", "Kitchen": "Ilé ìdáná", "Sitting room": "Pálọ̀", "Store room": "Yàrá ìkẹ́rùsí", "Generator": "Jẹnẹrétọ̀", "Well": "Kànga", "Gate": "Ẹnu-ọ̀nà", "Walkway": "Ọ̀nà ẹlẹ́sẹ̀", "Zebra crossing": "Ọ̀nà abilà", "Cross at the zebra": "Sọdá ní ọ̀nà abilà", "Cross the road on the zebra crossing": "Sọdá títì ní ọ̀nà abilà", "Bus stop": "Ibùdókọ̀", "Bus stop (wait)": "Ibùdókọ̀ (dúró)", "Board the bus": "Wọ ọkọ̀", "School gate": "Ẹnu-ọ̀nà ilé-ìwé", "Assembly ground": "Pápá ìpéjọ", "ASSEMBLY POINT": "IBI ÌPÉJỌ", "assembly point": "ibi ìpéjọ", "Classroom 1": "Kíláàsì 1", "Classroom 2": "Kíláàsì 2", "Corridor": "Ọ̀dẹ̀dẹ̀", "Behind the block": "Lẹ́yìn ilé", "Science lab": "Yàrá ìmọ̀ sáyẹ́ǹsì", "Toilets": "Ilé ìgbọ̀nsẹ̀", "Canteen staff": "Òṣìṣẹ́ ilé oúnjẹ", "Playground": "Pápá ìṣeré", "Sick bay": "Yàrá aláìsàn", "Bus park": "Ibi ìgbọ́kọ̀sí ọkọ̀ ilé-ìwé", "Teacher": "Olùkọ́", "Mummy": "Màmá", "Daddy": "Bàbá", "Stranger": "Àjèjì", "Brother": "Ẹ̀gbọ́n/Àbúrò ọkùnrin", "Your brother": "Àbúrò rẹ ọkùnrin", "Crossing guard": "Olùtọ́jú ọ̀nà", "Gatekeeper": "Olùṣọ́ ẹnu-ọ̀nà", "Nurse": "Nọ́ọ̀sì", "School nurse": "Nọ́ọ̀sì ilé-ìwé", "Bus attendant": "Olùtọ́jú ọkọ̀", "Your bedroom": "Yàrá rẹ", "Mummy in the kitchen": "Màmá ní ilé ìdáná", "The well": "Kànga náà", "A stranger at the gate": "Àjèjì ní ẹnu-ọ̀nà", "Walking to the bus stop": "Rírìn lọ sí ibùdókọ̀", "A man in a car outside": "Ọkùnrin kan nínú mọ́tò níta", "Your classmate": "Ọmọ kíláàsì rẹ", "A younger pupil": "Akẹ́kọ̀ọ́ kékeré kan", "Your phone charger wire is cut and you can see the copper inside. What should you do?": "Wáyà ṣájà fóònù rẹ ti gé, o sì ń rí bàbà inú rẹ̀. Kí ni o yẹ kí o ṣe?", "Use it quickly, it still works": "Lò ó kíákíá, ó ṣì ń ṣiṣẹ́", "Do not touch it. Unplug nothing. Tell Mummy or Daddy": "Má fọwọ́ kàn án. Má yọ nǹkan kankan. Sọ fún Màmá tàbí Bàbá", "Broken wires can shock you or start a fire. Never touch them.": "Wáyà tó ti gé lè gbá ọ ní iná tàbí dá iná sílẹ̀. Má ṣe fọwọ́ kàn wọ́n láé.", "Correct! Always tell an adult about broken wires.": "Ó tọ̀nà! Máa sọ fún àgbàlagbà nípa wáyà tó ti gé nígbà gbogbo.", "The bathroom floor is wet and soapy. What do you do?": "Ilẹ̀ balùwẹ̀ tutù, ọṣẹ sì wà níbẹ̀. Kí ni o máa ṣe?", "Run and slide, it is fun!": "Sáré kí o sì yọ̀, ó dùn!", "Walk slowly, hold on, and dry the floor or tell an adult": "Rìn díẹ̀díẹ̀, di nǹkan mú, kí o sì nu ilẹ̀ tàbí sọ fún àgbàlagbà", "Wet floors are slippery. You can fall and hit your head.": "Ilẹ̀ tó tutù máa ń yọ̀. O lè ṣubú kí orí rẹ sì fara pa.", "Well done! Walk slowly on wet floors.": "O ṣe dáadáa! Rìn díẹ̀díẹ̀ lórí ilẹ̀ tó tutù.", "A pot of stew is boiling on the gas cooker and the handle is sticking out. What should you do?": "Ìkòkò ọbẹ̀ ń hó lórí ìdáná gáàsì, ọwọ́ rẹ̀ sì yọ síta. Kí ni o yẹ kí o ṣe?", "Grab the handle to look inside": "Di ọwọ́ ìkòkò mú láti wo inú rẹ̀", "Stay away from the cooker and tell Mummy about the handle": "Jìnnà sí ìdáná kí o sì sọ fún Màmá nípa ọwọ́ ìkòkò", "Hot pots can fall and burn you badly. Stay away from the cooker.": "Ìkòkò gbígbóná lè ṣubú kí ó sì jó ọ gidigidi. Jìnnà sí ìdáná.", "Correct! Keep away from hot things in the kitchen.": "Ó tọ̀nà! Jìnnà sí àwọn nǹkan gbígbóná ní ilé ìdáná.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ti mú iná lọ. Àbúrò rẹ gbé àbẹ́là tó ń jó sí ẹ̀gbẹ́ aṣọ fèrèsé. Kí ni o máa ṣe?", "Leave it, the candle is small": "Fi sílẹ̀, àbẹ́là náà kéré", "Tell an adult to move it away and use a rechargeable lamp": "Sọ fún àgbàlagbà kí ó gbé e kúrò kí ẹ sì lo àtùpà ìgbàná", "Curtains catch fire very fast. A small flame can burn the whole house.": "Aṣọ fèrèsé máa ń tètè gbiná. Iná kékeré lè jó gbogbo ilé.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ó dára! Jẹ́ kí iná jìnnà sí aṣọ fèrèsé, tàbí lo àtùpà ìgbàná.", "You see some sweet-looking tablets on the table. What should you do?": "O rí àwọn òògùn tó dà bí súwíìtì lórí tábìlì. Kí ni o yẹ kí o ṣe?", "Taste one, it looks like sweets": "Tọ́ ọ̀kan wò, ó dà bí súwíìtì", "Do not touch. Tell an adult to keep it out of reach": "Má fọwọ́ kàn án. Sọ fún àgbàlagbà kí ó gbé e sí ibi tí ọwọ́ kò ti lè tó o", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Òògùn lè mú ọ ṣàìsàn gidigidi. Gba òògùn lọ́wọ́ òbí tàbí dókítà nìkan.", "Correct! Never eat medicine on your own.": "Ó tọ̀nà! Má ṣe lo òògùn fúnra rẹ láé.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jẹnẹrétọ̀ Bàbá ń ṣiṣẹ́ nítòsí fèrèsé ilé ìdáná. Kí ni o yẹ kí o ṣe?", "Go and touch it to see if it is hot": "Lọ fọwọ́ kàn án láti mọ̀ bóyá ó gbóná", "Stay away and tell Daddy it must be far from windows and doors": "Jìnnà sí i kí o sì sọ fún Bàbá pé ó gbọ́dọ̀ jìnnà sí fèrèsé àti ilẹ̀kùn", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jẹnẹrétọ̀ máa ń gbóná gan-an, èéfín rẹ̀ sì jẹ́ májèlé (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ó tọ̀nà! Èéfín jẹnẹrétọ̀ lè pa ènìyàn. Ó gbọ́dọ̀ wà níta, jìnnà sí fèrèsé.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Ìdérí kànga wà ní ṣíṣí. Bọ́ọ̀lù rẹ yí lọ sí ẹ̀gbẹ́ rẹ̀. Kí ni o máa ṣe?", "Run and get the ball": "Sáré lọ mú bọ́ọ̀lù náà", "Stay away and call an adult to get the ball and close the well": "Jìnnà sí i kí o sì pe àgbàlagbà láti mú bọ́ọ̀lù kí ó sì dé kànga", "You could fall into the well. Always stay away from open wells.": "O lè já sínú kànga. Máa jìnnà sí kànga tó ṣí sílẹ̀ nígbà gbogbo.", "Correct! Never play near an open well or soakaway.": "Ó tọ̀nà! Má ṣe ṣeré nítòsí kànga tàbí ihò ìdọ̀tí tó ṣí sílẹ̀ láé.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ẹ n lẹ́ o! Màmá rẹ ló rán mi láti mú ọ lọ sí ilé-ìwé. Tẹ̀lé mi.\"", "Go with him, he knows Mummy": "Tẹ̀lé e, ó mọ Màmá", "Do not open the gate. Run back and tell Mummy": "Má ṣí ẹnu-ọ̀nà. Sáré padà kí o sì sọ fún Màmá", "Never go with someone you do not know. Strangers can say anything.": "Má ṣe tẹ̀lé ẹni tí o kò mọ̀ láé. Àjèjì lè sọ ohunkóhun.", "Excellent! Never go with a stranger. Always tell your parents.": "Ó dára jù! Má ṣe tẹ̀lé àjèjì láé. Máa sọ fún àwọn òbí rẹ nígbà gbogbo.", "Where should you walk on the street?": "Níbo ló yẹ kí o rìn lójú pópó?", "In the middle of the road": "Ní àárín títì", "On the walkway, holding an adult's hand": "Lórí ọ̀nà ẹlẹ́sẹ̀, kí o di ọwọ́ àgbàlagbà mú", "Cars, okadas and kekes use the road. You could be hit.": "Mọ́tò, ọ̀kadà àti kẹ̀kẹ́ ń lo títì. Wọ́n lè gbá ọ.", "Correct! Walk on the walkway and hold an adult's hand.": "Ó tọ̀nà! Rìn lórí ọ̀nà ẹlẹ́sẹ̀ kí o sì di ọwọ́ àgbàlagbà mú.", "You want to cross the road. What do you do first?": "O fẹ́ sọdá títì. Kí ni o máa kọ́kọ́ ṣe?", "Run across quickly": "Sáré sọdá kíákíá", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Dúró ní ọ̀nà abilà, wo òsì, ọ̀tún, òsì lẹ́ẹ̀kan sí i, kí o sì dúró kí àwọn mọ́tò dúró", "Running across the road is very dangerous.": "Sísáré sọdá títì léwu gan-an.", "Well done! Stop, look and listen before you cross.": "O ṣe dáadáa! Dúró, wò, kí o sì fetí sílẹ̀ kí o tó sọdá.", "The school bus is coming. Where should you stand?": "Ọkọ̀ ilé-ìwé ń bọ̀. Níbo ló yẹ kí o dúró sí?", "At the edge of the road, ready to jump in": "Ní etí títì, ní ìmúrasílẹ̀ láti bẹ́ wọlé", "Behind the yellow line until the bus stops completely": "Lẹ́yìn ìlà aláwọ̀ ìyeyè títí ọkọ̀ yóò fi dúró pátápátá", "You could fall or be hit by the bus. Stay back.": "O lè ṣubú tàbí kí ọkọ̀ gbá ọ. Dúró sẹ́yìn.", "Correct! Wait behind the line until the bus stops.": "Ó tọ̀nà! Dúró sẹ́yìn ìlà títí ọkọ̀ yóò fi dúró.", "You are on the bus. What should you do?": "O ti wà nínú ọkọ̀. Kí ni o yẹ kí o ṣe?", "Stand up and put your head out of the window": "Dìde dúró kí o sì yọ orí rẹ síta fèrèsé", "Sit down, fasten your seatbelt and keep hands inside": "Jókòó, so bẹ́líìtì ìjókòó, kí o sì pa ọwọ́ mọ́ inú", "Never put your head or hands out of a moving bus.": "Má ṣe yọ orí tàbí ọwọ́ síta ọkọ̀ tó ń lọ láé.", "Excellent! Sit down and wear your seatbelt.": "Ó dára jù! Jókòó kí o sì so bẹ́líìtì ìjókòó.", "\"Your Daddy is busy. I will take you home. Get in my car.\"": "\"Bàbá rẹ kò ráyè. Màá gbé ọ lọ sí ilé. Wọ mọ́tò mi.\"", "Get in, he looks nice": "Wọlé, ó dà bí ènìyàn rere", "Say NO, stay inside, and tell the gatekeeper or teacher": "Sọ pé RÁRÁ, dúró sínú, kí o sì sọ fún olùṣọ́ ẹnu-ọ̀nà tàbí olùkọ́", "Never go with someone who is not on your pick-up list.": "Má ṣe tẹ̀lé ẹni tí kò sí lórí àkọsílẹ̀ àwọn tó máa wá gbé ọ láé.", "Excellent! Only go home with people your parents chose.": "Ó dára jù! Bá àwọn tí òbí rẹ yàn nìkan lọ sílé.", "\"This is our fire assembly point.\" If the fire alarm rings, where do you go?": "\"Ibí ni ibi ìpéjọ iná wa.\" Tí agogo iná bá dún, níbo ni o máa lọ?", "Hide under my desk": "Farapamọ́ sábẹ́ tábìlì mi", "Walk quickly to the assembly point and line up with my class": "Rìn kíákíá lọ sí ibi ìpéjọ kí o sì tò pẹ̀lú kíláàsì mi", "In a fire you must leave the building. Hiding is dangerous.": "Nígbà iná, o gbọ́dọ̀ jáde kúrò nínú ilé. Fífarapamọ́ léwu.", "Correct! Remember this place.": "Ó tọ̀nà! Rántí ibí yìí.", "The socket near your desk is sparking and smells like burning.": "Sọ́kẹ́ẹ̀tì nítòsí tábìlì rẹ ń ta iná, ó sì ń rùn bí ohun tó ń jóná.", "Pull out the plug yourself": "Yọ pulọ́ọ̀gì náà fúnra rẹ", "Move away and tell the teacher immediately": "Kúrò níbẹ̀ kí o sì sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "You could get an electric shock.": "Iná mànàmáná lè gbá ọ.", "Correct! Never touch sparking sockets.": "Ó tọ̀nà! Má ṣe fọwọ́ kan sọ́kẹ́ẹ̀tì tó ń ta iná láé.", "Your classmate is leaning back on two chair legs.": "Ọmọ kíláàsì rẹ ń fẹ̀yìn tì lórí ẹsẹ̀ àga méjì.", "Do it too, it is fun": "Ṣe é náà, ó dùn", "Sit with all four chair legs on the floor and tell him to stop": "Jókòó pẹ̀lú ẹsẹ̀ àga mẹ́rẹ̀ẹ̀rin lórí ilẹ̀ kí o sì sọ fún un kí ó dáwọ́ dúró", "The chair can fall back and you can hit your head.": "Àga lè ṣubú sẹ́yìn kí orí rẹ sì fara pa.", "Well done! Sit properly on your chair.": "O ṣe dáadáa! Jókòó dáadáa lórí àga rẹ.", "The break bell rings and everyone rushes out.": "Agogo ìsinmi dún, gbogbo ènìyàn sì ń sáré jáde.", "Push to be the first one out": "Tì àwọn ẹlòmíràn kí o lè jáde ṣáájú", "Walk, keep to the right, and do not push": "Rìn, tọ apá ọ̀tún, má sì ṣe tì ẹnikẹ́ni", "Pushing causes falls and injuries.": "Títì ẹlòmíràn máa ń fa ìṣubú àti ìpalára.", "Correct! Walk calmly in corridors.": "Ó tọ̀nà! Rìn jẹ́jẹ́ ní ọ̀dẹ̀dẹ̀.", "Some big pupils are pushing a small boy and taking his snacks.": "Àwọn akẹ́kọ̀ọ́ ńlá kan ń ti ọmọkùnrin kékeré kan, wọ́n sì ń gba ìpanu rẹ̀.", "Join them and laugh": "Dara pọ̀ mọ́ wọn kí o sì rẹ́rìn-ín", "Do not join. Go and tell a teacher at once": "Má dara pọ̀ mọ́ wọn. Lọ sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "Bullying hurts people. Never join in.": "Ìfòòró ń pa àwọn ènìyàn lára. Má ṣe dara pọ̀ láé.", "Brave and kind! Always tell a teacher about bullying.": "O ní ìgboyà àti inú rere! Máa sọ fún olùkọ́ nípa ìfòòró nígbà gbogbo.", "There are bottles of coloured liquid on the bench and no teacher.": "Ìgò omi aláwọ̀ wà lórí bẹ́ǹṣì, kò sì sí olùkọ́.", "Smell or taste them": "Gbóòórùn wọn tàbí tọ́ wọn wò", "Do not touch. Wait for the teacher": "Má fọwọ́ kàn án. Dúró de olùkọ́", "Chemicals can burn your skin, eyes and mouth.": "Kẹ́míkà lè jó ara rẹ, ojú rẹ àti ẹnu rẹ.", "Correct! Only use the lab with a teacher.": "Ó tọ̀nà! Lo yàrá sáyẹ́ǹsì pẹ̀lú olùkọ́ nìkan.", "You have used the toilet. What next?": "O ti lo ilé ìgbọ̀nsẹ̀. Kí ló kàn?", "Go straight back to class": "Padà sí kíláàsì tààrà", "Wash hands with soap and water for 20 seconds": "Fọ ọwọ́ pẹ̀lú ọṣẹ àti omi fún ìṣẹ́jú-àáyá 20", "Germs on your hands can make you and others sick.": "Kòkòrò àrùn ní ọwọ́ rẹ lè mú ìwọ àti àwọn mìíràn ṣàìsàn.", "Great! Clean hands stop germs.": "Ó dára! Ọwọ́ mímọ́ ń dá kòkòrò àrùn dúró.", "Someone spilled hot pepper soup on the floor.": "Ẹnìkan da ọbẹ̀ ata gbígbóná sílẹ̀.", "Jump over it and run": "Fò ó kọjá kí o sì sáré", "Walk around it and tell the canteen staff": "Rìn yí i ká kí o sì sọ fún òṣìṣẹ́ ilé oúnjẹ", "You could slip and get burnt.": "O lè yọ̀ ṣubú kí ó sì jó ọ.", "Correct! Report spills so they can be cleaned.": "Ó tọ̀nà! Jábọ̀ ohun tó dà sílẹ̀ kí wọ́n lè nù ún.", "One chain on the swing is broken.": "Ẹ̀wọ̀n kan lára ẹ̀rọ ìjọ̀ngbọ̀n ti já.", "Swing anyway, very high": "Jọ̀ngbọ̀n bẹ́ẹ̀, ga gan-an", "Do not use it. Tell a teacher it is broken": "Má lò ó. Sọ fún olùkọ́ pé ó ti bàjẹ́", "Broken swings can throw you to the ground.": "Ẹ̀rọ ìjọ̀ngbọ̀n tó ti bàjẹ́ lè jù ọ́ sílẹ̀.", "Well done! Report broken play equipment.": "O ṣe dáadáa! Jábọ̀ ohun ìṣeré tó ti bàjẹ́.", "You fell and cut your knee. It is bleeding.": "O ṣubú, orúnkún rẹ sì gé. Ẹ̀jẹ̀ ń jáde.", "Hide it so nobody knows": "Fi pamọ́ kí ẹnikẹ́ni má mọ̀", "Tell a teacher and go to the sick bay": "Sọ fún olùkọ́ kí o sì lọ sí yàrá aláìsàn", "A cut can get infected. Adults can help you.": "Ojú ọgbẹ́ lè kó àrùn. Àwọn àgbàlagbà lè ràn ọ́ lọ́wọ́.", "Correct! Always report injuries.": "Ó tọ̀nà! Máa jábọ̀ ìpalára nígbà gbogbo.", "Your school bus is parking. Where do you wait?": "Ọkọ̀ ilé-ìwé rẹ ń dúró sí ibi ìgbọ́kọ̀sí. Níbo ni o máa dúró?", "Behind the bus where the driver cannot see me": "Lẹ́yìn ọkọ̀ níbi tí awakọ̀ kò ti lè rí mi", "Behind the yellow line, where the driver can see me": "Lẹ́yìn ìlà aláwọ̀ ìyeyè, níbi tí awakọ̀ ti lè rí mi", "The driver cannot see behind the bus. You could be hit.": "Awakọ̀ kò lè rí ẹ̀yìn ọkọ̀. Ọkọ̀ lè gbá ọ.", "Correct! Stay where the driver can see you.": "Ó tọ̀nà! Dúró níbi tí awakọ̀ ti lè rí ọ."}};
// Site Life shared features for all games. Built into pages by src/build.py.
// SL.consent  privacy notice and consent (NDPA 2023)
// SL.t        translation with English fallback; SL.lang current language
// SL.settings graphics quality, text size, captions, colour-blind palette
// SL.caption  on-screen captions for spoken text
// SL.post     send a result to our server / Google Sheets with an offline queue (IndexedDB); SL.lastId, SL.certLink(id)
// SL.lms      SCORM 1.2 reporting when the game runs inside an LMS frame
const SL = (() => {
  const QS = new URLSearchParams(location.search);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sl-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sl-' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- language ----------
  const LANGS = [
    { id: 'en', name: 'English', voice: 'en' },
    { id: 'pcm', name: 'Pidgin', voice: 'en' },
    { id: 'yo', name: 'Yorùbá', voice: 'yo' },
    { id: 'ha', name: 'Hausa', voice: 'ha' },
    { id: 'ig', name: 'Igbo', voice: 'ig' },
  ];
  const I18N = (typeof SL_I18N !== 'undefined') ? SL_I18N : {};
  let lang = QS.get('lang') || store.get('lang', 'en');
  if (!LANGS.some(l => l.id === lang)) lang = 'en';
  const misses = new Set();
  function t(s) { return s == null ? '' : trText(String(s)); }
  function setLang(id) { lang = id; store.set('lang', id); }

  // Automatic on-screen translation: every text node added to the page is looked up in the
  // dictionary (exact match, then with a leading emoji/symbol prefix removed, then {0}-patterns).
  const PAT = {}, VALUES = {};
  for (const [l, d] of Object.entries(I18N)) {
    PAT[l] = Object.keys(d).filter(k => k.includes('{0}')).map(k => {
      const parts = k.split(/\{\d\}/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      return { re: new RegExp('^' + parts.join('(.+?)') + '$'), out: d[k] };
    });
    VALUES[l] = new Set(Object.values(d));
  }
  const PREFIX = /^([\s\p{Extended_Pictographic}\p{S}\p{P}‍️]*?)((?!\p{Extended_Pictographic})[\p{L}"'(].*?)([\s.!?…:]*)$/su;
  // OUT remembers what we produced, so text we already translated is not looked up (and reported missing) again
  const OUT = new Set();
  function trText(s) {
    if (lang === 'en' || !s) return s;
    if (OUT.has(String(s).trim())) return s;
    const r = trText0(s); if (r !== s) OUT.add(String(r).trim()); return r;
  }
  function trText0(s) {
    if (lang === 'en' || !s || !/\p{L}/u.test(s)) return s;
    const d = I18N[lang] || {}, core = s.trim();
    if (d[core] != null) return s.replace(core, d[core]);
    if (VALUES[lang] && VALUES[lang].has(core)) return s;
    const m = core.match(PREFIX);
    if (m) {
      const body = m[2] + m[3];
      if (d[body] != null) return s.replace(core, m[1] + d[body]);
      if (d[m[2]] != null) return s.replace(core, m[1] + d[m[2]] + m[3]);
    }
    const sub = v => (I18N[lang] || {})[v] != null ? I18N[lang][v] : v.split(', ').map(x => { const d2 = I18N[lang] || {}; return d2[x] != null ? d2[x] : x; }).join(', ');
    for (const p of PAT[lang] || []) {
      const mm = core.match(p.re); if (mm) return s.replace(core, p.out.replace(/\{(\d)\}/g, (_, i) => sub(mm[+i + 1])));
      if (m) { const m2 = (m[2] + m[3]).match(p.re); if (m2) return s.replace(core, m[1] + p.out.replace(/\{(\d)\}/g, (_, i) => sub(m2[+i + 1]))); }
    }
    if (core.length > 2 && core.length < 400) misses.add(core);
    return s;
  }
  function translateTree(root) {
    if (lang === 'en' || !root) return;
    if (root.nodeType === 3) { if (root.parentElement && root.parentElement.closest('[data-notr],textarea')) return; const v = trText(root.data); if (v !== root.data) root.data = v; return; }
    if (root.nodeType !== 1 || root.closest && root.closest('[data-notr],script,style,textarea')) return;
    for (const a of ['placeholder', 'title', 'aria-label']) if (root.hasAttribute && root.hasAttribute(a)) root.setAttribute(a, trText(root.getAttribute(a)));
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (n.nodeType === 1) { if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName) || n.hasAttribute('data-notr')) continue;
        for (const a of ['placeholder', 'title', 'aria-label']) if (n.hasAttribute(a)) n.setAttribute(a, trText(n.getAttribute(a))); continue; }
      if (n.parentElement && n.parentElement.closest('[data-notr],textarea')) continue;
      const v = trText(n.data); if (v !== n.data) n.data = v;
    }
  }
  if (lang !== 'en') {
    const mo = new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') translateTree(m.target); else m.addedNodes.forEach(translateTree); } });
    const startObs = () => { translateTree(document.body); mo.observe(document.body, { childList: true, subtree: true, characterData: true }); };
    document.body ? startObs() : addEventListener('DOMContentLoaded', startObs);
  }

  // ---------- consent ----------
  const CONSENT_V = 1;
  const consent = {
    ok() { return store.get('consent', 0) >= CONSENT_V; },
    give() { store.set('consent', CONSENT_V); },
    notice(kids) {
      return kids
        ? t('A parent or teacher should read this: the game saves the child\'s first name, stars and answers so parents and teachers can see progress. It is only sent if the game is opened from a school or family link, is kept only as long as the school decides, and is never sold or shared.')
        : t('This induction saves your name, company, role, answers and result so the HSE team can confirm you completed it. Only HSE can see the results. They are kept for the period set by the company (normally 12 months) and then deleted. You can ask HSE to see or delete your record.');
    },
    // Returns HTML for a checkbox block; call bind(modal, startBtn) after rendering.
    html(kids) {
      const ok = this.ok();
      return `<div class="consent"><label><input type="checkbox" id="slConsent" ${ok ? 'checked' : ''}> ${escH(t(kids ? 'A parent or teacher agrees to the privacy notice' : 'I have read and agree to the privacy notice'))}</label>
        <details><summary>${escH(t('Privacy notice'))}</summary><p>${escH(this.notice(kids))}</p></details></div>`;
    },
    bind(m, btn) {
      const cb = m.querySelector('#slConsent'); if (!cb) return;
      const upd = () => { if (btn) btn.disabled = !cb.checked || btn.dataset.waiting === '1'; if (cb.checked) consent.give(); else store.set('consent', 0); };
      cb.onchange = upd; upd();
    },
  };

  // ---------- settings ----------
  const DEF = { quality: 'auto', text: 1, captions: true, cb: false, voice: true };
  const settings = Object.assign({}, DEF, store.get('settings', {}));
  const save = () => store.set('settings', settings);
  function applyCss() {
    document.documentElement.style.setProperty('--fs', settings.text);
    document.documentElement.classList.toggle('cbsafe', !!settings.cb);
  }
  const autoQuality = () => (Math.min(innerWidth, innerHeight) < 700 || /Android|iPhone|iPad/i.test(navigator.userAgent)) ? 'medium' : 'high';
  function quality() { return settings.quality === 'auto' ? (store.get('autoLow', false) ? 'low' : autoQuality()) : settings.quality; }
  const markerColor = () => settings.cb ? '#1f77ff' : '#ffd400';

  // fps watchdog: switch to low quality when the device struggles (auto mode only)
  const fps = { acc: 0, n: 0, low: 0, cb: null,
    tick(dt) {
      if (settings.quality !== 'auto' || quality() === 'low') return;
      this.acc += dt; this.n++;
      if (this.acc >= 2) { const f = this.n / this.acc; this.acc = 0; this.n = 0; this.low = f < 25 ? this.low + 1 : 0;
        if (this.low >= 3) { store.set('autoLow', true); this.cb && this.cb('low'); } }
    } };

  function settingsHtml() {
    const q = settings.quality, opt = (v, l) => `<option value="${v}" ${q === v ? 'selected' : ''}>${escH(t(l))}</option>`;
    return `<h2>⚙️ ${escH(t('Settings'))}</h2>
      <p><b>${escH(t('Language'))}</b></p><div class="row" id="slLangs">${LANGS.map(l => `<button data-lang="${l.id}" class="${l.id === lang ? 'primary' : ''}">${escH(l.name)}</button>`).join('')}</div>

function setPPE(g,p){
  const u=g.userData; if(!u.ppe) return;
  u.ppe.hat.visible=!!p.hat; u.ppe.vest.visible=!!p.vest; u.ppe.goggles.visible=!!p.goggles; u.ppe.muffs.visible=!!p.muffs;

  u.legs.forEach(l=>{ l.shoe.visible=!p.boots; l.boot.visible=!!p.boots; });
  if(p.muffs && p.hat){ u.ppe.muffs.position.y=0; }
}
function animHuman(g,step,moving,t,seated){
  const u=g.userData; if(u.gltf){ animGLTF(u,moving&&!seated,t); return; }
  if(!u.legs) return;
  if(seated){ u.legs.forEach(l=>{l.hp.rotation.x=1.45; l.kn.rotation.x=-1.45;}); u.arms.forEach(a=>{a.sh.rotation.x=.9; a.el.rotation.x=.35;}); return; }
  const s=step, a=moving? Math.sin(s):0;
  u.legs[0].hp.rotation.x= a*.42; u.legs[1].hp.rotation.x=-a*.42;
  u.legs[0].kn.rotation.x= moving? -Math.max(0,Math.sin(s+Math.PI*.5))*.7-.04 : -.02;
  u.legs[1].kn.rotation.x= moving? -Math.max(0,Math.sin(s-Math.PI*.5))*.7-.04 : -.02;
  u.arms[0].sh.rotation.x=-a*.36; u.arms[1].sh.rotation.x=a*.36;
  u.arms.forEach((x,i)=>{ x.el.rotation.x= moving? .32 : .1+Math.sin(t*1.3+i)*.03; });
  u.hips.position.y = .95 + (moving? Math.abs(Math.cos(s))*.022 : Math.sin(t*2.2)*.003);
  u.hips.rotation.y = moving? a*.06 : 0;
  u.torso.scale.x = 1 + Math.sin(t*2.2)*.006;
  if(!moving) u.head.rotation.y = Math.sin(t*.45)*.18;
}

function flUpdate(f,dt){
  const g=f.obj, u=g.userData;
  u.beacon.visible=f.state==='move'&&Math.sin(G.t*8)>-.2;
  if(f.state==='charge'){ f.bat=Math.min(1,f.bat+dt/900); return; }
  if(f.state!=='move'){ u.car.position.y+=(0-u.car.position.y)*Math.min(1,dt*3); return; }
  if(S.alarm){ f.speed=0; u.car.position.y+=(0-u.car.position.y)*Math.min(1,dt*2); return; }
  if(S.nepa>0){ f.speed=0; return; }
  const pos=f.ax==='x'?g.position.x:g.position.z;
  if(f.wait>0){ f.wait-=dt; const k=f.wait>1.5?1-(f.wait-1.5)/1.5:f.wait/1.5; u.car.position.y=f.ax==='x'&&f.id==='FL-02'?k*1.6:k*.25; if(f.wait<=0){ f.dir*=-1; f.carry=!f.carry; u.load.visible=f.carry; } f.speed=0; return; }
  // stop for people ahead (player, NPCs, other players) — like the factory forklift at the crossing
  let blocked=false; const dir=f.dir;
  for(const h of walkers()){ const a=(f.ax==='x'?h.x-g.position.x:h.z-g.position.z)*dir, l=f.ax==='x'?h.z-g.position.z:h.x-g.position.x; if(a>-.5&&a<5.2&&Math.abs(l)<1.25){ blocked=true; if(h===P&&f.stop<=0){ horn(); } break; } }
  if(blocked){ f.stop=1.4; f.speed=0; return; } if(f.stop>0){ f.stop-=dt; f.speed=0; return; }
  const nv=pos+dir*f.v*dt; f.speed=f.v;
  if((dir>0&&nv>=f.b)||(dir<0&&nv<=f.a)){ f.wait=3; return; }
  if(f.ax==='x') g.position.x=nv; else g.position.z=nv;
  g.rotation.y=f.ax==='x'?(dir>0?-Math.PI/2:Math.PI/2):(dir>0?Math.PI:0);
  f.bat=Math.max(.1,f.bat-dt/2400);
}

// ================== PATHFINDING (A* on a 0.5 m grid; walkways preferred, forklift aisles avoided) ==================
const GS=.5, GX0=-40, GZ0=-30, GW=160, GH=120; let GRID=null, COST=null;
function blockedAt(x,z,r=.32){ if(x<-39.5||x>39.5||z<-29.5||z>29.5) return true; for(const s of SOL) if(inR(s,x,z,r)) return true; return false; }
function costAt(x,z){ let c=1.7; if(WALKS.some(r=>inR(r,x,z))||inR(PICK,x,z)||inR(CHARGE,x,z)||inR(AP,x,z)) c=1;
  if(ROADS.some(r=>inR(r,x,z))) c=ZEBRA.some(r=>inR(r,x,z))?1:7;
  for(const f of FA) if(inR(f.r,x,z)) c=f.cross.some(r=>inR(r,x,z))?1:30;
  for(const b of BAYS) if(inR(REVZ(b),x,z)) c=Math.max(c,35); return c; }
function buildGrid(){ GRID=new Uint8Array(GW*GH); COST=new Float32Array(GW*GH); for(let j=0;j<GH;j++) for(let i=0;i<GW;i++){ const x=GX0+(i+.5)*GS, z=GZ0+(j+.5)*GS; GRID[j*GW+i]=blockedAt(x,z)?1:0; COST[j*GW+i]=costAt(x,z); } }
const cellOf=(x,z)=>[clamp(Math.floor((x-GX0)/GS),0,GW-1),clamp(Math.floor((z-GZ0)/GS),0,GH-1)];
function freeCell(i,j){ if(!GRID[j*GW+i]) return [i,j]; for(let r=1;r<10;r++) for(let dj=-r;dj<=r;dj++) for(let di=-r;di<=r;di++){ const x=i+di,y=j+dj; if(x>=0&&y>=0&&x<GW&&y<GH&&!GRID[y*GW+x]) return [x,y]; } return [i,j]; }
function findPath(sx,sz,tx,tz){
  if(!GRID) buildGrid();
  const [ai,aj]=freeCell(...cellOf(sx,sz)), [bi,bj]=freeCell(...cellOf(tx,tz)); const N=GW*GH, g=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N), heap=[];
  const h=k=>Math.hypot(k%GW-bi,((k/GW)|0)-bj);
  const push=(k,f)=>{ heap.push([f,k]); let q=heap.length-1; while(q>0){ const p=(q-1)>>1; if(heap[p][0]<=heap[q][0]) break; [heap[p],heap[q]]=[heap[q],heap[p]]; q=p; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let q=0; for(;;){ const l=2*q+1,r=l+1; let m=q; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===q) break; [heap[m],heap[q]]=[heap[q],heap[m]]; q=m; } } return top; };
  const st=aj*GW+ai, goal=bj*GW+bi; g[st]=0; push(st,h(st));
  while(heap.length){ const [,k]=pop(); if(closed[k]) continue; closed[k]=1; if(k===goal) break; const x=k%GW, y=(k/GW)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx; if(GRID[j]||closed[j]) continue;
      if(dx&&dy&&(GRID[y*GW+nx]||GRID[ny*GW+x])) continue; const ng=g[k]+(dx&&dy?1.414:1)*COST[j]; if(ng<g[j]){ g[j]=ng; from[j]=k; push(j,ng+h(j)); } } }
  if(from[goal]<0&&goal!==st) return null;
  const cells=[]; for(let k=goal;k!==-1;k=from[k]) cells.push(k); cells.reverse();
  const pts=cells.map(k=>[GX0+(k%GW+.5)*GS,GZ0+(((k/GW)|0)+.5)*GS]); pts[0]=[sx,sz];
  if(!blockedAt(tx,tz,.3)) pts.push([tx,tz]);
  // string-pulling: skip points while the straight line stays on free cells no more costly than the route
  const out=[pts[0]]; let a=0;
  while(a<pts.length-1){ let b=pts.length-1; for(;b>a+1;b--){ if(losOK(pts[a],pts[b],cells,a,b)) break; } out.push(pts[b]); a=b; }
  return out;
}
function losOK(p,q,cells,a,b){ let mx=1; for(let k=a;k<=Math.min(b,cells.length-1);k++) mx=Math.max(mx,COST[cells[k]]); const d=Math.hypot(q[0]-p[0],q[1]-p[1]), n=Math.ceil(d/.2);
  for(let i=1;i<n;i++){ const x=p[0]+(q[0]-p[0])*i/n, z=p[1]+(q[1]-p[1])*i/n; const [ci,cj]=cellOf(x,z); const k=cj*GW+ci; if(GRID[k]||COST[k]>mx) return false; } return true; }

function updateInsets(){ const ph=PHONE(); const d=$('dock'), pn=$('panel');
  INSET.t=ph?112:58; INSET.l=0;
  INSET.b=started?((pn&&!pn.classList.contains('hidden')&&ph)?pn.offsetHeight:(d?d.offsetHeight+(ph?0:16):150)):0;
  INSET.r=!ph&&pn&&!pn.classList.contains('hidden')?340:0; }
function camUpdate(dt){
  if(CAM.anim){ const a=CAM.anim; a.t+=dt; const k=ease(Math.min(1,a.t/a.dur)); CAM.T.x=a.fx+(a.tx-a.fx)*k; CAM.T.z=a.fz+(a.tz-a.fz)*k; CAM.dist=a.fd+(a.td-a.fd)*k; if(a.t>=a.dur) CAM.anim=null; }
  else if(CAM.mode==='follow'){ const k=1-Math.exp(-dt*3), [fx,fz]=followPt(); CAM.T.x+=(fx-CAM.T.x)*k; CAM.T.z+=(fz-CAM.T.z)*k; }
  else if(CAM.mode==='track'&&CAM.track){ const e=ENTS[CAM.track]; if(e){ const p=entPos(e); const k=1-Math.exp(-dt*3); CAM.T.x+=(p.x-CAM.T.x)*k; CAM.T.z+=(p.z-CAM.T.z)*k; } }
  else if(CAM.mode==='intro'){ CAM.yaw+=dt*.025; }
  if(CAM.yawAnim){ const a=CAM.yawAnim; a.t+=dt; const k=ease(Math.min(1,a.t/a.dur)); CAM.yaw=a.from+(a.to-a.from)*k; if(a.t>=a.dur) CAM.yawAnim=null; }
  const cam=G.camera, d=CAM.dist, cp=Math.cos(CAM.pitch);
  cam.position.set(CAM.T.x+Math.sin(CAM.yaw)*cp*d,Math.sin(CAM.pitch)*d,CAM.T.z+Math.cos(CAM.yaw)*cp*d); cam.lookAt(CAM.T.x,0,CAM.T.z);
  const W2=innerWidth, H2=innerHeight; cam.setViewOffset(W2,H2,(INSET.r-INSET.l)/2,(INSET.b-INSET.t)/2,W2,H2);
  G.scene.fog.near=d*1.35; G.scene.fog.far=d*3.4;
  // the sun follows the view so the shadow map stays sharp where you look
  const half=clamp(d*.75,22,70); if(Math.abs(half-SHADOW_HALF)>4){ SHADOW_HALF=half; const sc=G.sun.shadow.camera; sc.left=-half; sc.right=half; sc.top=half; sc.bottom=-half; sc.near=1; sc.far=200; sc.updateProjectionMatrix(); }
  G.sun.position.set(CAM.T.x-30,55,CAM.T.z+25); G.sun.target.position.set(CAM.T.x,0,CAM.T.z);
  // cut-away: hide the roof and the walls facing the camera when the view is inside the building
  const inside=inR(BLD,P.x,P.z,.5)&&CAM.mode!=='intro'||inR(BLD,CAM.T.x,CAM.T.z,-1.5)&&CAM.dist<70;
  const cx=Math.sin(CAM.yaw), cz=Math.cos(CAM.yaw);
  const fade=(o,want)=>{ if(o.done===want) return; o.a+=(want-o.a)*Math.min(1,dt*6); if(Math.abs(o.a-want)<.01) o.a=want; const vis=o.a>.02; o.g.visible=vis; o.mats.forEach(m=>{ if(m.userData.keepT==null) m.userData.keepT=m.transparent; const tr2=o.a<.999||m.userData.keepT; if(m.transparent!==tr2){ m.transparent=tr2; m.needsUpdate=true; } m.opacity=o.a; m.depthWrite=!tr2; }); o.g.traverse(c=>{ if(c.isMesh) c.castShadow=o.a>.5&&!c.userData.decor; }); o.done=o.a===want?want:null; };
  fade(W.roof,inside?0:1);
  for(const k in W.walls){ const w=W.walls[k]; w.g=w.up; fade(w,inside&&(w.n[0]*cx+w.n[1]*cz)>.15?0:1); }
}

// ================== UPDATE ==================
let NEAR_T=0;
function movePlayer(dt){
  if(modalOpen()||S.over||S.qOpen) { P.moving=false; return; }
  let mx=0,mz=0; const k=KEYS; if(k.KeyW||k.ArrowUp) mz-=1; if(k.KeyS||k.ArrowDown) mz+=1; if(k.KeyA||k.ArrowLeft) mx-=1; if(k.KeyD||k.ArrowRight) mx+=1;
  const sp=(S.alarm?3.0:3.4)*(S.nepa>0?0:1);
  if(mx||mz){ P.path=null; const c=Math.cos(CAM.yaw), s=Math.sin(CAM.yaw); const wx=mx*c+mz*s, wz=-mx*s+mz*c, l=Math.hypot(wx,wz); stepPlayer(wx/l*sp*dt,wz/l*sp*dt); CAM.mode=CAM.mode==='intro'?'intro':'follow'; return; }
  if(P.path){ const t=P.path[P.pi]; if(!t){ P.path=null; P.moving=false; return; } const dx=t[0]-P.x, dz=t[1]-P.z, d=Math.hypot(dx,dz); if(d<.08){ P.pi++; return; } const st=Math.min(d,sp*dt); stepPlayer(dx/d*st,dz/d*st,true); return; }
  P.moving=false;
}
function stepPlayer(dx,dz,onPath){ const nx=P.x+dx, nz=P.z+dz; let moved=false;
  if(onPath||!blockedAt(nx,nz,.3)){ P.x=nx; P.z=nz; moved=true; } else { if(!blockedAt(nx,P.z,.3)){ P.x=nx; moved=true; } else if(!blockedAt(P.x,nz,.3)){ P.z=nz; moved=true; } }
  if(moved&&(dx||dz)){ P.face=Math.atan2(-dx,-dz); P.moving=true; } }
function walkTo(x,z){ const p=findPath(P.x,P.z,x,z); if(p){ P.path=p; P.pi=1; CAM.mode='follow'; CAM.track=null; } }
function nearMiss(why){ S.near++; S.kd.near={v:1,t:S.t}; addScore(-4); horn(); toast(why,'bad'); }
function checkNear(dt){
  if(S.alarm||modalOpen()) return; NEAR_T-=dt; if(NEAR_T>0) return;
  for(const f of FA){ if(!inR(f.r,P.x,P.z)||f.cross.some(c=>inR(c,P.x,P.z))) continue;
    for(const fl of FL) if(fl.state==='move'&&inR(f.r,fl.obj.position.x,fl.obj.position.z)&&Math.hypot(fl.obj.position.x-P.x,fl.obj.position.z-P.z)<7){ NEAR_T=6; nearMiss(L('Near miss! You walked in the forklift aisle while {0} was working. Use the walkways and crossings.',fl.id)); return; } }
  for(const T2 of TRUCKS){ if(!T2.obj) continue; if(T2.st==='reverse'&&inR(REVZ(T2.b),P.x,P.z)){ NEAR_T=6; nearMiss(tr('Near miss! You were in the reversing zone behind a truck. Never stand behind a reversing vehicle.')); return; }
    if((T2.st==='arrive'||T2.st==='depart')&&ROADS.some(r=>inR(r,P.x,P.z))&&!ZEBRA.some(r=>inR(r,P.x,P.z))&&Math.hypot(T2.x-P.x,T2.z-P.z)<9){ NEAR_T=6; nearMiss(tr('Near miss! A truck was coming and you were on the road. Cross only at the zebra crossing.')); return; } }
}
let LT=0;
function update(dt){
  G.t+=dt; S.t+=dt;
  for(let i=0;i<TIMERS.length;i++){ const tm=TIMERS[i]; tm.t-=dt; if(tm.t<=0){ TIMERS.splice(i--,1); tm.fn(); } }
  if(S.nepa>0){ S.nepa-=dt; const dim=S.nepa>1.2; G.hemi.intensity=dim?.42:.72; G.sun.intensity=dim?.2:.72; if(S.nepa<=1.2&&$('nepav')){ $('nepav').remove(); toast(tr('Generator is on. Lights are back. Carry on.'),'good'); } if(S.nepa<=0){ G.hemi.intensity=.72; G.sun.intensity=.72; } }
  if(S.rain>0){ S.rain-=dt; G.scene.background.set(S.rain>0?'#dcdfee':'#e8eaf7'); G.scene.fog.color.copy(G.scene.background); }
  if(started&&!S.over) movePlayer(dt);
  P.obj.position.set(P.x,0,P.z); P.obj.rotation.y=P.face; if(P.moving) P.ph+=dt*8; animPerson(P.obj,P.ph,P.moving);
  for(const f of FL) flUpdate(f,dt);
  for(const T2 of TRUCKS) truckUpdate(T2,dt);
  for(const n of NPCS) npcUpdate(n,dt);
  if(SLRoom.players.length||AV.size) renderRoom();
  for(const d of W.doors){ const sc=1-d.open*.85; d.sh.scale.y=sc; d.sh.position.y=3.7-1.85*sc; d.lamp.material.color.set(d.open>.9?'#3fd27a':'#ff5a5a'); d.lamp.material.emissive.set(d.open>.9?'#20c060':'#ff3030'); }
  const near=TRUCKS.some(t=>t.obj&&Math.hypot(t.x+30,t.z-30)<14&&t.st!=='docked'); W.gateArm.rotation.z+=((near?-1.35:0)-W.gateArm.rotation.z)*Math.min(1,dt*3);
  if(W.fan) W.fan.rotation.x+=dt*12;
  if(W.danfo) for(const d of W.danfo){ d.x+=d.dir*d.v*dt; if(d.x>140) d.x=-140; if(d.x<-140) d.x=140; d.obj.position.x=d.x; }
  if(started&&!S.over){ checkStation(); checkNear(dt); if(S.alarm&&!S.muster&&!S.card&&!modalOpen()&&inR(AP,P.x,P.z)) reachAssembly(); }
  // pin + guide chevrons along the A* route to the next stop
  const st=started&&!S.over?curStation():null; W.pin.visible=!!st;
  if(st){ W.pin.position.set(st.x,Math.sin(G.t*2.4)*.15,st.z); const al=S.alarm&&!S.muster; W.pin.userData.head.material.color.set(al?'#e23b3b':'#2f5ef0'); W.pin.userData.head.material.emissive.set(al?'#8a1010':'#1a3bb0'); W.pin.userData.ring.material.color.set(al?'#e23b3b':'#2a55e5'); W.pin.userData.ring.scale.setScalar(1+((G.t*.8)%1)*.6); W.pin.userData.ring.material.opacity=.6*(1-((G.t*.8)%1)); W.pin.userData.dot.lookAt(G.camera.position); }
  guideUpdate(dt,st);
  if(SEL){ const e=ENTS[SEL]; if(e){ const p=entPos(e); W.selRing.position.set(p.x,.07,p.z); const r=Math.min(4,Math.max(e.size[0],e.size[2])*.5+.3); W.selRing.scale.setScalar(r*(1+Math.sin(G.t*4)*.04)); } }
  updateProxies(); camUpdate(dt);
  LT-=dt; if(LT<=0&&started){ LT=.5; renderKpis(); renderLists(); renderPanel(); renderTracker(); const c=$('clk'); if(c) c.textContent=hhmm(); }
}
let GP={path:null,t:0,key:''};
function guideUpdate(dt,st){
  const ch=W.chev; if(!st){ ch.count=0; return; }
  GP.t-=dt; const key=st.id+'|'+Math.round(P.x)+'|'+Math.round(P.z);
  if(GP.t<=0||GP.key!==key){ GP.t=.6; GP.key=key; GP.path=Math.hypot(P.x-st.x,P.z-st.z)<2?null:findPath(P.x,P.z,st.x,st.z); }
  const pth=GP.path; if(!pth||modalOpen()){ ch.count=0; return; }
  const sp=1.35, off=(G.t*1.3)%sp; let n=0, acc=0, want=off+.9; const M=new THREE.Matrix4(), Q4=new THREE.Quaternion(), Y=new THREE.Vector3(0,1,0), Sc=new THREE.Vector3(1,1,1);
  for(let i=1;i<pth.length&&n<ch.instanceMatrix.count;i++){ const a=pth[i-1], b=pth[i], L2=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L2<1e-4) continue; const ry=Math.atan2(-(b[0]-a[0]),-(b[1]-a[1]));
    while(want<=acc+L2&&n<40){ const k=(want-acc)/L2, x=a[0]+(b[0]-a[0])*k, z=a[1]+(b[1]-a[1])*k; if(Math.hypot(x-st.x,z-st.z)<1.2) break; Q4.setFromAxisAngle(Y,ry); M.compose(new THREE.Vector3(x,.05,z),Q4,Sc); ch.setMatrixAt(n++,M); want+=sp; } acc+=L2; }
  ch.count=n; ch.instanceMatrix.needsUpdate=true;
}
// X-ray: wherever a truck, rack or wall is in front of the player, the hidden part shows as a blue silhouette.
// Clones of the player's meshes use depthFunc GreaterDepth (drawn only where something nearer already is) and
// render before the player's own meshes (renderOrder 1 < 2), so the player never x-rays through itself.
function addXray(root){
  const xm=new THREE.MeshBasicMaterial({color:new THREE.Color('#3d6bff'),depthWrite:false,depthFunc:THREE.GreaterDepth,toneMapped:false,fog:false});
  const meshes=[]; root.traverse(o=>{ if(o.isMesh&&!o.userData.xray) meshes.push(o); });
  const pairs=meshes.map(o=>{ o.renderOrder=2; const c=new THREE.Mesh(o.geometry,xm); c.position.copy(o.position); c.quaternion.copy(o.quaternion); c.scale.copy(o.scale);
    c.renderOrder=1; c.castShadow=c.receiveShadow=false; c.userData.xray=true; o.parent.add(c); return [o,c]; });
  const ring=new THREE.Mesh(new THREE.RingGeometry(.55,.75,32).rotateX(-Math.PI/2),xm); ring.position.y=.06; ring.renderOrder=1; ring.userData.xray=true; root.add(ring);
  root.userData.xray=pairs;
}
function render(){ const xr=P.obj&&P.obj.userData.xray; if(xr) for(const [o,c] of xr) c.visible=o.visible; G.renderer.render(G.scene,G.camera); updateTags(); }
let last=performance.now();
function tick(now){ const dt=Math.min(.1,(now-last)/1000); last=now; if(!G) return; if(started&&!modalOpen()) SL.fps.tick(dt); update(dt); render(); }
function loop(now){ tick(now); requestAnimationFrame(loop); }

// ================== INPUT ==================
const KEYS={}; const ray=HAS3&&new THREE.Raycaster(), ndc=HAS3&&new THREE.Vector2(), GPL=HAS3&&new THREE.Plane(new THREE.Vector3(0,1,0),0);
function groundAt(x,y){ ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,G.camera); const p=new THREE.Vector3(); return ray.ray.intersectPlane(GPL,p)?p:null; }
function pickEnt(x,y){ ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1); ray.setFromCamera(ndc,G.camera); const h=ray.intersectObjects(PROXIES,false); return h.length?h[0].object.userData.ent:null; }
function bindInput(){
  const cv=$('game'); const ptr=new Map(); let drag=null, pinch=null, hoverT=0;
  cv.addEventListener('pointerdown',e=>{ ensureAudio(); cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1) drag={x:e.clientX,y:e.clientY,moved:false,g:groundAt(e.clientX,e.clientY)}; else if(ptr.size===2){ const [a,b]=[...ptr.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),dist:CAM.dist}; drag=null; } });
  cv.addEventListener('pointermove',e=>{ if(ptr.has(e.pointerId)) ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&ptr.size===2){ const [a,b]=[...ptr.values()]; CAM.dist=clamp(pinch.dist*pinch.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y)),16,140); CAM.anim=null; return; }
    if(drag){ if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>7) drag.moved=true;
      if(drag.moved&&drag.g&&started){ const g=groundAt(e.clientX,e.clientY); if(g){ CAM.T.x+=drag.g.x-g.x; CAM.T.z+=drag.g.z-g.z; CAM.mode='free'; CAM.anim=null; } } return; }
    const now=performance.now(); if(started&&now-hoverT>90&&e.pointerType==='mouse'){ hoverT=now; cv.style.cursor=pickEnt(e.clientX,e.clientY)?'pointer':'default'; } });
  const up=e=>{ ptr.delete(e.pointerId); if(ptr.size<2) pinch=null; if(!drag) return; const d=drag; drag=null; if(d.moved||!started||S.over) return; click(e.clientX,e.clientY); };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',e=>{ ptr.delete(e.pointerId); drag=null; pinch=null; });
  cv.addEventListener('wheel',e=>{ e.preventDefault(); CAM.dist=clamp(CAM.dist*(e.deltaY>0?1.1:1/1.1),16,140); CAM.anim=null; },{passive:false});
  addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; KEYS[e.code]=true;
    if(e.key==='/'&&started){ e.preventDefault(); toast(tr('Tip: click any forklift, truck, rack, pallet or person in the 3D view to inspect it.')); }
    if(e.code==='Escape'&&SEL) closePanel(); if((e.code==='Equal'||e.code==='NumpadAdd')&&started) camZoom(.8); if((e.code==='Minus'||e.code==='NumpadSubtract')&&started) camZoom(1.25);
    if(e.code==='KeyQ'&&started) camRotate(-Math.PI/4); if(e.code==='KeyE'&&started) camRotate(Math.PI/4); if(e.code==='KeyH'&&started) camHome();
    if(e.code==='KeyG'&&started&&!modalOpen()){ const s=curStation(); if(s) walkTo(s.x,s.z); } });
  addEventListener('keyup',e=>{ KEYS[e.code]=false; }); addEventListener('blur',()=>{ for(const k in KEYS) KEYS[k]=false; });
  $('sheetH').onclick=()=>{ document.body.classList.toggle('sheet'); setTimeout(updateInsets,300); };
}
function click(x,y){
  if(modalOpen()) return; const id=pickEnt(x,y);
  if(id){ selectEnt(id,true); return; }
  const g=groundAt(x,y); if(!g) return;
  const st=curStation(); if(st&&Math.hypot(g.x-st.x,g.z-st.z)<1.6){ walkTo(st.x,st.z); return; }
  if(SEL&&PHONE()) closePanel();
  walkTo(g.x,g.z); spawnClickMark(g.x,g.z);
}
function spawnClickMark(x,z){ const m=new THREE.Mesh(new THREE.RingGeometry(.3,.42,28).rotateX(-Math.PI/2),basic('#2a55e5',{t:.8})); m.position.set(x,.06,z); G.dyn.add(m); let t=0; const id=setInterval(()=>{ t+=.05; m.scale.setScalar(1+t*2); m.material.opacity=.8*(1-t*2); if(t>=.5){ clearInterval(id); G.dyn.remove(m); m.geometry.dispose(); m.material.dispose(); } },30); }

// ================== START ==================
const PG={index:'index.html',kids:'kids.html',little:'little.html'};
const GAMES=[[PG.index,'Factory Site Induction'],['','Warehouse Shift'],[PG.index+'?course=advanced','Advanced Site Course'],[PG.index+'?mode=oga','Oga Mode'],[PG.kids+'?world=home','Home → School Bus'],[PG.kids+'?world=school','School Safety'],[PG.little,'Little Stars 3–6']];
function showStart(){
  const nm=prof.name||SL.lms.studentName()||'';
  const m=openModal(`<div class="games">${GAMES.map(([h,t])=>!h?`<span class="gcard on">${icon('box')}${T(t)}</span>`:`<a class="gcard" href="${h}">${T(t)}</a>`).join('')}</div>
    <div class="hero" style="margin-top:8px"><span class="lg">${icon('cube')}</span><div><h1>${T('Warehouse Shift')}</h1><div class="muted" style="font-size:.88rem">${T('Safety induction · Lagos distribution centre, Agbara')}</div></div></div>
    <p class="muted" style="font-size:.9rem">${T('Your first day as a warehouse associate. Walk the site with Bisi from HSE, make the right calls at each stop, and spot the hidden hazards before the end of the shift.')}</p>
    <div class="feat"><div>${icon('list')}<b>${T('8 stops')}</b>${T('Gate to fire drill')}</div><div>${icon('alert')}<b>${L('{0} hazards',HZ_TOTAL)}</b>${T('Hidden around the site')}</div><div>${icon('clock')}<b>${T('15 minutes')}</b>${T('Phone or computer')}</div></div>
    <div class="two"><label class="fld"><span>${T('Your name')}</span><input id="nm" maxlength="40" placeholder="${T('e.g. Chidi Okafor')}" value="${esc(nm)}"></label>
    <label class="fld"><span>${T('Company')} <small>${T('(optional)')}</small></span><input id="co" maxlength="60" placeholder="${T('e.g. ABC Logistics Ltd')}" value="${esc(prof.company||'')}"></label></div>
    <label class="fld"><span>${T('Group code')} <small>${T('(optional: play together with a trainer)')}</small></span><input id="room" maxlength="8" placeholder="${T('e.g. ACME7')}" value="${esc(SLRoom.code||'')}" style="text-transform:uppercase"></label>
    ${SL.consent.html(false)}
    <div class="mend" style="justify-content:space-between;flex-wrap:wrap"><button id="stSet">${icon('gear')} ${T('Language & settings')}</button><button class="primary" id="start">${T('Start shift')} ${icon('play')}</button></div>
    <p class="keys">${T('Computer: click the ground to walk (or WASD), click anything to inspect it, drag to pan, scroll to zoom, Q/E to rotate. Phone: tap to walk or inspect, drag to pan, pinch to zoom.')}</p>`,'start');
  SL.consent.bind(m,null);
  m.querySelectorAll('.gcard[href]').forEach(a=>{ const u=new URL(a.getAttribute('href'),location.href); for(const [k,v] of SL.QS) if(!['course','mode','world'].includes(k)) u.searchParams.set(k,v); a.href=u.href; });
  m.querySelector('#stSet').onclick=()=>openSettings(showStart);
  m.querySelector('#start').onclick=()=>{
    if(!SL.consent.ok()){ const c=m.querySelector('.consent'); c.style.outline='2px solid var(--bad)'; c.scrollIntoView({block:'center'}); toast(tr('Please tick the privacy notice box to start.'),'bad'); return; }
    ensureAudio(); prof.name=(m.querySelector('#nm').value.trim()||'Guest').slice(0,40); prof.company=m.querySelector('#co').value.trim().slice(0,60); SL.store.set('wh-profile',prof);
    const code=SLRoom.setCode(m.querySelector('#room').value); closeModal(); begin(code);
  };
}
function begin(code){
  started=true; paused=false; S.stepT0=S.t; $('ui').classList.remove('hidden'); renderTop(); renderZoom(); renderKpis(); renderTracker(true); renderLists(true);
  CAM.mode='follow'; CAM.yawAnim={t:0,dur:1.4,from:CAM.yaw,to:-.62}; const [fx,fz]=followPt(); camFly(fx,fz,defaultDist(),1.6); updateInsets();
  toast(tr('The danfo has dropped you at the gate. Follow the blue pin to the gatehouse.'));
  later(3,()=>toast(tr('Tip: tap the ground to walk, or press "Walk there". Tap anything to inspect it.')));
  if(code) SLRoom.start({name:prof.name,game:'warehouse',state:()=>({x:P.x/K,y:P.z/K,yaw:P.face,zone:STEPS[Math.min(S.step,7)].t,score:S.score}),onEvent:t=>{ toast(tr(SLRoom.eventName(t)),'warn'); onRoomEvent(t); }})
    .then(ok=>{ if(ok){ toast(L('Group session {0}',SLRoom.code)); renderTop(); } else toast(tr('Group session not available here. Playing solo.'),'warn'); });
}
window.addEventListener('load',()=>{
  if(!window.THREE){ $('loading').innerHTML=esc(tr('Could not load the 3D engine. Please check your internet connection.')); return; }
  newState();
  try{ initScene(); buildWorld(); buildActors(); buildEntities(); buildGrid(); applyQuality(); }catch(err){ $('loading').textContent=tr('Your device could not start 3D.'); console.error(err); return; }
  $('loading').remove(); document.title=tr('Warehouse Shift'); bindInput(); CAM.T.set(-6,0,0); CAM.dist=78; showStart();
  requestAnimationFrame(loop);
});

// ================== TEST HOOK ==================
// Used by tests/playthrough.js (the page runs at ~1 fps under software WebGL, so the test drives update() itself):
// WH.state(), WH.station(), WH.teleport(x,z), WH.step(n,dt), WH.render(), WH.correct() (index of the right option in the open
// question), WH.flCorrect(), WH.hazards() ([{id, hz}]), WH.inspect(id), WH.walk(x,z) (A* path), WH.lastResult.
window.WH={
  state(){ const st=curStation(); return {step:S.step,si:S.si,station:st&&st.id,q:S.qOpen||null,card:!!S.card,over:S.over,score:S.score,hazards:S.hazFound,near:S.near,alarm:!!S.alarm,muster:S.muster,
    modal:modalOpen(),panel:SEL,fl:{open:!!S.flcheck.open,done:S.flcheck.done},player:[+P.x.toFixed(2),+P.z.toFixed(2)],wrong:S.answers.filter(a=>!a.ok).length}; },
  station(){ const s=curStation(); return s&&{id:s.id,x:s.x,z:s.z}; },
  teleport(x,z){ P.x=x; P.z=z; P.path=null; CAM.T.set(x,0,z); },
  step(n=1,dt=.05){ for(let i=0;i<n;i++) update(dt); render(); },
  render(){ camUpdate(0); render(); },
  correct(){ const q=Q[S.qOpen]; return q?q.o.findIndex(o=>o.ok):-1; },
  flCorrect(){ return FLDECIDE.findIndex(o=>o.ok); },
  hazards(){ return Object.keys(HZ).map(id=>({id,hz:!!HZ[id].hz})); },
  inspect(id){ selectEnt(id,true); renderPanel(); },
  overview(){ siteOverview(); },
  ents(){ return Object.keys(ENTS); },
  event(type){ onRoomEvent(type); },   // trainer events: fire_alarm, nepa, spill, rain, end
  end(){ return endGame(); },
  walk(x,z){ return findPath(P.x,P.z,x,z); },
  stations:STATIONS.map(s=>s.id), assembly:{x:-33,z:-8},
  lastResult:null,
};
