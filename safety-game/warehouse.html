<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warehouse Shift</title><style>
/* ---------- Warehouse Shift: clean dashboard look (white rounded cards over a light isometric 3D yard) ---------- */
:root{
  --bg:#eef0fa; --card:#ffffff; --ink:#1b1f3b; --ink2:#3d4263; --muted:#7c819c; --line:#e8eaf4; --soft:#f5f6fc;
  --blue:#2a55e5; --blue2:#4a6ff0; --blueSoft:#e9eefe; --good:#16935c; --goodSoft:#e2f5ec; --warn:#b86e00; --warnSoft:#fff1d9;
  --bad:#d23a3a; --badSoft:#fde8e8; --idle:#6b7090; --idleSoft:#eef0f6;
  --sh:0 10px 30px rgba(42,52,120,.10),0 2px 6px rgba(42,52,120,.06); --r:14px;
  --brand:var(--blue); --brand-ink:#fff; --chip:var(--soft); --panel:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(14px * var(--fs,1))}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.4}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg);outline:none}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:600}
button:hover{border-color:#cfd4ea}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#2148cf}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);width:100%}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle;accent-color:var(--blue)}
.hidden{display:none !important}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--idleSoft);color:var(--idle)}
.pill.good{background:var(--goodSoft);color:var(--good)}.pill.warn{background:var(--warnSoft);color:var(--warn)}.pill.bad{background:var(--badSoft);color:var(--bad)}.pill.blue{background:var(--blueSoft);color:var(--blue)}
.bar{height:5px;border-radius:9px;background:#edf0f7;overflow:hidden;min-width:44px}.bar i{display:block;height:100%;border-radius:9px;background:#2fbf71;transition:width .4s}
.bar.warn i{background:#f0a12b}.bar.bad i{background:#e25555}.bar.blue i{background:var(--blue)}
.lbl{font-size:.74rem;color:var(--muted)}
.btnlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:600}
.btnlink.wa{background:#25D366;border-color:#1da851;color:#06290f}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);font-weight:700;color:var(--ink2)}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;height:58px;z-index:6;background:rgba(255,255,255,.96);display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(42,52,120,.05)}
#top .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;white-space:nowrap;letter-spacing:-.01em}
#top .logo .lg{width:30px;height:30px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
#top .logo small{font-weight:600;color:var(--muted);font-size:.9rem}
#search{flex:1 1 280px;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:.86rem;background:#fff;white-space:nowrap;overflow:hidden}
#search span{overflow:hidden;text-overflow:ellipsis}
#search kbd{margin-left:auto;font:inherit;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px}
#top .sp{flex:1}
#site{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;white-space:nowrap}
#site .chipb{background:var(--blue);color:#fff;font-weight:700;font-size:.7rem;border-radius:7px;padding:4px 6px}
#site b{font-size:.84rem;display:block;line-height:1.15}#site small{font-size:.72rem;color:var(--muted)}
#clock{display:flex;align-items:center;gap:6px;background:var(--goodSoft);color:var(--good);font-weight:700;font-size:.82rem;border-radius:999px;padding:5px 10px;white-space:nowrap}
#clock i{width:7px;height:7px;border-radius:50%;background:#22b46c;display:inline-block;box-shadow:0 0 0 3px rgba(34,180,108,.18)}
.ibtn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--ink2);border-radius:10px}
.ibtn:hover{background:var(--soft)}
#me{display:flex;align-items:center;gap:9px;white-space:nowrap}
#me .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb35c,#f0782d);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.82rem}
#me b{display:block;font-size:.86rem;line-height:1.15;max-width:150px;overflow:hidden;text-overflow:ellipsis}#me small{font-size:.74rem;color:var(--muted)}
/* KPI tiles */
#kpis{position:fixed;left:18px;top:72px;z-index:5;display:flex;gap:12px}
.kpi{display:flex;gap:11px;align-items:center;padding:11px 16px 11px 12px;min-width:176px}
.kpi .ki{width:38px;height:38px;border-radius:11px;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.kpi .kt{font-size:.76rem;color:var(--ink2);font-weight:600}
.kpi .kv{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:baseline;gap:6px}
.kpi .kv small{font-size:.74rem;font-weight:700}
.kpi .ks{font-size:.7rem;color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* zoom */
#zoom{position:fixed;top:72px;right:352px;z-index:5;display:flex;flex-direction:column;padding:4px;gap:2px}
#zoom button{width:34px;height:34px;padding:0;border:none;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-radius:9px}
#zoom button:hover{background:var(--soft)}
#zoom hr{border:none;border-top:1px solid var(--line);margin:2px 4px}
/* inspect panel */
#panel{position:fixed;top:72px;right:18px;width:320px;z-index:6;max-height:calc(100vh - 330px);overflow:auto;padding:14px 16px 14px}
#panel .ph{display:flex;gap:10px;align-items:flex-start}
#panel .pic{width:44px;height:44px;border-radius:12px;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
#panel .kind{font-size:.7rem;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
#panel h3{margin:0;font-size:1.15rem;letter-spacing:-.01em}
#panel .sub{font-size:.78rem;color:var(--muted)}
#panel .acts{margin-left:auto;display:flex;gap:2px}
#panel .st{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:.8rem;color:var(--ink2)}
#panel .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.84rem;border-bottom:1px solid #f1f2f8}
#panel .kv span:first-child{color:var(--muted)}#panel .kv span:last-child{font-weight:600;text-align:right}
#panel .kv.badv span:last-child{color:var(--bad)}
.check{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--soft)}
.check b{font-size:.84rem}
.check .row{margin-top:8px}.check button{flex:1;padding:8px 10px;font-size:.84rem}
.check .done{font-size:.84rem;margin-top:6px}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chk{display:grid;gap:6px;margin-top:10px}
.chk button{display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;font-size:.84rem;padding:8px 10px}
.chk button .r{margin-left:auto}
.chk button.ok{border-color:#bfe8d3;background:#f3fbf7}.chk button.ng{border-color:#f5c2c2;background:#fff5f5}
.fl-opts{display:grid;gap:6px;margin-top:10px}.fl-opts button{text-align:left;font-size:.86rem}
/* bottom: shift tracker + lists */
#dock{position:fixed;left:18px;right:18px;bottom:16px;z-index:5;display:flex;gap:16px;align-items:flex-end;pointer-events:none}
#dock>*{pointer-events:auto}
#tracker{flex:0 1 790px;padding:13px 16px 12px;display:flex;gap:14px;min-width:0}
#tracker .tl{flex:1;min-width:0}
.th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.th .ti{color:var(--blue);display:flex}
.th .rt{margin-left:auto;font-weight:500;font-size:.74rem;color:var(--muted);white-space:nowrap}
#steps{display:flex;margin-top:12px;position:relative}
.stp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:pointer;background:none;border:none;padding:0;border-radius:0;font-weight:500}
.stp::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:3px;background:#e3e6f1;z-index:0}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:var(--blue)}
.stp .dot{width:32px;height:32px;border-radius:50%;background:#eef0f7;color:#9aa0bb;display:flex;align-items:center;justify-content:center;z-index:1;position:relative;border:3px solid #fff;box-shadow:0 0 0 1px #e3e6f1}
.stp.done .dot{background:var(--blue);color:#fff;box-shadow:0 0 0 1px var(--blue)}
.stp.cur .dot{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(42,85,229,.22)}
.stp .dot .ico{width:15px;height:15px}
.stp b{font-size:.72rem;font-weight:600;margin-top:6px;line-height:1.15;color:var(--ink2);padding:0 2px}
.stp small{font-size:.66rem;color:var(--muted)}
.stp.cur b{color:var(--blue)}
#next{flex:0 0 220px;border-radius:12px;background:var(--soft);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
#next .nk{font-size:.7rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
#next b{font-size:.92rem}
#next p{margin:0;font-size:.76rem;color:var(--muted);line-height:1.3}
#next .row{margin-top:auto;padding-top:6px}
#goBtn{padding:7px 12px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
#lists{flex:0 0 420px;margin-left:auto;padding:10px 12px 8px;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;border-bottom:1px solid var(--line)}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:none;background:transparent;padding:6px 8px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-radius:8px}
#tabs button small{color:#aab0c8;margin-left:3px;font-weight:600}
#tabs button.on{color:var(--ink);background:var(--soft)}
#tabs .tico{color:var(--blue);display:flex;padding:0 4px}
#tabs .tsh{display:none}
#list{max-height:170px;overflow:auto}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f2f3f9;cursor:pointer;font-size:.8rem}
.li:last-child{border-bottom:none}
.li:hover{background:#fafbff}
.li .id{width:68px;flex:none}.li .id b{display:block;font-size:.8rem}.li .id small{font-size:.66rem;color:var(--muted)}
.li .ds{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.li .pg{width:54px;flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:.66rem;color:var(--muted)}
.li .pg .bar{width:54px}
.li .cv{color:#b5bad0;display:flex}
.li.q .ds{color:var(--muted)}
.hint{font-size:.74rem;color:var(--muted);padding:6px 2px 2px}
#sheetH{display:none}
/* floating tags over the 3D */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;background:#fff;border-radius:7px;padding:2px 7px 2px 3px;font-size:.7rem;font-weight:700;box-shadow:0 3px 10px rgba(42,52,120,.16);white-space:nowrap;color:var(--ink)}
.tag b{background:var(--blue);color:#fff;border-radius:5px;padding:1px 5px;font-size:.66rem}
.tag span{color:var(--muted);font-weight:600}
.tag.me b{background:#f0782d}.tag.pin{background:var(--blue);color:#fff;padding:3px 9px}.tag.pin span{color:#dfe6ff}
.tag.sel{box-shadow:0 0 0 2px var(--blue),0 3px 10px rgba(42,52,120,.16)}
.tag.alarm{background:var(--bad);color:#fff}.tag.alarm span{color:#ffe0e0}
/* toasts + captions */
#toast{position:fixed;left:18px;top:166px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;width:min(92vw,420px)}
.tst{background:#fff;border-radius:11px;padding:9px 14px;font-size:.86rem;box-shadow:var(--sh);border-left:4px solid var(--blue);animation:tin .25s ease-out}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:#f0a12b}.tst.good{border-left-color:#22b46c}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#slCaption{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);z-index:9;max-width:min(92vw,620px);background:rgba(27,31,59,.86);color:#fff;padding:8px 14px;border-radius:10px;font-size:.92rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#slCaption.on{opacity:1}
/* modal cards (question, start, end, settings) */
.ov{position:fixed;inset:0;z-index:10;background:rgba(232,235,248,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px 22px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(42,52,120,.22),0 2px 8px rgba(42,52,120,.08)}
.modal h1{margin:.1em 0 .2em;font-size:1.5rem;letter-spacing:-.02em}
.modal h2{margin:.1em 0 .5em;font-size:1.15rem}
.modal p{margin:.5em 0}
.modal label{cursor:pointer}
.qchip{display:inline-flex;gap:6px;align-items:center;font-size:.7rem;font-weight:700;color:var(--blue);background:var(--blueSoft);border-radius:999px;padding:4px 10px;letter-spacing:.03em;text-transform:uppercase}
.who{display:flex;gap:10px;align-items:center;margin:12px 0 4px}
.who .av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.84rem;flex:none}
.who b{display:block;font-size:.9rem}.who small{color:var(--muted);font-size:.76rem}
.qt{font-size:1.06rem;font-weight:600;line-height:1.4;margin:10px 0 4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left;display:flex;gap:10px;align-items:flex-start;font-weight:500;padding:11px 12px;border-radius:12px;line-height:1.35}
.opts button .k{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--ink2);font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex:none}
.opts button:hover:not(:disabled){border-color:var(--blue);background:#f8faff}
.opts button.ok{border-color:#9bd9b8;background:#f1fbf5;opacity:1}.opts button.ok .k{background:#22b46c;color:#fff}
.opts button.no{border-color:#f2b3b3;background:#fff6f6;opacity:1}.opts button.no .k{background:var(--bad);color:#fff}
.fb{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--goodSoft);font-size:.9rem;color:#0f5b3a}
.fb.bad{background:var(--badSoft);color:#7d1f1f}
.fb b{display:block;margin-bottom:2px}
.fb .also{display:block;margin-top:6px;color:var(--ink2)}
.mend{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.consent{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.86rem}
.consent label{display:flex;gap:8px;align-items:flex-start}.consent input{margin-top:3px}
.consent details{margin-top:6px}.consent summary{cursor:pointer;color:var(--muted)}
.modal select{margin-top:4px}
/* start screen */
.start{width:min(560px,100%)}
.hero{display:flex;gap:12px;align-items:center}
.hero .lg{width:46px;height:46px;border-radius:13px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hero h1{margin:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.feat div{background:var(--soft);border-radius:12px;padding:10px;font-size:.78rem;color:var(--ink2)}
.feat b{display:block;color:var(--ink);font-size:.86rem;margin:4px 0 1px}
.feat .ico{color:var(--blue)}
.fld{margin-top:10px}.fld>span{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px}.fld>span small{font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.games{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.gcard{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);text-decoration:none;font-size:.76rem;font-weight:600;white-space:nowrap}
.gcard.on{border-color:var(--blue);color:var(--blue);background:var(--blueSoft)}
.gcard small{display:none}
.keys{font-size:.76rem;color:var(--muted);margin-top:10px}
/* end screen */
.endc{width:min(600px,100%)}
.endh{display:flex;gap:14px;align-items:center}
.endh .big{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.endh .big.pass{background:var(--goodSoft);color:var(--good)}.endh .big.fail{background:var(--warnSoft);color:var(--warn)}
.endk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.endk div{background:var(--soft);border-radius:12px;padding:10px 12px}.endk b{display:block;font-size:1.3rem;letter-spacing:-.02em}.endk span{font-size:.72rem;color:var(--muted)}
.learn{margin:6px 0 0;padding:0;list-style:none}
.learn li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f1f2f8;font-size:.86rem}
.learn li .ico{color:var(--blue);margin-top:1px}
.share{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(220,40,40,.42);animation:pl .9s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 6px rgba(220,40,40,.18)}}
.nepa{position:fixed;inset:0;z-index:3;pointer-events:none;background:rgba(20,24,50,.18);transition:opacity .4s}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}.tst{animation:none}}
/* ---------- phone: cards collapse into a bottom sheet ---------- */
@media (max-width:760px){
  #top{height:52px;padding:0 10px;gap:8px}
  #search,#site,#me div,#top .logo small{display:none}
  #top .logo{font-size:.98rem}
  #clock{padding:4px 8px;font-size:.76rem}
  #kpis{left:10px;right:10px;top:60px;gap:6px}
  .kpi{flex:1;min-width:0;padding:7px 8px;gap:7px}
  .kpi .ki{width:28px;height:28px;border-radius:9px}.kpi .ki .ico{width:15px;height:15px}
  .kpi .kt{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .kv{font-size:1.08rem}.kpi .ks{display:none}
  #zoom{right:10px;top:124px;padding:2px}
  #zoom button{width:32px;height:32px}
  #dock{left:0;right:0;bottom:0;flex-direction:column;gap:0;align-items:stretch;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(42,52,120,.12);padding-bottom:env(safe-area-inset-bottom)}
  #dock .card{box-shadow:none;border-radius:0;background:transparent}
  #sheetH{display:block;width:40px;height:5px;border-radius:9px;background:#d9dcea;margin:7px auto 0;border:none;padding:0}
  #tracker{flex:none;padding:6px 14px 4px;flex-direction:column;gap:8px}
  #tracker .th .rt{display:none}
  #steps{margin-top:8px}
  .stp b,.stp small{display:none}
  .stp .dot{width:26px;height:26px}.stp::before{top:12px}

You could fall into the well. Always stay away from open wells.": "Za ka iya faɗawa cikin rijiya. Ko yaushe ka nisanci rijiya a buɗe.", "Correct! Never play near an open well or soakaway.": "Daidai! Kada ka yi wasa kusa da rijiya ko ramin shara a buɗe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Sannu! Mamarka ce ta aiko ni in kai ka makaranta. Zo mu tafi.\"", "Go with him, he knows Mummy": "Bi shi, ya san Mama", "Do not open the gate. Run back and tell Mummy": "Kada ka buɗe ƙofa. Gudu ka koma ka faɗa wa Mama", "Never go with someone you do not know. Strangers can say anything.": "Kada ka bi wanda ba ka sani ba. Baƙi za su iya faɗin komai.", "Excellent! Never go with a stranger. Always tell your parents.": "Madalla sosai! Kada ka bi baƙo. Ko yaushe ka faɗa wa iyayenka.", "Where should you walk on the street?": "Ina ya kamata ka yi tafiya a titi?", "In the middle of the road": "A tsakiyar titi", "On the walkway, holding an adult's hand": "A hanyar masu tafiya, kana riƙe da hannun babba", "Cars, okadas and kekes use the road. You could be hit.": "Motoci, okada da keke suna amfani da titi. Za su iya bugarka.", "Correct! Walk on the walkway and hold an adult's hand.": "Daidai! Yi tafiya a hanyar masu tafiya ka riƙe hannun babba.", "You want to cross the road. What do you do first?": "Kana so ka tsallaka titi. Me za ka fara yi?", "Run across quickly": "Gudu ka tsallaka da sauri", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Tsaya a zebra, duba hagu, dama, hagu kuma, ka jira motoci su tsaya", "Running across the road is very dangerous.": "Gudun tsallaka titi haɗari ne sosai.", "Well done! Stop, look and listen before you cross.": "Madalla! Tsaya, duba, ka saurara kafin ka tsallaka.", "The school bus is coming. Where should you stand?": "Motar makaranta tana zuwa. Ina ya kamata ka tsaya?", "At the edge of the road, ready to jump in": "A bakin titi, a shirye don tsalle ciki", "Behind the yellow line until the bus stops completely": "A bayan layin rawaya har motar ta tsaya gaba ɗaya", "You could fall or be hit by the bus. Stay back.": "Za ka iya faɗuwa ko motar ta buge ka. Ja da baya.", "Correct! Wait behind the line until the bus stops.": "Daidai! Jira a bayan layi har motar ta tsaya.", "You are on the bus. What should you do?": "Kana cikin mota. Me ya kamata ka yi?", "Stand up and put your head out of the window": "Tashi ka fitar da kanka ta taga", "Sit down, fasten your seatbelt and keep hands inside": "Zauna, ɗaura bel, ka ajiye hannayenka a ciki", "Never put your head or hands out of a moving bus.": "Kada ka fitar da kai ko hannu daga motar da ke tafiya.", "Excellent! Sit down and wear your seatbelt.": "Madalla sosai! Zauna ka ɗaura bel.", "\"Your Daddy is busy. I will take you home. Get in my car.\"": "\"Babanka yana da aiki. Zan kai ka gida. Shiga motata.\"", "Get in, he looks nice": "Shiga, yana kama da mutumin kirki", "Say NO, stay inside, and tell the gatekeeper or teacher": "Ka ce A'A, ka zauna a ciki, ka faɗa wa mai gadi ko malami", "Never go with someone who is not on your pick-up list.": "Kada ka bi wanda ba ya cikin jerin masu ɗaukarka.", "Excellent! Only go home with people your parents chose.": "Madalla sosai! Ka tafi gida da waɗanda iyayenka suka zaɓa kawai.", "\"This is our fire assembly point.\" If the fire alarm rings, where do you go?": "\"Wannan ne wurin taruwarmu na gobara.\" Idan ƙararrawar gobara ta yi ƙara, ina za ka je?", "Hide under my desk": "Ɓoye a ƙarƙashin teburina", "Walk quickly to the assembly point and line up with my class": "Yi tafiya da sauri zuwa wurin taruwa ka jera tare da ajinka", "In a fire you must leave the building. Hiding is dangerous.": "A lokacin gobara dole ka fita daga ginin. Ɓoyewa haɗari ne.", "Correct! Remember this place.": "Daidai! Ka tuna da wannan wuri.", "The socket near your desk is sparking and smells like burning.": "Soket ɗin da ke kusa da teburinka yana tartsatsi kuma yana wari kamar abin da ke ƙonewa.", "Pull out the plug yourself": "Cire filogin da kanka", "Move away and tell the teacher immediately": "Ka matsa nesa ka faɗa wa malami nan da nan", "You could get an electric shock.": "Wutar lantarki za ta iya ja maka.", "Correct! Never touch sparking sockets.": "Daidai! Kada ka taɓa soket mai tartsatsi.", "Your classmate is leaning back on two chair legs.": "Abokin ajinka yana jingina baya a kan ƙafafun kujera biyu.", "Do it too, it is fun": "Kai ma ka yi, yana da daɗi", "Sit with all four chair legs on the floor and tell him to stop": "Zauna da ƙafafun kujera huɗu a ƙasa ka gaya masa ya daina", "The chair can fall back and you can hit your head.": "Kujera za ta iya faɗuwa baya ka bugi kanka.", "Well done! Sit properly on your chair.": "Madalla! Zauna da kyau a kan kujerarka.", "The break bell rings and everyone rushes out.": "Ƙararrawar hutu ta yi kuma kowa yana gaggawar fita.", "Push to be the first one out": "Tura mutane don ka fara fita", "Walk, keep to the right, and do not push": "Yi tafiya, bi gefen dama, kada ka tura kowa", "Pushing causes falls and injuries.": "Turawa yana jawo faɗuwa da rauni.", "Correct! Walk calmly in corridors.": "Daidai! Yi tafiya a hankali a hanyoyin ciki.", "Some big pupils are pushing a small boy and taking his snacks.": "Wasu manyan ɗalibai suna tura wani ƙaramin yaro suna ƙwace masa kayan ciye-ciye.", "Join them and laugh": "Shiga cikinsu ka yi dariya", "Do not join. Go and tell a teacher at once": "Kada ka shiga. Je ka faɗa wa malami nan da nan", "Bullying hurts people. Never join in.": "Cin zali yana cutar da mutane. Kada ka shiga.", "Brave and kind! Always tell a teacher about bullying.": "Jarumi kuma mai kirki! Ko yaushe ka faɗa wa malami game da cin zali.", "There are bottles of coloured liquid on the bench and no teacher.": "Akwai kwalabe na ruwa mai launi a kan benci kuma babu malami.", "Smell or taste them": "Ka ji ƙamshinsu ko ka ɗanɗana", "Do not touch. Wait for the teacher": "Kada ka taɓa. Jira malami", "Chemicals can burn your skin, eyes and mouth.": "Sinadarai za su iya ƙone fatarka, idanunka da bakinka.", "Correct! Only use the lab with a teacher.": "Daidai! Yi amfani da ɗakin kimiyya tare da malami kawai.", "You have used the toilet. What next?": "Ka yi amfani da banɗaki. Me ya biyo baya?", "Go straight back to class": "Koma aji kai tsaye", "Wash hands with soap and water for 20 seconds": "Wanke hannu da sabulu da ruwa na daƙiƙa 20", "Germs on your hands can make you and others sick.": "Ƙwayoyin cuta a hannunka za su iya sa kai da wasu rashin lafiya.", "Great! Clean hands stop germs.": "Madalla! Hannu mai tsabta yana hana ƙwayoyin cuta.", "Someone spilled hot pepper soup on the floor.": "Wani ya zubar da miyar barkono mai zafi a ƙasa.", "Jump over it and run": "Tsallake shi ka gudu", "Walk around it and tell the canteen staff": "Zagaya shi ka faɗa wa ma'aikatan wurin cin abinci", "You could slip and get burnt.": "Za ka iya zamewa ka ƙone.", "Correct! Report spills so they can be cleaned.": "Daidai! Kai rahoton abin da aka zubar don a goge shi.", "One chain on the swing is broken.": "Sarƙa ɗaya ta lilo ta karye.", "Swing anyway, very high": "Yi lilo duk da haka, sama sosai", "Do not use it. Tell a teacher it is broken": "Kada ka yi amfani da shi. Faɗa wa malami cewa ya karye", "Broken swings can throw you to the ground.": "Lilo da ya karye zai iya jefa ka ƙasa.", "Well done! Report broken play equipment.": "Madalla! Kai rahoton kayan wasan da suka lalace.", "You fell and cut your knee. It is bleeding.": "Ka faɗi ka ji wa gwiwarka rauni. Jini yana fita.", "Hide it so nobody knows": "Ɓoye shi don kada kowa ya sani", "Tell a teacher and go to the sick bay": "Faɗa wa malami ka je ɗakin marasa lafiya", "A cut can get infected. Adults can help you.": "Rauni zai iya kamuwa da cuta. Manya za su iya taimaka maka.", "Correct! Always report injuries.": "Daidai! Ko yaushe ka kai rahoton rauni.", "Your school bus is parking. Where do you wait?": "Motar makarantarka tana ajiyewa. Ina za ka jira?", "Behind the bus where the driver cannot see me": "A bayan mota inda direba ba zai iya ganina ba", "Behind the yellow line, where the driver can see me": "A bayan layin rawaya, inda direba zai iya ganina", "The driver cannot see behind the bus. You could be hit.": "Direba ba zai iya ganin bayan mota ba. Za a iya buge ka.", "Correct! Stay where the driver can see you.": "Daidai! Tsaya inda direba zai iya ganinka."}, "ig": {"Loading Site Life 3D…": "Site Life 3D na-emepe…", "Loading…": "Ọ na-emepe…", "Choose a game": "Họrọ egwuregwu", "Factory Site Induction": "Nkuzi Nchekwa Ụlọ Ọrụ", "Workers & visitors": "Ndị ọrụ na ndị ọbịa", "Home → School Bus": "Ụlọ → Ụgbọ ala ụlọ akwụkwọ", "Kids 6–12": "Ụmụaka 6–12", "School Safety": "Nchekwa n'Ụlọ Akwụkwọ", "The safety induction you": "Nkuzi nchekwa ị ga-", "play": "egwu", ", not a paper you tick. Walk the compound, make the right calls, spot the hazards, and survive your first shift.": ", ọ bụghị akwụkwọ ị ga-akara naanị. Gagharịa n'ogige ahụ, mee mkpebi ziri ezi, chọpụta ihe egwu, ma lanarị ọrụ mbụ gị.", "Demo site:": "Ebe ngosi:", "Your name": "Aha gị", "Company": "Ụlọ ọrụ", "(optional)": "(ọ bụghị iwu)", "e.g. Tunde Bakare": "dịka: Tunde Bakare", "e.g. ABC Contractors Ltd": "dịka: ABC Contractors Ltd", "Your character": "Onye gị n'egwuregwu", "Man": "Nwoke", "Woman": "Nwaanyị", "Shirt colour and skin tone": "Agba uwe na agba anụ ahụ", "shirt colour": "agba uwe", "skin tone": "agba anụ ahụ", "Role lottery 🎲": "Nkọwa ọrụ site na chaa chaa 🎲", "Like Lagos Life's birth lottery, you don't choose.": "Dịka chaa chaa ọmụmụ nke Lagos Life, ọ bụghị gị na-ahọrọ.", "Spin role": "Tụgharịa ọrụ", "Start shift ▶": "Malite ọrụ ▶", "Language & settings": "Asụsụ na ntọala", "Computer:": "Kọmputa:", "WASD to walk, drag the mouse to look, E to interact, V to switch first/third person.": "WASD iji jee ije, dọrọ òké iji lee anya, E iji kparịta, V iji gbanwee nlele.", "Phone:": "Ekwentị:", "drag the left side of the screen to walk, drag th  Nọrọ ebe dị anya n'ọkụ.", "Correct! Keep away from hot things in the kitchen.": "Ọ ziri ezi! Nọrọ ebe dị anya n'ihe dị ọkụ na kichin.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ewerela ọkụ. Nwanne gị nwoke tinyere kandụl na-enwu n'akụkụ ákwà mkpuchi windo. Gịnị ka ị ga-eme?", "Leave it, the candle is small": "Hapụ ya, kandụl ahụ dị obere", "Tell an adult to move it away and use a rechargeable lamp": "Gwa onye okenye ka o wepụ ya ma jiri oriọna a na-achaji", "Curtains catch fire very fast. A small flame can burn the whole house.": "Ákwà mkpuchi windo na-ere ọkụ ngwa ngwa. Obere ọkụ nwere ike ịgba ụlọ niile.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ọ dị mma! Debe ọkụ ebe dị anya n'ákwà mkpuchi windo, ma ọ bụ jiri oriọna a na-achaji.", "You see some sweet-looking tablets on the table. What should you do?": "Ị hụrụ ụfọdụ ọgwụ yiri swiiti n'elu tebụl. Gịnị ka i kwesịrị ime?", "Taste one, it looks like sweets": "Detụ otu ire, ọ dị ka swiiti", "Do not touch. Tell an adult to keep it out of reach": "Emetụla ya aka. Gwa onye okenye ka o debe ya ebe aka agaghị eru", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Ọgwụ nwere ike ime ka ị rịa ọrịa nke ukwuu. Were ọgwụ naanị n'aka nne, nna ma ọ bụ dọkịta.", "Correct! Never eat medicine on your own.": "Ọ ziri ezi! Aṅụla ọgwụ n'onwe gị.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jenerẹtọ Papa na-arụ ọrụ n'akụkụ windo kichin. Gịnị ka i kwesịrị ime?", "Go and touch it to see if it is hot": "Gaa metụ ya aka ka ị mara ma ọ dị ọkụ", "Stay away and tell Daddy it must be far from windows and doors": "Nọrọ ebe dị anya ma gwa Papa na ọ ga-anọ ebe dị anya na windo na ọnụ ụzọ", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jenerẹtọ na-ekpo ọkụ nke ukwuu, anwụrụ ọkụ ya bụ nsị (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ọ ziri ezi! Anwụrụ ọkụ jenerẹtọ nwere ike igbu mmadụ. Ọ ga-anọ n'èzí, ebe dị anya na windo.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Mkpuchi olulu mmiri meghere emeghe. Bọọlụ gị gbagoro n'akụkụ ya. Gịnị ka ị ga-eme?", "Run and get the ball": "Gbaa ọsọ were bọọlụ ahụ", "Stay away and call an adult to get the ball and close the well": "Nọrọ ebe dị anya ma kpọọ onye okenye ka o were bọọlụ ma mechie olulu mmiri", "You could fall into the well. Always stay away from open wells.": "Ị nwere ike ịdaba n'olulu mmiri. Na-anọ ebe dị anya n'olulu mmiri meghere emeghe mgbe niile.", "Correct! Never play near an open well or soakaway.": "Ọ ziri ezi! Egwula egwu n'akụkụ olulu mmiri ma ọ bụ olulu nsị meghere emeghe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ndewo! Mama gị zitere m ka m kpọga gị ụlọ akwụkwọ. Soro m.\"", "Go with him, he knows Mummy": "Soro ya, ọ maara Mama", "Do not open the gate. Run back and tell Mummy": "Emeghela ọnụ ụzọ ama. Gbaghachi azụ gwa Mama", "Never go with someone you do not know. Strangers can say anything.": "Esorola onye ị na-amaghị. Ndị a na-amaghị nwere ike ikwu ihe ọ bụla.", "Excellent! Never go with a stranger. Always tell your parents.": "Ọ magburu onwe ya! Esorola onye a na-amaghị. Na-agwa nne na nna gị mgbe niile.", "Where should you walk on the street?": "Ebee ka i kwesịrị ije ije n'okporo ámá?", "In the middle of the road": "N'etiti okporo ụzọ", "On the walkway, holding an adult's hand": "N'ụzọ ndị na-eje ije, jide aka onye okenye", "Cars, okadas and kekes use the road. You could be hit.": "Ụgbọ ala, okada na keke na-eji okporo ụzọ. Ha nwere ike ịkụ gị.", "Correct! Walk on the walkway and hold an adult's hand.": "Ọ ziri ezi! Jee ije n'ụzọ ndị na-eje ije ma jide aka onye okenye.", "You want to cross the road. What do you do first?": "Ị chọrọ ịgafe okporo ụzọ. Gịnị ka ị ga-ebu ụzọ mee?", "Run across quickly": "Gbaa ọsọ gafee ngwa ngwa", "Stop at the zebra, u go?": "\"Nke a bụ ebe nzukọ ọkụ anyị.\" Ọ bụrụ na mgbịrịgba ọkụ dara, ebee ka ị ga-aga?", "Hide under my desk": "Zoo n'okpuru tebụl m", "Walk quickly to the assembly point and line up with my class": "Jee ije ọsọ ọsọ gaa ebe nzukọ ma kwụ n'ahịrị na klas m", "In a fire you must leave the building. Hiding is dangerous.": "Mgbe ọkụ na-ere, ị ga-apụ n'ụlọ. Izo ezo dị egwu.", "Correct! Remember this place.": "Ọ ziri ezi! Cheta ebe a.", "The socket near your desk is sparking and smells like burning.": "Soket dị n'akụkụ tebụl gị na-agba ọkụ, ọ na-esikwa isi ihe na-ere ọkụ.", "Pull out the plug yourself": "Wepụ plọg n'onwe gị", "Move away and tell the teacher immediately": "Pụọ ebe ahụ ma gwa onye nkuzi ozugbo", "You could get an electric shock.": "Ọkụ eletrik nwere ike ịgba gị.", "Correct! Never touch sparking sockets.": "Ọ ziri ezi! Emetụla soket na-agba ọkụ aka.", "Your classmate is leaning back on two chair legs.": "Onye klas gị na-adabere azụ n'ụkwụ oche abụọ.", "Do it too, it is fun": "Mee ya kwa, ọ na-atọ ụtọ", "Sit with all four chair legs on the floor and tell him to stop": "Nọdụ ala ka ụkwụ oche anọ niile dị n'ala ma gwa ya ka ọ kwụsị", "The chair can fall back and you can hit your head.": "Oche nwere ike ịda azụ, ị nwekwara ike ịkụ isi gị.", "Well done! Sit properly on your chair.": "I mere nke ọma! Nọdụ ala nke ọma n'oche gị.", "The break bell rings and everyone rushes out.": "Mgbịrịgba ezumike dara, onye ọ bụla na-agba ọsọ apụ.", "Push to be the first one out": "Kwaa mmadụ ka ị bụrụ onye mbụ pụọ", "Walk, keep to the right, and do not push": "Jee ije, nọrọ n'aka nri, akwala onye ọ bụla", "Pushing causes falls and injuries.": "Ịkwa mmadụ na-akpata ọdịda na mmerụ ahụ.", "Correct! Walk calmly in corridors.": "Ọ ziri ezi! Jee ije nwayọ n'okporo ụzọ ime ụlọ.", "Some big pupils are pushing a small boy and taking his snacks.": "Ụfọdụ ụmụ akwụkwọ buru ibu na-akwa otu obere nwata nwoke ma na-anapụ ya nri ya.", "Join them and laugh": "Sonye ha ma chịa ọchị", "Do not joi it anyway. Work is waiting and I will be careful.": "I go still drive am. Work dey wait and I go careful.", "Tag it out \"Do not use\", take the key out and report the faults to the supervisor.": "Tag am \"No use am\", comot the key and report the faults give supervisor.", "Wipe the oil and drive it. The horn is not important.": "Clean the oil and drive am. Horn no important.", "A forklift with a hydraulic leak can drop its load, and with no horn you cannot warn people at blind corners. Never use a faulty forklift.": "Forklift wey hydraulic dey leak fit drop im load, and if horn no work you no fit warn people for corner wey you no fit see. No ever use forklift wey get fault.", "Faulty equipment is tagged and taken out of use until a competent mechanic repairs it. Only trained, licensed operators drive, and only after a good pre-use check.": "Equipment wey get fault, dem go tag am and stop to use am until correct mechanic repair am. Na only trained driver wey get licence go drive, and only after correct pre-use check.", "Wiping the oil hides the fault. The horn warns people at blind corners and crossings. Tag it out and report it.": "If you clean the oil, you dey hide the fault. Horn dey warn people for blind corner and crossing. Tag am out and report am.", "FL-03 now has a red \"Do not use\" tag. The key is in the supervisor's office.": "FL-03 don get red \"No use am\" tag now. The key dey supervisor office.", "Bisi: Before anyone drives FL-03, we do the pre-use check. Tap each item in the panel.": "Bisi: Before anybody drive FL-03, we go do pre-use check. Touch each one for the panel.", "Step {0} of {1}": "Step {0} of {1}", "Correct!": "Correct!", "Not quite.": "E no correct.", "The safe answer:": "The safe answer:", "Mallam Sani hands you a hi-vis vest, safety boots and a hard hat.": "Mallam Sani give you hi-vis vest, safety boots and hard hat.", "Welcome to Lagos DC! Before you go onto the warehouse floor, which PPE do you need?": "Welcome to Lagos DC! Before you enter warehouse floor, which PPE you need?", "Only a face cap. It is hot inside.": "Only face cap. Inside dey hot.", "A face cap will not protect your head from falling stock, and drivers will not see you without hi-vis.": "Face cap no go protect your head if goods fall, and drivers no go see you if you no wear hi-vis.", "Hi-vis vest and safety boots everywhere, and a hard hat in the racking aisles.": "Hi-vis vest and safety boots everywhere, and hard hat for racking aisles.", "Hi-vis makes you visible to forklift and truck drivers, boots protect your feet from pallets and wheels, and a hard hat protects you from falling stock under high racking.": "Hi-vis dey make forklift and truck drivers see you, boots dey protect your leg from pallet and tyre, and hard hat dey protect you if goods fall from high racking.", "PPE is only for forklift drivers, not for pickers.": "PPE na only for forklift drivers, e no be for pickers.", "Everyone on the warehouse floor shares the space with forklifts and trucks, so everyone wears the PPE.": "Everybody for warehouse floor dey share the place with forklift and truck, so everybody go wear the PPE.", "A visitor from head office signs in at the gate. Where is the visitor allowed to walk?": "One visitor from head office sign in for gate. Where the visitor fit waka?", "Through the dock doors, because it is the shortest way.": "Through the dock doors, because na im short pass.", "Dock doors are for trucks and forklifts. People use the pedestrian doors.": "Dock doors na for truck and forklift. People dey use the door for people.", "Anywhere, as long as he is careful.": "Anywhere, as long as e dey careful.", "Being careful is not enough. Drivers do not expect people in vehicle areas, and a visitor does not know the site.": "To dey careful no reach. Drivers no dey expect people for where motor dey pass, and visitor no know the site.", "Only on the green pedestrian walkway, in hi-vis, with an escort.": "Only for green walkway for people, with hi-vis, and person go escort am.", "Walkways keep people away from forklifts and trucks. A visitor does not know the site, so he stays on the walkway with an escort.": "Walkway dey keep people far from forklift and truck. Visitor no know the site, so e go stay for walkway with escort.", "A truck is reversing into Bay 1 and the driver cannot see behind the truck. What do you do?": "One truck dey reverse enter Bay 1 and the driver no fit see back of the truck. Wetin you go do?", "Stay out of the hatched reversing zone and let the trained banksman guide the driver.": "Comot from the yellow-line reversing zone and make the trained banksman guide the driver.", "Reversing vehicles cause many deaths in yards. Only one trained banksman guides, standing where the driver can see him in the mirror. Everyone else keeps clear.": "Motor wey dey reverse don kill plenty people for yard. Na only one trained banksman go guide, e go stand where driver fit see am for mirror. Everybody else go comot for road.", "Stand behind the truck and shout directions to help.": "Stand for back of the truck and dey shout direction to help.", "Behind a reversing truck is the most dangerous place in the yard. The driver cannot see you there.": "Back of truck wey dey reverse na the most dangerous place for yard. Driver no fit see you for there.", "Wave at the driver from beside the truck as well.": "You sef dey wave for driver from side of the truck.", "Two people guiding give mixed signals. One trained banksman only.": "If two people dey guide, signal go scatter. Only one trained banksman.", "The truck is now at Bay 1. Before anyone drives a forklift into it, what must be done?": "The truck don reach Bay 1 now. Before anybody drive forklift enter am, wetin dem must do?", "Nothing. The driver knows he must wait.": "Nothing. Driver know say e must wait.", "Drivers do pull away early, especially when they want to beat Lagos traffic. Control the keys and secure the truck.": "Drivers dey comot early, especially when dem wan beat Lagos traffic. Hold the keys and lock the truck well.", "Engine off, keys handed in to the dock office, wheel chocks or the dock lock on.": "Off the engine, give the keys to dock office, put wheel chocks or on the dock lock.", "This stops the truck pulling away or creeping forward while a forklift is inside, which can drop the forklift between the dock and the truck.": "This one go stop the truck make e no comot or shift small small when forklift dey inside, because e fit drop the forklift between dock and truck.", "Keep the engine running so the driver can move fast if needed.": "Leave the engine on so driver fit move quick if e need am.", "A running engine and a driver in the cab is exactly how trucks pull away with a forklift half inside.": "Engine wey dey run and driver for cab na exactly how truck dey comot when forklift still dey half inside.", "Chidi calls from his forklift: \"Hop on the forks, make I carry you go Bay 3 quick quick!\" What do you say?": "Chidi call you from im forklift: \"Jump enter the forks, make I carry you go Bay 3 quick quick!\" Wetin you go talk?", "OK, as long as you drive slowly.": "OK, as long as you go drive slow.", "Even at walking speed, one bump can throw you off the forks and under the wheels.": "Even if e slow like person wey dey waka, one bump fit throw you comot from forks enter under tyre.", "OK, I will hold the mast so I don't fall.": "OK, I go hold the mast make I no fall.", "Holding the mast puts your hands in the chains and pinch points.": "If you hold the mast, your hand go enter the chain and place wey fit jam am.", "No thank you. Nobody rides on the forks. I will walk on the walkway.": "No thank you. Nobody dey ride for forks. I go waka for walkway.", "Forks are for loads, never for people. Only the trained, licensed operator rides, in the seat with the seat belt on, forks low and at walking speed in the aisles.": "Forks na for load, e no be for people. Na only trained driver wey get licence go ride, inside seat with seat belt, forks low, and slow like waka speed for aisles.", "This rack upright is badly dented. On the rack inspection traffic-light scale it is RED, and the rack is full. What should happen?": "This rack upright don bend well well. For rack inspection traffic-light scale e be RED, and the rack full. Wetin suppose happen?", "Keep using it, but only put light pallets there.": "Dey use am, but only put light pallet there.", "Any load on a red-damaged upright can bring the whole run down.": "Any load for upright wey red damage dey fit bring the whole rack down.", "Straighten it with a hammer and carry on.": "Use hammer straighten am and continue.", "Never repair racking yourself. The steel is weakened. A competent rack inspector decides on repair or replacement.": "No ever repair racking by yourself. The iron don weak. Correct rack inspector go decide whether to repair am or change am.", "Stop using it: unload the bay safely, quarantine (barrier off) the area and report it.": "Stop to use am: offload the bay safely, block (barrier) the area and report am.", "RED means act now. A damaged upright can collapse the racking. Offload it under supervision, isolate it and get it repaired before it is used again.": "RED mean say act now. Upright wey don damage fit make racking fall. Offload am with supervisor, block am and make dem repair am before anybody use am again.", "The load notice on the rack says MAX 1,000 kg PER LEVEL. The next pallet of tiles weighs 1,400 kg. What do you do?": "Load notice for the rack talk say MAX 1,000 kg PER LEVEL. The next pallet of tiles weigh 1,400 kg. Wetin you go do?", "Do not put it in this rack. Tell the supervisor and use a floor location or a bay rated for it.": "No put am for this rack. Tell supervisor and use floor location or bay wey fit carry am.", "The load notice is the design limit. Overloading bends the beams and can bring the rack down. Never exceed it.": "Load notice na the limit wey dem design am for. Overload dey bend the beams and fit bring rack down. No ever pass am.", "Put it in. The rack is strong steel.": "Put am. Rack na strong iron.", "The rack is only as strong as its design. 1,400 kg is 40% over the limit.": "Rack strong reach only wetin dem design am for. 1,400 kg pass the limit by 40%.", "Put it on the top level, so nobody walks under it.": "Put am for top level, so nobody go waka under am.", "Heavy loads high up make it worse: more stress on the rack, and further to fall.": "Heavy load for up dey make am worse: more pressure for rack, and e go fall from high place.", "Your pick list says one 25 kg carton from the top level of rack R2. How do you get it?": "Your pick list talk say one 25 kg carton from top level of rack R2. How you go take am?", "Climb the rack beams like a ladder. It is faster.": "Climb the rack beams like ladder. E fast pass.", "Never climb racking. Beams are not ladders, and you can fall or pull the stock down on yourself.": "No ever climb racking. Beams no be ladder, you fit fall or pull the goods fall on top your body.", "Use the order picker or a platform step ladder, keep the load close and lift with your legs. Ask for a team lift if it is too heavy.": "Use order picker or platform step ladder, hold the load close to your body and lift with your legs. Ask make people help you lift if e too heavy.", "Use proper access equipment. Bend your knees, keep the load close to your body and do not twist. For heavy or awkward loads, get help or a lifting aid.": "Use correct equipment to reach am. Bend your knee, hold the load close to your body and no twist. For heavy or load wey hard to carry, find help or lifting aid.", "Pull it down with a hook so it falls into your arms.": "Use hook pull am down make e fall enter your hand.", "A falling 25 kg carton can injure your head, neck and back.": "25 kg carton wey dey fall fit wound your head, neck and back.", "In the pick aisle there is loose shrink-wrap, a broken pallet and an oil spill. What is the right action?": "For pick aisle, shrink-wrap scatter for ground, one pallet don break and oil don pour. Wetin be the correct thing to do?", "Walk around it. The cleaners will come later.": "Waka pass am for side. Cleaners go come later.", "Slips and trips are among the most common warehouse injuries. If you see it, deal with it or report it now.": "To slip and fall na among the injuries wey dey happen pass for warehouse. If you see am, handle am or report am now now.", "Cover the oil with flat cardboard and carry on.": "Cover the oil with flat cardboard and continue.", "Cardboard hides the oil and becomes slippery itself.": "Cardboard dey hide the oil and e self go dey slippery.", "Put out a wet-floor sign, clean the spill with the spill kit, bin the wrap, take the broken pallet out of use and report the leak.": "Put wet-floor sign, use spill kit clean the oil, throw the wrap for bin, comot the broken pallet from use and report the leak.", "Good housekeeping prevents slips, trips and forklift skids. Find where the oil came from so it does not happen again.": "Good housekeeping dey stop slip, fall and forklift skid. Find where the oil come from so e no go happen again.", "In the battery charging bay, a colleague wants to light a cigarette \"just quickly\". What is right?": "For battery charging bay, one colleague wan light cigarette \"just small\". Wetin be the correct thing?", "No smoking or flames here. Charging batteries give off hydrogen, which can explode. Keep the bay ventilated, wear a face shield, apron and gloves, and know where the eye-wash is.": "No smoking or fire for here. Battery wey dey charge dey release hydrogen wey fit explode. Make air dey enter the bay, wear face shield, apron and gloves, and know where the eye-wash dey.", "Hydrogen from charging batteries can explode, and battery acid burns skin and eyes. Ventilation, no flames, PPE and an eye-wash station are a must. Do not overfill the cells.": "Hydrogen from battery wey dey charge fit explode, and battery acid dey burn skin and eye. Air ventilation, no fire, PPE and eye-wash station must dey. No overfill the cells.", "It is fine if the door is open.": "E dey okay if the door open.", "An open door does not mean the hydrogen has cleared. No smoking means no smoking.": "Open door no mean say the hydrogen don clear. No smoking mean no smoking.", "It is only dangerous when the batteries are full.": "E dey dangerous only when battery don full.", "Hydrogen is given off while charging, not only when full. The rule applies all the time.": "Hydrogen dey comot while e dey charge, no be only when e full. The rule dey work all the time.", "The truck at Bay 3 is loaded for Ibadan. Which is correct before it leaves?": "The truck for Bay 3 don load for Ibadan. Which one correct before e comot?", "Stack the heavy pallets at the back and as high as possible, so unloading is quick.": "Pack the heavy pallets for back and make dem high reach, so offloading go quick.", "Heavy loads high and at the back make the truck unstable and can overload the rear axle.": "Heavy load wey high and dey for back dey make truck no stand well and e fit overload the back axle.", "Load strapped, weight spread evenly and within the limit, dock leveller raised, and nobody jumps down from the dock edge.": "Strap the load, spread the weight well and no pass the limit, raise the dock leveller, and nobody go jump comot from dock edge.", "Unsecured or badly spread loads shift and overturn trucks on the road. Use the steps and never jump from the dock: falls from docks cause serious injuries.": "Load wey dem no tie or spread well dey shift and fit make truck fall for road. Use the steps and no ever jump from dock: to fall from dock dey cause serious injury.", "Straps are not needed for short trips inside Lagos.": "Strap no need for short trip inside Lagos.", "Load shifts often happen on short trips, with sudden braking and potholes. Always secure the load.": "Load dey shift well well for short trip, with sudden brake and pothole. Always tie the load well.", "The FIRE ALARM is ringing! Musa is driving FL-02 with a pallet raised high. What should he and everyone do?": "FIRE ALARM dey ring! Musa dey drive FL-02 with pallet wey e raise high. Wetin e and everybody suppose do?", "Musa drives the forklift outside quickly to save it.": "Musa go drive the forklift comot outside quick make e save am.", "Forklifts block exits and walkways. Never use them to evacuate.": "Forklift dey block exit and walkway. No ever use am take run comot.", "Finish the pick you are doing, then go.": "Finish the pick wey you dey do, then go.", "Every second counts. Stop work at once.": "Every second matter. Stop work now now.", "Musa lowers the forks to the floor, handbrake on, keys out. Everyone walks (no running) on the walkways to the assembly point.": "Musa go put the forks down for floor, on handbrake, comot keys. Everybody go waka (no run) for walkway go assembly point.", "Forks down and keys out leave the forklift safe and out of the way. Walk on the walkways to the assembly point and wait for the roll call.": "Forks down and keys out go leave forklift safe and e no go block road. Waka for walkway go assembly point and wait for roll call.", "Pallet stack too high and leaning": "Pallet wey dem stack too high and e dey lean", "Pallets stacked five high and leaning can topple onto people. Max three high, on level ground. Restack it and report it.": "Pallet wey dem stack reach five and e dey lean fit fall on top people. Maximum na three, for flat ground. Arrange am again and report am.", "Missing beam lock (rack R2, bay 6)": "Beam lock no dey (rack R2, bay 6)", "Without the beam lock (safety pin), a forklift can knock the beam out of the upright and the load falls. Keep the bay empty until it is fixed.": "If beam lock (safety pin) no dey, forklift fit knock the beam comot from upright and the load go fall. Make the bay empty until dem fix am.", "Fire exit blocked by pallets": "Pallet don block fire exit", "Fire exits must be clear at all times. In a fire, a blocked exit can trap people. Move the pallets and report it.": "Fire exit must clear every time. If fire happen, exit wey dem block fit trap people. Move the pallets and report am.", "Damaged pallet in use": "Pallet wey don spoil, dem still dey use am", "Broken boards can collapse under the load. Take damaged pallets out of use and re-pallet the goods.": "Board wey don break fit collapse under the load. Stop to use pallet wey don spoil and put the goods for new pallet.", "Fire extinguisher missing": "Fire extinguisher no dey", "An empty extinguisher point means nothing to fight a small fire with. Report it so it is replaced at once.": "Extinguisher point wey empty mean say nothing dey to fight small fire. Report am make dem replace am now now.", "Pedestrian without hi-vis in the forklift aisle": "Person wey no wear hi-vis dey inside forklift aisle", "He is standing in a forklift aisle with no hi-vis, looking at his phone. Get him onto the walkway and into a vest.": "E stand for forklift aisle without hi-vis, e dey look im phone. Carry am go walkway and give am vest.", "Wrapped pallet in a marked bay": "Pallet wey dem wrap for bay wey get line", "Two high, wrapped and inside the yellow lines. This one is fine.": "Two high, dem wrap am and e dey inside yellow lines. This one dey okay.", "Fire extinguisher in place": "Fire extinguisher dey im place", "In its bracket, sign visible, pin and seal in place, checked this month. This one is fine.": "E dey im bracket, sign dey show, pin and seal dey, dem check am this month. This one dey okay.", "Picker on the walkway in hi-vis": "Picker for walkway with hi-vis", "On the green walkway, in hi-vis and safety boots. Good practice.": "E dey for green walkway, with hi-vis and safety boots. Na good practice.", "Hazard reported: {0}": "You don report danger: {0}", "All hazards found. Excellent eyes!": "You don find all the danger. Your eye sharp well well!", "Missed hazard": "Danger wey you miss", "Before the briefing: you have found {0} of {1} hazards. Look around and click anything that looks unsafe.": "Before the briefing: you don find {0} of {1} danger. Look around and click anything wey no look safe.", "The danfo has dropped you at the gate. Follow the blue pin to the gatehouse.": "Danfo don drop you for gate. Follow the blue pin go gatehouse.", "Tip: tap the ground to walk, or press \"Walk there\". Tap anything to inspect it.": "Tip: touch ground make you waka, or press \"Waka go there\". Touch anything make you check am.", "Next: {0}. Follow the blue pin.": "Next: {0}. Follow the blue pin.", "Group session {0}": "Group session {0}", "Group session not available here. Playing solo.": "Group session no dey here. You go play alone.", "Group {0}": "Group {0}", "Sent to the group.": "E don reach the group.", "Could not send.": "E no fit send.", "FIRE ALARM! Stop work. Forklifts: forks down, keys out. Walk to the assembly point.": "FIRE ALARM! Stop work. Forklifts: forks down, comot keys. Waka go assembly point.", "Fire alarm. Stop work and walk to the assembly point.": "Fire alarm. Stop work and waka go assembly point.", "Trainer drill: walk to the assembly point.": "Trainer drill: waka go assembly point.", "Walk to the assembly point. Follow the arrows and keep to the walkways.": "Waka go assembly point. Follow the arrows and stay for walkway.", "Drill complete. Everyone is accounted for. Back to work!": "Drill don finish. Everybody dey. Go back to work!", "Roll call: everyone is out. Well done.": "Roll call: everybody don comot. Well done.", "NEPA has taken light! Stand still. Forklifts stop until the generator comes on.": "NEPA don take light! Stand one place. Forklifts go stop until generator on.", "Generator is on. Lights are back. Carry on.": "Generator don on. Light don come back. Continue.", "Spill on the west walkway! Keep away and report it. The spill team is coming.": "Something don pour for west walkway! Comot for there and report am. Spill team dey come.", "Spill cleaned up. Walkway open again.": "Dem don clean the spill. Walkway don open again.", "Heavy rain! The yard is slippery. Walk, don't run, and keep to the walkways.": "Heavy rain! Yard dey slippery. Waka, no run, and stay for walkway.", "Near miss! You walked in the forklift aisle while {0} was working. Use the walkways and crossings.": "Near miss! You waka inside forklift aisle when {0} dey work. Use walkway and crossing.", "Near miss! You were in the reversing zone behind a truck. Never stand behind a reversing vehicle.": "Near miss! You dey reversing zone for back of truck. No ever stand for back of motor wey dey reverse.", "Near miss! A truck was coming and you were on the road. Cross only at the zebra crossing.": "Near miss! Truck dey come and you dey for road. Na only for zebra crossing you go cross.", "Shift complete: you passed!": "Shift don finish: you pass!", "Not yet: replay the shift": "E never reach: play the shift again", "Well done, {0}. You are ready for the warehouse floor.": "Well done, {0}. You don ready for warehouse floor.", "You need a safety score of 70, at least 5 of 6 hazards and the muster at the assembly point.": "You need safety score of 70, at least 5 of 6 danger, and to reach assembly point.", "What to remember": "Wetin to remember", "Hazards you missed:": "Danger wey you miss:", "Sending your result…": "We dey send your result…", "Replay the shift": "Play the shift again", "Use the WhatsApp or email button to send your result to HSE.": "Use the WhatsApp or email button take send your result to HSE.", "SITE LIFE WAREHOUSE SHIFT RESULT": "SITE LIFE WAREHOUSE SHIFT RESULT", "Name: {0}": "Name: {0}", "Company: {0}": "Company: {0}", "Result: {0}": "Result: {0}", "PASS": "PASS", "NOT YET (replay needed)": "E NEVER REACH (play am again)", "Safety score: {0}": "Safety score: {0}", "Hazards found: {0}": "Danger wey you find: {0}", "Near misses: {0}": "Near miss: {0}", "Mistakes: {0}"
