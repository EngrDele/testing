<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Warehouse Shift</title><style>
/* ---------- Warehouse Shift: clean dashboard look (white rounded cards over a light isometric 3D yard) ---------- */
:root{
  --bg:#eef0fa; --card:#ffffff; --ink:#1b1f3b; --ink2:#3d4263; --muted:#7c819c; --line:#e8eaf4; --soft:#f5f6fc;
  --blue:#2a55e5; --blue2:#4a6ff0; --blueSoft:#e9eefe; --good:#16935c; --goodSoft:#e2f5ec; --warn:#b86e00; --warnSoft:#fff1d9;
  --bad:#d23a3a; --badSoft:#fde8e8; --idle:#6b7090; --idleSoft:#eef0f6;
  --sh:0 10px 30px rgba(42,52,120,.10),0 2px 6px rgba(42,52,120,.06); --r:14px;
  --brand:var(--blue); --brand-ink:#fff; --chip:var(--soft); --panel:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(14px * var(--fs,1))}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Inter var",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:1rem;line-height:1.4}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--bg);outline:none}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:600}
button:hover{border-color:#cfd4ea}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#2148cf}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);width:100%}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:middle;accent-color:var(--blue)}
.hidden{display:none !important}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--idleSoft);color:var(--idle)}
.pill.good{background:var(--goodSoft);color:var(--good)}.pill.warn{background:var(--warnSoft);color:var(--warn)}.pill.bad{background:var(--badSoft);color:var(--bad)}.pill.blue{background:var(--blueSoft);color:var(--blue)}
.bar{height:5px;border-radius:9px;background:#edf0f7;overflow:hidden;min-width:44px}.bar i{display:block;height:100%;border-radius:9px;background:#2fbf71;transition:width .4s}
.bar.warn i{background:#f0a12b}.bar.bad i{background:#e25555}.bar.blue i{background:var(--blue)}
.lbl{font-size:.74rem;color:var(--muted)}
.btnlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:600}
.btnlink.wa{background:#25D366;border-color:#1da851;color:#06290f}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);font-weight:700;color:var(--ink2)}
/* top bar */
#top{position:fixed;left:0;right:0;top:0;height:58px;z-index:6;background:rgba(255,255,255,.96);display:flex;align-items:center;gap:14px;padding:0 18px;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(42,52,120,.05)}
#top .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;white-space:nowrap;letter-spacing:-.01em}
#top .logo .lg{width:30px;height:30px;border-radius:9px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:#fff}
#top .logo small{font-weight:600;color:var(--muted);font-size:.9rem}
#search{flex:1 1 280px;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:.86rem;background:#fff;white-space:nowrap;overflow:hidden}
#search span{overflow:hidden;text-overflow:ellipsis}
#search kbd{margin-left:auto;font:inherit;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 6px}
#top .sp{flex:1}
#site{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:5px 10px 5px 6px;white-space:nowrap}
#site .chipb{background:var(--blue);color:#fff;font-weight:700;font-size:.7rem;border-radius:7px;padding:4px 6px}
#site b{font-size:.84rem;display:block;line-height:1.15}#site small{font-size:.72rem;color:var(--muted)}
#clock{display:flex;align-items:center;gap:6px;background:var(--goodSoft);color:var(--good);font-weight:700;font-size:.82rem;border-radius:999px;padding:5px 10px;white-space:nowrap}
#clock i{width:7px;height:7px;border-radius:50%;background:#22b46c;display:inline-block;box-shadow:0 0 0 3px rgba(34,180,108,.18)}
.ibtn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--ink2);border-radius:10px}
.ibtn:hover{background:var(--soft)}
#me{display:flex;align-items:center;gap:9px;white-space:nowrap}
#me .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb35c,#f0782d);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.82rem}
#me b{display:block;font-size:.86rem;line-height:1.15;max-width:150px;overflow:hidden;text-overflow:ellipsis}#me small{font-size:.74rem;color:var(--muted)}
/* KPI tiles */
#kpis{position:fixed;left:18px;top:72px;z-index:5;display:flex;gap:12px}
.kpi{display:flex;gap:11px;align-items:center;padding:11px 16px 11px 12px;min-width:176px}
.kpi .ki{width:38px;height:38px;border-radius:11px;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.kpi .kt{font-size:.76rem;color:var(--ink2);font-weight:600}
.kpi .kv{font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:baseline;gap:6px}
.kpi .kv small{font-size:.74rem;font-weight:700}
.kpi .ks{font-size:.7rem;color:var(--muted)}
.up{color:var(--good)}.dn{color:var(--bad)}
/* zoom */
#zoom{position:fixed;top:72px;right:352px;z-index:5;display:flex;flex-direction:column;padding:4px;gap:2px}
#zoom button{width:34px;height:34px;padding:0;border:none;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;border-radius:9px}
#zoom button:hover{background:var(--soft)}
#zoom hr{border:none;border-top:1px solid var(--line);margin:2px 4px}
/* inspect panel */
#panel{position:fixed;top:72px;right:18px;width:320px;z-index:6;max-height:calc(100vh - 330px);overflow:auto;padding:14px 16px 14px}
#panel .ph{display:flex;gap:10px;align-items:flex-start}
#panel .pic{width:44px;height:44px;border-radius:12px;background:var(--blueSoft);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
#panel .kind{font-size:.7rem;font-weight:700;color:var(--blue);letter-spacing:.04em;text-transform:uppercase}
#panel h3{margin:0;font-size:1.15rem;letter-spacing:-.01em}
#panel .sub{font-size:.78rem;color:var(--muted)}
#panel .acts{margin-left:auto;display:flex;gap:2px}
#panel .st{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:.8rem;color:var(--ink2)}
#panel .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:.84rem;border-bottom:1px solid #f1f2f8}
#panel .kv span:first-child{color:var(--muted)}#panel .kv span:last-child{font-weight:600;text-align:right}
#panel .kv.badv span:last-child{color:var(--bad)}
.check{margin-top:12px;padding:11px 12px;border-radius:12px;background:var(--soft)}
.check b{font-size:.84rem}
.check .row{margin-top:8px}.check button{flex:1;padding:8px 10px;font-size:.84rem}
.check .done{font-size:.84rem;margin-top:6px}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.chk{display:grid;gap:6px;margin-top:10px}
.chk button{display:flex;align-items:center;gap:8px;text-align:left;font-weight:600;font-size:.84rem;padding:8px 10px}
.chk button .r{margin-left:auto}
.chk button.ok{border-color:#bfe8d3;background:#f3fbf7}.chk button.ng{border-color:#f5c2c2;background:#fff5f5}
.fl-opts{display:grid;gap:6px;margin-top:10px}.fl-opts button{text-align:left;font-size:.86rem}
/* bottom: shift tracker + lists */
#dock{position:fixed;left:18px;right:18px;bottom:16px;z-index:5;display:flex;gap:16px;align-items:flex-end;pointer-events:none}
#dock>*{pointer-events:auto}
#tracker{flex:0 1 790px;padding:13px 16px 12px;display:flex;gap:14px;min-width:0}
#tracker .tl{flex:1;min-width:0}
.th{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.th .ti{color:var(--blue);display:flex}
.th .rt{margin-left:auto;font-weight:500;font-size:.74rem;color:var(--muted);white-space:nowrap}
#steps{display:flex;margin-top:12px;position:relative}
.stp{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:pointer;background:none;border:none;padding:0;border-radius:0;font-weight:500}
.stp::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:3px;background:#e3e6f1;z-index:0}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:var(--blue)}
.stp .dot{width:32px;height:32px;border-radius:50%;background:#eef0f7;color:#9aa0bb;display:flex;align-items:center;justify-content:center;z-index:1;position:relative;border:3px solid #fff;box-shadow:0 0 0 1px #e3e6f1}
.stp.done .dot{background:var(--blue);color:#fff;box-shadow:0 0 0 1px var(--blue)}
.stp.cur .dot{background:var(--blue);color:#fff;box-shadow:0 0 0 4px rgba(42,85,229,.22)}
.stp .dot .ico{width:15px;height:15px}
.stp b{font-size:.72rem;font-weight:600;margin-top:6px;line-height:1.15;color:var(--ink2);padding:0 2px}
.stp small{font-size:.66rem;color:var(--muted)}
.stp.cur b{color:var(--blue)}
#next{flex:0 0 220px;border-radius:12px;background:var(--soft);padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
#next .nk{font-size:.7rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
#next b{font-size:.92rem}
#next p{margin:0;font-size:.76rem;color:var(--muted);line-height:1.3}
#next .row{margin-top:auto;padding-top:6px}
#goBtn{padding:7px 12px;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
#lists{flex:0 0 420px;margin-left:auto;padding:10px 12px 8px;min-width:0}
#tabs{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:6px;border-bottom:1px solid var(--line)}
#tabs::-webkit-scrollbar{display:none}
#tabs button{border:none;background:transparent;padding:6px 8px;font-size:.82rem;font-weight:600;color:var(--muted);white-space:nowrap;border-radius:8px}
#tabs button small{color:#aab0c8;margin-left:3px;font-weight:600}
#tabs button.on{color:var(--ink);background:var(--soft)}
#tabs .tico{color:var(--blue);display:flex;padding:0 4px}
#tabs .tsh{display:none}
#list{max-height:170px;overflow:auto}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #f2f3f9;cursor:pointer;font-size:.8rem}
.li:last-child{border-bottom:none}
.li:hover{background:#fafbff}
.li .id{width:68px;flex:none}.li .id b{display:block;font-size:.8rem}.li .id small{font-size:.66rem;color:var(--muted)}
.li .ds{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.li .pg{width:54px;flex:none;display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:.66rem;color:var(--muted)}
.li .pg .bar{width:54px}
.li .cv{color:#b5bad0;display:flex}
.li.q .ds{color:var(--muted)}
.hint{font-size:.74rem;color:var(--muted);padding:6px 2px 2px}
#sheetH{display:none}
/* floating tags over the 3D */
#tags{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;align-items:center;gap:5px;background:#fff;border-radius:7px;padding:2px 7px 2px 3px;font-size:.7rem;font-weight:700;box-shadow:0 3px 10px rgba(42,52,120,.16);white-space:nowrap;color:var(--ink)}
.tag b{background:var(--blue);color:#fff;border-radius:5px;padding:1px 5px;font-size:.66rem}
.tag span{color:var(--muted);font-weight:600}
.tag.me b{background:#f0782d}.tag.pin{background:var(--blue);color:#fff;padding:3px 9px}.tag.pin span{color:#dfe6ff}
.tag.sel{box-shadow:0 0 0 2px var(--blue),0 3px 10px rgba(42,52,120,.16)}
.tag.alarm{background:var(--bad);color:#fff}.tag.alarm span{color:#ffe0e0}
/* toasts + captions */
#toast{position:fixed;left:18px;top:166px;z-index:9;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;width:min(92vw,420px)}
.tst{background:#fff;border-radius:11px;padding:9px 14px;font-size:.86rem;box-shadow:var(--sh);border-left:4px solid var(--blue);animation:tin .25s ease-out}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:#f0a12b}.tst.good{border-left-color:#22b46c}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#slCaption{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);z-index:9;max-width:min(92vw,620px);background:rgba(27,31,59,.86);color:#fff;padding:8px 14px;border-radius:10px;font-size:.92rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#slCaption.on{opacity:1}
/* modal cards (question, start, end, settings) */
.ov{position:fixed;inset:0;z-index:10;background:rgba(232,235,248,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px 22px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(42,52,120,.22),0 2px 8px rgba(42,52,120,.08)}
.modal h1{margin:.1em 0 .2em;font-size:1.5rem;letter-spacing:-.02em}
.modal h2{margin:.1em 0 .5em;font-size:1.15rem}
.modal p{margin:.5em 0}
.modal label{cursor:pointer}
.qchip{display:inline-flex;gap:6px;align-items:center;font-size:.7rem;font-weight:700;color:var(--blue);background:var(--blueSoft);border-radius:999px;padding:4px 10px;letter-spacing:.03em;text-transform:uppercase}
.who{display:flex;gap:10px;align-items:center;margin:12px 0 4px}
.who .av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.84rem;flex:none}
.who b{display:block;font-size:.9rem}.who small{color:var(--muted);font-size:.76rem}
.qt{font-size:1.06rem;font-weight:600;line-height:1.4;margin:10px 0 4px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left;display:flex;gap:10px;align-items:flex-start;font-weight:500;padding:11px 12px;border-radius:12px;line-height:1.35}
.opts button .k{width:24px;height:24px;border-radius:7px;background:var(--soft);color:var(--ink2);font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex:none}
.opts button:hover:not(:disabled){border-color:var(--blue);background:#f8faff}
.opts button.ok{border-color:#9bd9b8;background:#f1fbf5;opacity:1}.opts button.ok .k{background:#22b46c;color:#fff}
.opts button.no{border-color:#f2b3b3;background:#fff6f6;opacity:1}.opts button.no .k{background:var(--bad);color:#fff}
.fb{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--goodSoft);font-size:.9rem;color:#0f5b3a}
.fb.bad{background:var(--badSoft);color:#7d1f1f}
.fb b{display:block;margin-bottom:2px}
.fb .also{display:block;margin-top:6px;color:var(--ink2)}
.mend{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.consent{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:.86rem}
.consent label{display:flex;gap:8px;align-items:flex-start}.consent input{margin-top:3px}
.consent details{margin-top:6px}.consent summary{cursor:pointer;color:var(--muted)}
.modal select{margin-top:4px}
/* start screen */
.start{width:min(560px,100%)}
.hero{display:flex;gap:12px;align-items:center}
.hero .lg{width:46px;height:46px;border-radius:13px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.hero h1{margin:0}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.feat div{background:var(--soft);border-radius:12px;padding:10px;font-size:.78rem;color:var(--ink2)}
.feat b{display:block;color:var(--ink);font-size:.86rem;margin:4px 0 1px}
.feat .ico{color:var(--blue)}
.fld{margin-top:10px}.fld>span{display:block;font-size:.8rem;font-weight:600;color:var(--ink2);margin-bottom:4px}.fld>span small{font-weight:500;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.games{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.gcard{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2);text-decoration:none;font-size:.76rem;font-weight:600;white-space:nowrap}
.gcard.on{border-color:var(--blue);color:var(--blue);background:var(--blueSoft)}
.gcard small{display:none}
.keys{font-size:.76rem;color:var(--muted);margin-top:10px}
/* end screen */
.endc{width:min(600px,100%)}
.endh{display:flex;gap:14px;align-items:center}
.endh .big{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.endh .big.pass{background:var(--goodSoft);color:var(--good)}.endh .big.fail{background:var(--warnSoft);color:var(--warn)}
.endk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.endk div{background:var(--soft);border-radius:12px;padding:10px 12px}.endk b{display:block;font-size:1.3rem;letter-spacing:-.02em}.endk span{font-size:.72rem;color:var(--muted)}
.learn{margin:6px 0 0;padding:0;list-style:none}
.learn li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f1f2f8;font-size:.86rem}
.learn li .ico{color:var(--blue);margin-top:1px}
.share{margin-top:12px;padding:12px;border-radius:12px;background:var(--soft)}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(220,40,40,.42);animation:pl .9s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 6px rgba(220,40,40,.18)}}
.nepa{position:fixed;inset:0;z-index:3;pointer-events:none;background:rgba(20,24,50,.18);transition:opacity .4s}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}.tst{animation:none}}
/* ---------- phone: cards collapse into a bottom sheet ---------- */
@media (max-width:760px){
  #top{height:52px;padding:0 10px;gap:8px}
  #search,#site,#me div,#top .logo small{display:none}
  #top .logo{font-size:.98rem}
  #clock{padding:4px 8px;font-size:.76rem}
  #kpis{left:10px;right:10px;top:60px;gap:6px}
  .kpi{flex:1;min-width:0;padding:7px 8px;gap:7px}
  .kpi .ki{width:28px;height:28px;border-radius:9px}.kpi .ki .ico{width:15px;height:15px}
  .kpi .kt{font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .kv{font-size:1.08rem}.kpi .ks{display:none}
  #zoom{right:10px;top:124px;padding:2px}
  #zoom button{width:32px;height:32px}
  #dock{left:0;right:0;bottom:0;flex-direction:column;gap:0;align-items:stretch;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(42,52,120,.12);padding-bottom:env(safe-area-inset-bottom)}
  #dock .card{box-shadow:none;border-radius:0;background:transparent}
  #sheetH{display:block;width:40px;height:5px;border-radius:9px;background:#d9dcea;margin:7px auto 0;border:none;padding:0}
  #tracker{flex:none;padding:6px 14px 4px;flex-direction:column;gap:8px}
  #tracker .th .rt{display:none}
  #steps{margin-top:8px}
  .stp b,.stp small{display:none}
