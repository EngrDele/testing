  // guide visuals
  const gd=S.guide, gOn=guideOn && gd && gd.path && gd.target && !S.over;
  if(gOn){ const pth=gd.path; let n=0, acc=0, nextAt=40; const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), sc=new THREE.Vector3(), ps=new THREE.Vector3(), up=new THREE.Vector3(0,1,0);
    for(let i=1;i<pth.length && n<60;i++){ const [x0,y0]=pth[i-1],[x1,y1]=pth[i]; const L=dist(x0,y0,x1,y1); while(acc+L>=nextAt && n<60){ const f=(nextAt-acc)/L; const x=x0+(x1-x0)*f, y=y0+(y1-y0)*f; const a=Math.atan2(-(x1-x0),-(y1-y0));
        const pulse=.75+.35*Math.max(0,Math.sin(t*6-n*.5)); q.setFromAxisAngle(up,a); ps.set(X(x),.04,Z(y)); sc.set(pulse,1,pulse); m4.compose(ps,q,sc); G.arrows.setMatrixAt(n++,m4); nextAt+=36; } acc+=L; }
    G.arrows.count=n; G.arrows.instanceMatrix.needsUpdate=true; G.beam.visible=false;
  } else { G.arrows.count=0; G.beam.visible=false; }
  G.escort.visible=!!(guideOn && gd && gd.esc && started);
  if(G.escort.visible){ const e=gd.esc; G.escort.position.set(X(e.x),0,Z(e.y)); G.escort.rotation.y=e.face; animHuman(G.escort,e.step,e.moving,t); }
  SLRoom.render(scene,t);
  G.renderer.render(scene,camera);
}
function renderIntro(t){
  const {camera}=G; const a=t*0.05; const cxp=X(W/2), czp=Z(H/2);
  camera.position.set(cxp+Math.sin(a)*52, 24, czp+Math.cos(a)*44); camera.lookAt(cxp,0,czp);
  G.sun.position.set(cxp+30,60,czp+20); G.sun.target.position.set(cxp,0,czp);
  G.player.visible=false; G.npcs.forEach(({g},i)=>animHuman(g,0,false,t+i));
  G.renderer.render(G.scene,camera);
}

function drawHUD(){
  $('bars').innerHTML = BARS.map(b=>{const v=S.bars[b.k]; return `<div class="b ${v<5?'low':''}" title="${b.l}">${b.n} ${Math.ceil(v)}<div class="t"><div class="f" style="width:${v*10}%"></div></div></div>`}).join('');
  const mins = 8*60 + Math.floor(S.t); const hh=String(Math.floor(mins/60)%24).padStart(2,'0'), mm=String(mins%60).padStart(2,'0');
  $('info').innerHTML = `<span>🕗 ${hh}:${mm}</span>${SLRoom.backend?`<span>👥 ${SLRoom.players.length+1}</span>`:''}${S.oga?`<span>🧔🏾 ${S.oga.log.filter(l=>l.ok).length}/${SITE.oga.incidents.length}</span><span>⚠️ ${S.oga.active.length}</span>`:`<span>✅ ${Object.keys(S.results).length}/${ZONES.length}</span><span>🔎 ${S.hazFound}/${S.hazTotal}</span>`}${PPE_ITEMS.filter(i=>!i.bad&&S.p.ppe[i.k]).map(i=>i.e).join('')?'<span>PPE: '+PPE_ITEMS.filter(i=>!i.bad&&S.p.ppe[i.k]).map(i=>i.e).join(' ')+'</span>':''}`;
  const m=$('mini'), c=m.getContext('2d'), sx=m.width/W, sy=m.height/H;
  c.fillStyle='#cfcabd'; c.fillRect(0,0,m.width,m.height);
  c.fillStyle='#5d5e61'; c.fillRect(LANE.x1*sx,LANE.y1*sy,(LANE.x2-LANE.x1)*sx,(LANE.y2-LANE.y1)*sy); c.fillRect(80*sx,60*sy,160*sx,(FENCE.b-60)*sy);
  BUILD.forEach(b=>{c.fillStyle=b.c; c.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);});
  c.fillStyle='#27ae60'; c.beginPath(); c.arc(MUSTER.x*sx,MUSTER.y*sy,4,0,7); c.fill();
  ZONES.forEach(z=>{ if(!z.r||(z.id in S.results)) return; c.fillStyle='#e0b800'; c.fillRect(z.x*sx-2,z.y*sy-2,4,4); });
  if(S.oga){ c.fillStyle='#e74c3c'; S.oga.active.forEach(a=>{ c.beginPath(); c.arc(a.inc.x*sx,a.inc.y*sy,4+Math.sin(S.t*6),0,7); c.fill(); }); }
  if(S.guide&&S.guide.path&&guideOn){ c.strokeStyle='#0f7a4f'; c.lineWidth=2; c.setLineDash([3,2]); c.beginPath(); S.guide.path.forEach(([x,y],i)=>i?c.lineTo(x*sx,y*sy):c.moveTo(x*sx,y*sy)); c.stroke(); c.setLineDash([]); const T=S.guide.target; if(T){ c.fillStyle='#0f7a4f'; c.beginPath(); c.arc(T.x*sx,T.y*sy,4,0,7); c.fill(); } }
  const gp=$('guidePanel'), T=S.guide&&S.guide.target; if(guideOn&&T&&S.guide.path&&started&&!S.over&&$('prompt').classList.contains('hidden')){ gp.classList.remove('hidden'); const pth=S.guide.path, nx=pth[Math.min(3,pth.length-1)]; const dx=nx[0]-S.p.x, dy=nx[1]-S.p.y, fx=-Math.sin(yaw), fy=-Math.cos(yaw); const ang=Math.atan2(fx*dy-fy*dx, fx*dx+fy*dy); $('gArrow').style.transform=`rotate(${ang}rad)`; $('gText').textContent=`Next: ${T.name} · ${Math.max(1,Math.round(pathLen(pth)*K))} m`; } else gp.classList.add('hidden');
  const px=S.p.x*sx, py=S.p.y*sy; c.fillStyle='#e00'; c.beginPath(); c.moveTo(px-Math.sin(yaw)*7,py-Math.cos(yaw)*7); c.lineTo(px+Math.cos(yaw)*3.5,py-Math.sin(yaw)*3.5); c.lineTo(px-Math.cos(yaw)*3.5,py+Math.sin(yaw)*3.5); c.fill();
}

// ================== LOOP ==================
let last=performance.now(), hudT=0, started=false;
function loop(now){ if(!XR.active) tick(now); requestAnimationFrame(loop); }
function tick(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G && S){
    if(!started) renderIntro(now/1000);
    else { if(!paused) SL.fps.tick(dt); if(!paused && !S.over) update(dt); render3D(dt); hudT+=dt; if(hudT>0.12){hudT=0; drawHUD();} }
  }
}

// ================== INPUT ==================
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(paused) return;
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doAct(); }
  if(e.code==='KeyV') toggleCam();
  if(e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
const cv=$('game');
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); if(paused||!started) return;
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType!=='mouse' && e.clientX < innerWidth*0.5 && !joy){
    joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};
    const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform='';
  } else if(!look) look={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(joy && e.pointerId===joy.id){ let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const l=Math.hypot(dx,dy), m=50; if(l>m){dx=dx/l*m; dy=dy/l*m;}
    joy.dx=dx/m; joy.dy=dy/m; $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`; }
  else if(look && e.pointerId===look.id){ yaw -= (e.clientX-look.x)*0.006; pitch = clamp(pitch+(e.clientY-look.y)*0.004,-0.35,1.0); look.x=e.clientX; look.y=e.clientY; }
});
const endPtr=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; $('joy').classList.add('hidden'); } if(look&&e.pointerId===look.id) look=null; };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function toggleCam(){ firstPerson=!firstPerson; toast(firstPerson?'👁️ First-person view: you are seeing through your own eyes.':'🎥 Third-person view'); }
$('act').onclick=doAct;
$('phoneBtn').onclick=()=>{ if(!paused) openPhone(); };
$('camBtn').onclick=()=>{ if(!paused) toggleCam(); };
$('guideBtn').onclick=()=>{ guideOn=!guideOn; guidePick=null; $('guideBtn').textContent='🧭 Guide: '+(guideOn?'ON':'OFF'); toast(guideOn?'🧭 Your HSE escort will lead you to the next task.':'Guide off. Explore on your own. Use 📱 Tasks if you get lost.'); };
$('autoBtn').onclick=()=>{ autoQ=!autoQ; $('autoBtn').textContent='⚡ Auto: '+(autoQ?'ON':'OFF'); toast(autoQ?'⚡ Questions now pop up automatically when you reach a place.':'Auto off. Press the green button to talk.'); };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };
$('setBtn').onclick=()=>{ if(!paused) openSettings(); };
$('roomBtn').onclick=()=>{ if(!paused) openTrainer(); };
function openSettings(after){ SL.openSettings(openModal, ()=>{ closeModal(); after&&after(); }, k=>{ if(k==='lang'){ const u=new URL(location.href); if(u.searchParams.has('lang')){ u.searchParams.set('lang',SL.lang); location.href=u.href; } else location.reload(); } if(k==='quality') applyQuality(); if(k==='cb') applyMarkerColor(); }); }

// ================== START ==================
// ---------- group session (src/room.js) ----------
async function startRoom(code){
  SLRoom.stop(); if(!SLRoom.setCode(code)) return;
  const ok=await SLRoom.start({name:profile.name, game:GAME_ID, state:()=>({x:S.p.x, y:S.p.y, yaw:S.p.face, zone:(S.guide&&S.guide.target&&S.guide.target.name)||'', score:Object.values(S.results).filter(v=>v===true).length}), onEvent:roomEvent});
  toast(ok?`👥 Group session ${SLRoom.code}: you can see the other players.`:'👥 Group sessions need the results server or the claude.ai link. Playing solo.', ok?'':'warn');
  $('roomBtn').classList.toggle('hidden', !(ok && SLRoom.isTrainer));
}
function roomEvent(type){
  if(!S||S.over) return;
  toast('🎓 Trainer: '+tr(SLRoom.eventName(type)),'warn');
  if(type==='fire_alarm' && !S.alarm) startAlarm();
  if(type==='nepa'||type==='rain') fireEvent(type);
  if(type==='spill'){ const sp=SC.spill||(SITE.courses&&SITE.courses.advanced&&SITE.courses.advanced.scenarios.spill); if(sp){ const go=()=>{ if(paused) return setTimeout(go,1000); scenario(sp,'Chemical spill (trainer)'); }; go(); } }
  if(type==='end') endGame();
}
function openTrainer(){
  const m=openModal(`<h2>🎓 Trainer · group ${esc(SLRoom.code)}</h2><p class="muted">Set off an event for everyone in this group.</p>
    <div class="opts">${SLRoom.EVENTS.map(e=>`<button data-ev="${e}">${esc(SLRoom.eventName(e))}</button>`).join('')}</div>
    <h2 style="margin-top:12px">Players (${SLRoom.players.length})</h2><ul class="tasks">${SLRoom.players.map(p=>`<li><span>${p.role==='trainer'?'🎓':'👷🏾'}</span><span style="flex:1">${esc(p.name)}</span><span class="muted">${esc(p.zone)} · ✅ ${p.score}</span></li>`).join('')||'<li class="muted">Nobody else yet. Share the link with the group code.</li>'}</ul>
    <button class="primary" id="cl">Close</button>`);
  m.querySelectorAll('[data-ev]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const ok=await SLRoom.trigger(b.dataset.ev); toast(ok?'✅ Sent to everyone':'⚠️ Could not send the event', ok?'':'bad'); closeModal(); });
  m.querySelector('#cl').onclick=closeModal;
}
function setHud(on){ ['hud','act','phoneBtn','camBtn','autoBtn','guideBtn','muteBtn','setBtn','hint'].forEach(id=>$(id).classList.toggle('hidden',!on)); if(!on) $('roomBtn').classList.add('hidden'); if(!on){$('guidePanel').classList.add('hidden');$('prompt').classList.add('hidden');$('timer').classList.add('hidden');$('alarmv').classList.add('hidden');} }
function showStart(){
  setHud(false); started=false; profile.role=null; newGame(); paused=true;
  const m=openModal(`<p class="muted" style="margin:0 0 6px;font-weight:700">Choose a game</p><div class="games"><a class="gcard ${GAME_ID==='factory'?'on':''}" href="index.html"><span class="gi">🏭</span><b>Factory Site Induction</b><small>Workers & visitors</small></a><a class="gcard ${GAME_ID==='factory-advanced'?'on':''}" href="index.html?course=advanced"><span class="gi">🧗🏾</span><b>Advanced Site Course</b><small>Height, confined space, hot work…</small></a><a class="gcard ${GAME_ID==='oga'?'on':''}" href="index.html?mode=oga"><span class="gi">🧔🏾</span><b>Oga Mode</b><small>Supervisors</small></a><a class="gcard" href="kids.html?world=home"><span class="gi">🏠🚌</span><b>Home → School Bus</b><small>Kids 6–12</small></a><a class="gcard" href="kids.html?world=school"><span class="gi">🏫</span><b>School Safety</b><small>Kids 6–12</small></a><a class="gcard" href="kids.html?world=market"><span class="gi">🛒</span><b>Market & Road Trip</b><small>Kids 6–12</small></a><a class="gcard" href="kids.html?world=water"><span class="gi">🏖️</span><b>Beach & Pool</b><small>Kids 6–12</small></a><a class="gcard" href="kids.html?world=online"><span class="gi">📱</span><b>Online Safety</b><small>Kids 8–14</small></a></div><h1 style="margin:.1em 0">🦺 Site Life 3D</h1>
    ${MODE==='oga'?`<div class="fb"><b>🧔🏾 Oga Mode.</b> You are the supervisor today. Workers will start doing unsafe things around the compound. Get there fast and stop them. Stop at least ${SITE.oga.pass} of ${SITE.oga.incidents.length} to pass.</div>`:COURSE?`<div class="fb"><b>🧗🏾 ${esc(COURSE.title)}.</b> ${esc(COURSE.about)}</div>`:''}
    <p class="muted">The safety induction you <b>play</b>, not a paper you tick. Walk the compound, make the right calls, spot the hazards, and survive your first shift.<br>${SITE._custom?'Site':'Demo site'}: <i>${esc(SITE.name||'')}</i>.</p>
    <p><b>Your name</b></p><input id="nm" placeholder="e.g. Tunde Bakare" maxlength="40" value="${esc(profile.name || SL.lms.studentName())}">
    <p><b>Company</b> <span class="muted">(optional)</span></p><input id="co" placeholder="e.g. ABC Contractors Ltd" maxlength="60" value="${esc(profile.company)}">
    <p><b>Your character</b></p>
    <div class="row" id="sex"><button data-x="m" class="${profile.sex==='m'?'primary':''}">👨🏾 Man</button><button data-x="f" class="${profile.sex==='f'?'primary':''}">👩🏾 Woman</button></div>
    <p class="muted" style="margin:.6em 0 .3em">Shirt colour and skin tone</p>
    <div class="row">${SHIRTS.map(c=>`<button class="sw ${c===profile.shirt?'on':''}" data-c="${c}" style="background:${c}" aria-label="shirt colour"></button>`).join('')}</div>
    <div class="row" style="margin-top:6px">${SKINS.map(c=>`<button class="sw ${c===profile.skin?'on':''}" data-s="${c}" style="background:${c}" aria-label="skin tone"></button>`).join('')}</div>
    ${MODE==='oga'?`<p><b>Your role</b></p><div class="big" id="rolebox">🧔🏾 Supervisor (Oga)</div><p class="muted" id="roletask"></p>`:`<p><b>Role lottery 🎲</b> <span class="muted">Like Lagos Life's birth lottery, you don't choose.</span></p>
    <div class="big" id="rolebox">🎲 ?</div><p class="muted" id="roletask"></p>`}
    <p><b>Group code</b> <span class="muted">(optional: play together with a trainer)</span></p><input id="room" placeholder="e.g. ACME7" maxlength="8" value="${esc(SLRoom.code||'')}" style="text-transform:uppercase">
    ${SL.consent.html(false)}
    <div class="row" id="startRow" style="margin-top:10px"><button id="spin">Spin role</button><button class="primary" id="start" disabled>Start shift ▶</button><button id="stSet">⚙️ Language &amp; settings</button></div>
    <p class="muted" style="font-size:.85rem;margin-top:12px">🎮 <b>Computer:</b> WASD to walk, drag the mouse to look, E to interact, V to switch first/third person.<br>📱 <b>Phone:</b> drag the left side of the screen to walk, drag the right side to look, and tap the green button to interact.</p>`);
  showDashButton(m.querySelector('#startRow'));
  SL.consent.bind(m, null);
  m.querySelectorAll('.gcard[href]').forEach(a=>{ const u=new URL(a.getAttribute('href'),location.href); for(const [k,v] of SL.QS) if(!['course','mode','world'].includes(k)) u.searchParams.set(k,v); a.href=u.href; });
  if(MODE==='oga'){ profile.role={id:'supervisor',name:'Supervisor (Oga)',icon:'🧔🏾',task:SITE.oga.about}; m.querySelector('#spin').classList.add('hidden'); m.querySelector('#start').disabled=false; }
  m.querySelector('#stSet').onclick=()=>openSettings(showStart);
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{profile.sex=b.dataset.x; m.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('primary',x===b));});
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{profile.shirt=b.dataset.c; m.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{profile.skin=b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelector('#spin').onclick=()=>{
    ensureAudio(); m.querySelector('#spin').disabled=true; let n=0;
    const t=setInterval(()=>{ profile.role=ROLES[Math.floor(Math.random()*ROLES.length)]; m.querySelector('#rolebox').textContent=`${profile.role.icon} ${profile.role.name}`; beep(500+n*40,.05,'square',.03);
      if(++n>12){ clearInterval(t); m.querySelector('#roletask').textContent='📱 Task: '+profile.role.task; m.querySelector('#start').disabled=false; m.querySelector('#spin').disabled=false; chime(); } },90);
  };
  m.querySelector('#start').onclick=()=>{
    if(!SL.consent.ok()){ const c=m.querySelector('.consent'); c.style.outline='3px solid var(--bad)'; c.scrollIntoView({block:'center'}); toast(tr('Please tick the privacy notice box to start.'),'bad'); return; }
    profile.name=(m.querySelector('#nm').value.trim()||'Guest').slice(0,40); profile.company=m.querySelector('#co').value.trim().slice(0,60);
    G.resetDynamic(); started=true; closeModal(); setHud(true); startRoom(m.querySelector('#room').value);
    if(MODE==='oga'){ toast('🧔🏾 You are the supervisor today. Watch for the red ⚠ STOP signs and get there fast.'); return; }
    toast('🛵 The okada has dropped you at the Main Gate. Your HSE Escort will show you round. Follow the arrows.');
    setTimeout(()=>toast('📱 Tap "Tasks" to see what to do. Follow the yellow ! markers.'),2600);
  };
}

window.addEventListener('load',()=>{
  if(!window.THREE){ $('loading').innerHTML='Could not load the 3D engine. Check your internet connection, or play the <a href="lite.html">2D version</a>.'; return; }
  try{ newGame(); initThree(); }catch(err){ $('loading').innerHTML='Your device could not start 3D. Try the <a href="lite.html">2D version</a>.'; console.error(err); return; }
  $('loading').remove();
  showStart();
  // VR headsets (WebXR): teleport by pointing; questions appear as panels (src/engine.js XR)
  XR.setup(G.renderer, G.scene, G.camera, { frame: tick, getPlayer: () => S.p, getYaw: () => yaw,
    onTeleport: (x, y) => { if (!started || paused || S.over || x < 0 || y < 0 || x > W || y > H || blocked(x, y, 12, solids())) return;
      S.p.x = x; S.p.y = y; setTimeout(() => { if (XR.active && S.near && !paused) doAct(); }, 400); } });
  requestAnimationFrame(loop);
});
