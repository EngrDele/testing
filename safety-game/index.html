<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Site Life 3D</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d1f22; --muted:#5d636b; --line:#ddd8cc;
  --brand:#0f7a4f; --brand-ink:#ffffff; --warn:#b26b00; --bad:#c0392b; --good:#1e8e3e; --chip:#f0ede5;
  --hud:rgba(255,255,255,.86);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
    --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
    --hud:rgba(25,27,30,.84);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
  --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
  --hud:rgba(25,27,30,.84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#9cc3e6}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
.hidden{display:none !important}
.muted{color:var(--muted)}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.hbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);pointer-events:auto}
#bars{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;font-size:12px;align-items:center}
.b{min-width:58px}.b .t{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}.b .f{height:100%;background:var(--good)}
.b.low .f{background:var(--bad)}
#info{font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
#mini{display:block;border-radius:8px}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.tst{background:var(--hud);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
#act{position:fixed;right:18px;bottom:22px;z-index:5;width:78px;height:78px;border-radius:50%;font-weight:800;font-size:13px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fbtn{position:fixed;z-index:5;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#phoneBtn{right:106px;bottom:30px}
#camBtn{right:106px;bottom:86px}
#autoBtn{right:106px;bottom:142px;font-size:13px}
#guideBtn{right:106px;bottom:198px;font-size:13px}
#guidePanel{position:fixed;left:50%;bottom:164px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:14px;padding:6px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#gArrow{display:inline-block;font-size:22px;color:var(--brand);transition:transform .1s linear}
@media (max-width:600px){#guidePanel{bottom:120px;font-size:13px} #prompt{bottom:166px}}
.btnlink{display:inline-block;text-decoration:none;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px;font-weight:600}
.btnlink.wa{background:#25D366;border-color:#1da851;color:#06290f}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.gcard{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);text-decoration:none;font-size:13px;line-height:1.25}
.gcard .gi{font-size:24px}
.gcard small{color:var(--muted)}
.gcard.on{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--chip))}
.ppe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ppe-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:13px}
.ppe-grid button .e{font-size:30px}
.ppe-grid button.on{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--chip))}
#muteBtn{left:12px;bottom:22px;opacity:.9}
#setBtn{left:66px;bottom:22px;opacity:.9}
#roomBtn{left:118px;bottom:22px;font-size:13px}
html{font-size:calc(15px * var(--fs,1))}
body,.modal,button,input{font-size:1rem}
input[type=checkbox]{width:auto;margin-right:6px;vertical-align:middle}
.modal label{cursor:pointer}
.consent{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-size:.9rem}
.consent label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.consent input{width:auto;margin-top:3px}
.consent details{margin-top:6px}.consent summary{cursor:pointer;color:var(--muted)}
#slCaption{position:fixed;left:50%;bottom:210px;transform:translateX(-50%);z-index:9;max-width:min(92vw,640px);background:rgba(0,0,0,.78);color:#fff;padding:8px 14px;border-radius:10px;font-size:1rem;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#slCaption.on{opacity:1}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink)}
.course{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.course button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;font-size:.85rem}.course button small{color:var(--muted)}.course button.on{border:2px solid var(--brand)}
#prompt{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#joy{position:fixed;z-index:4;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.75)}
#hint{position:fixed;left:12px;bottom:76px;z-index:5;font-size:12px;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:220px}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal h2{margin:.1em 0 .4em;font-size:1.2rem}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .av{font-size:2rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--chip)}
.fb.bad{border-left-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.85rem}
.big{font-size:1.9rem;font-weight:800}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
ul.tasks{list-style:none;padding:0;margin:8px 0}
ul.tasks li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(220,30,30,.55);animation:pl .8s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 10px rgba(220,30,30,.25)}}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}}
#timer{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--bad);color:#fff;font-weight:800;border-radius:12px;padding:6px 14px;font-size:20px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);font-weight:700}
@media (max-width:600px){
  #bars{grid-template-columns:repeat(3,auto)}
  #mini{width:104px;height:82px}
  #toast{top:150px}
  #timer{top:104px}
  .tst{font-size:13px;padding:6px 10px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="loading">Loading Site Life 3D…</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div class="hbox"><div id="bars"></div><div id="info"></div></div>
  <div class="hbox" style="padding:5px"><canvas id="mini" width="150" height="118"></canvas></div>
</div>
<div id="toast"></div>
<div id="prompt" class="hidden"></div>
<div id="joy" class="hidden"><i></i></div>

<button id="guideBtn" class="fbtn hidden">🧭 Guide: ON</button>

<button id="roomBtn" class="fbtn hidden">🎓 Trainer</button>
<div id="timer" class="hidden" data-notr></div>
<div id="alarmv" class="alarmv hidden"></div>
<div id="ovl"></div>

e a rechargeable lamp": "Faɗa wa babba ya ɗauke shi, a yi amfani da fitila mai caji", "Curtains catch fire very fast. A small flame can burn the whole house.": "Labule yana kama wuta da sauri. Ƙaramar wuta za ta iya ƙone gidan duka.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Madalla! Nisantar da wuta daga labule, ko a yi amfani da fitila mai caji.", "You see some sweet-looking tablets on the table. What should you do?": "Ka ga wasu ƙwayoyin magani masu kama da alewa a kan tebur. Me ya kamata ka yi?", "Taste one, it looks like sweets": "Ɗanɗana ɗaya, yana kama da alewa", "Do not touch. Tell an adult to keep it out of reach": "Kada ka taɓa. Faɗa wa babba ya ajiye shi inda ba za a kai ba", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Magani zai iya sa ka rashin lafiya sosai. Ka sha magani daga iyaye ko likita kawai.", "Correct! Never eat medicine on your own.": "Daidai! Kada ka taɓa shan magani da kanka.", "Daddy's generator is running close to the kitchen window. What should you do?": "Janaretan Baba yana aiki kusa da tagar kicin. Me ya kamata ka yi?", "Go and touch it to see if it is hot": "Je ka taɓa shi ka ga ko yana da zafi", "Stay away and tell Daddy it must be far from windows and doors": "Ka nisance shi ka faɗa wa Baba cewa dole ne ya yi nisa da tagogi da ƙofofi", "Generators are very hot and the smoke is poison (carbon monoxide).": "Janareta yana da zafi sosai kuma hayakinsa guba ne (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Daidai! Hayakin janareta zai iya kashewa. Dole ne ya kasance a waje, nesa da tagogi.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Murfin rijiya a buɗe yake. Ƙwallonka ta mirgina zuwa gefenta. Me za ka yi?", "Run and get the ball": "Gudu ka ɗauko ƙwallon", "Stay away and call an adult to get the ball and close the well": "Ka nisance ta ka kira babba ya ɗauko ƙwallon ya rufe rijiyar", "You could fall into the well. Always stay away from open wells.": "Za ka iya faɗawa cikin rijiya. Ko yaushe ka nisanci rijiya a buɗe.", "Correct! Never play near an open well or soakaway.": "Daidai! Kada ka yi wasa kusa da rijiya ko ramin shara a buɗe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Sannu! Mamarka ce ta aiko ni in kai ka makaranta. Zo mu tafi.\"", "Go with him, he knows Mummy": "Bi shi, ya san Mama", "Do not open the gate. Run back and tell Mummy": "Kada ka buɗe ƙofa. Gudu ka koma ka faɗa wa Mama", "Never go with someone you do not know. Strangers can say anything.": "Kada ka bi wanda ba ka sani ba. Baƙi za su iya faɗin komai.", "Excellent! Never go with a stranger. Always tell your parents.": "Madalla sosai! Kada ka bi baƙo. Ko yaushe ka faɗa wa iyayenka.", "Where should you walk on the street?": "Ina ya kamata ka yi tafiya a titi?", "In the middle of the road": "A tsakiyar titi", "On the walkway, holding an adult's hand": "A hanyar masu tafiya, kana riƙe da hannun babba", "Cars, okadas and kekes use the road. You could be hit.": "Motoci, okada da keke suna amfani da titi. Za su iya bugarka.", "Correct! Walk on the walkway and hold an adult's hand.": "Daidai! Yi tafiya a hanyar masu tafiya ka riƙe hannun babba.", "You want to cross the road. What do you do first?": "Kana so ka tsallaka titi. Me za ka fara yi?", "Run across quickly": "Gudu ka tsallaka da sauri", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Tsaya a zebra, duba hagu, dama, hagu kuma, ka jira motoci su tsaya", "Running across the road is very dangerous.": "Gudun tsallaka titi haɗari ne sosai.", "Well done! Stop, look and listen before you cross.": "Madalla! Tsaya, duba, ka saurara kafin ka tsallaka.", "The school bus is coming. Where should you stand?": "Motar makaranta tana zuwa. Ina ya kamata ka tsaya?", "At the edge of the road, ready to jump in": "A bakin titi, a shirye don tsalle ciki", "Behind the yellow line until  Nọrọ ebe dị anya n'ọkụ.", "Correct! Keep away from hot things in the kitchen.": "Ọ ziri ezi! Nọrọ ebe dị anya n'ihe dị ọkụ na kichin.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ewerela ọkụ. Nwanne gị nwoke tinyere kandụl na-enwu n'akụkụ ákwà mkpuchi windo. Gịnị ka ị ga-eme?", "Leave it, the candle is small": "Hapụ ya, kandụl ahụ dị obere", "Tell an adult to move it away and use a rechargeable lamp": "Gwa onye okenye ka o wepụ ya ma jiri oriọna a na-achaji", "Curtains catch fire very fast. A small flame can burn the whole house.": "Ákwà mkpuchi windo na-ere ọkụ ngwa ngwa. Obere ọkụ nwere ike ịgba ụlọ niile.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ọ dị mma! Debe ọkụ ebe dị anya n'ákwà mkpuchi windo, ma ọ bụ jiri oriọna a na-achaji.", "You see some sweet-looking tablets on the table. What should you do?": "Ị hụrụ ụfọdụ ọgwụ yiri swiiti n'elu tebụl. Gịnị ka i kwesịrị ime?", "Taste one, it looks like sweets": "Detụ otu ire, ọ dị ka swiiti", "Do not touch. Tell an adult to keep it out of reach": "Emetụla ya aka. Gwa onye okenye ka o debe ya ebe aka agaghị eru", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Ọgwụ nwere ike ime ka ị rịa ọrịa nke ukwuu. Were ọgwụ naanị n'aka nne, nna ma ọ bụ dọkịta.", "Correct! Never eat medicine on your own.": "Ọ ziri ezi! Aṅụla ọgwụ n'onwe gị.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jenerẹtọ Papa na-arụ ọrụ n'akụkụ windo kichin. Gịnị ka i kwesịrị ime?", "Go and touch it to see if it is hot": "Gaa metụ ya aka ka ị mara ma ọ dị ọkụ", "Stay away and tell Daddy it must be far from windows and doors": "Nọrọ ebe dị anya ma gwa Papa na ọ ga-anọ ebe dị anya na windo na ọnụ ụzọ", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jenerẹtọ na-ekpo ọkụ nke ukwuu, anwụrụ ọkụ ya bụ nsị (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ọ ziri ezi! Anwụrụ ọkụ jenerẹtọ nwere ike igbu mmadụ. Ọ ga-anọ n'èzí, ebe dị anya na windo.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Mkpuchi olulu mmiri meghere emeghe. Bọọlụ gị gbagoro n'akụkụ ya. Gịnị ka ị ga-eme?", "Run and get the ball": "Gbaa ọsọ were bọọlụ ahụ", "Stay away and call an adult to get the ball and close the well": "Nọrọ ebe dị anya ma kpọọ onye okenye ka o were bọọlụ ma mechie olulu mmiri", "You could fall into the well. Always stay away from open wells.": "Ị nwere ike ịdaba n'olulu mmiri. Na-anọ ebe dị anya n'olulu mmiri meghere emeghe mgbe niile.", "Correct! Never play near an open well or soakaway.": "Ọ ziri ezi! Egwula egwu n'akụkụ olulu mmiri ma ọ bụ olulu nsị meghere emeghe.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ndewo! Mama gị zitere m ka m kpọga gị ụlọ akwụkwọ. Soro m.\"", "Go with him, he knows Mummy": "Soro ya, ọ maara Mama", "Do not open the gate. Run back and tell Mummy": "Emeghela ọnụ ụzọ ama. Gbaghachi azụ gwa Mama", "Never go with someone you do not know. Strangers can say anything.": "Esorola onye ị na-amaghị. Ndị a na-amaghị nwere ike ikwu ihe ọ bụla.", "Excellent! Never go with a stranger. Always tell your parents.": "Ọ magburu onwe ya! Esorola onye a na-amaghị. Na-agwa nne na nna gị mgbe niile.", "Where should you walk on the street?": "Ebee ka i kwesịrị ije ije n'okporo ámá?", "In the middle of the road": "N'etiti okporo ụzọ", "On the walkway, holding an adult's hand": "N'ụzọ ndị na-eje ije, jide aka onye okenye", "Cars, okadas and kekes use the road. You could be hit.": "Ụgbọ ala, okada na keke na-eji okporo ụzọ. Ha nwere ike ịkụ gị.", "Correct! Walk on the walkway and hold an adult's hand.": "Ọ ziri ezi! Jee ije n'ụzọ ndị na-eje ije ma jide aka onye okenye.", "You want to cross the road. What do you do first?": "Ị chọrọ ịgafe okporo ụzọ. Gịnị ka ị ga-ebu ụzọ mee?", "Run across quickly": "Gbaa ọsọ gafee ngwa ngwa", "Stop at the zebra, u go?": "\"Nke a bụ ebe nzukọ ọkụ anyị.\" Ọ bụrụ na mgbịrịgba ọkụ dara, ebee ka ị ga-aga?", "Hide under my desk": "Zoo n'okpuru tebụl m", "Walk quickly to the assembly point and line up with my class": "Jee ije ọsọ ọsọ gaa ebe nzukọ ma kwụ n'ahịrị na klas m", "In a fire you must leave the building. Hiding is dangerous.": "Mgbe ọkụ na-ere, ị ga-apụ n'ụlọ. Izo ezo dị egwu.", "Correct! Remember this place.": "Ọ ziri ezi! Cheta ebe a.", "The socket near your desk is sparking and smells like burning.": "Soket dị n'akụkụ tebụl gị na-agba ọkụ, ọ na-esikwa isi ihe na-ere ọkụ.", "Pull out the plug yourself": "Wepụ plọg n'onwe gị", "Move away and tell the teacher immediately": "Pụọ ebe ahụ ma gwa onye nkuzi ozugbo", "You could get an electric shock.": "Ọkụ eletrik nwere ike ịgba gị.", "Correct! Never touch sparking sockets.": "Ọ ziri ezi! Emetụla soket na-agba ọkụ aka.", "Your classmate is leaning back on two chair legs.": "Onye klas gị na-adabere azụ n'ụkwụ oche abụọ.", "Do it too, it is fun": "Mee ya kwa, ọ na-atọ ụtọ", "Sit with all four chair legs on the floor and tell him to stop": "Nọdụ ala ka ụkwụ oche anọ niile dị n'ala ma gwa ya ka ọ kwụsị", "The chair can fall back and you can hit your head.": "Oche nwere ike ịda azụ, ị nwekwara ike ịkụ isi gị.", "Well done! Sit properly on your chair.": "I mere nke ọma! Nọdụ ala nke ọma n'oche gị.", "The break bell rings and everyone rushes out.": "Mgbịrịgba ezumike dara, onye ọ bụla na-agba ọsọ apụ.", "Push to be the first one out": "Kwaa mmadụ ka ị bụrụ onye mbụ pụọ", "Walk, keep to the right, and do not push": "Jee ije, nọrọ n'aka nri, akwala onye ọ bụla", "Pushing causes falls and injuries.": "Ịkwa mmadụ na-akpata ọdịda na mmerụ ahụ.", "Correct! Walk calmly in corridors.": "Ọ ziri ezi! Jee ije nwayọ n'okporo ụzọ ime ụlọ.", "Some big pupils are pushing a small boy and taking his snacks.": "Ụfọdụ ụmụ akwụkwọ buru ibu na-akwa otu obere nwata nwoke ma na-anapụ ya nri ya.", "Join them and laugh": "Sonye ha ma chịa ọchị", "Do not join. Go and tell a teacher at once": "Esonyela. Gaa gwa onye nkuzi ozugbo", "Bullying hurts people. Never join in.": "Mmegbu na-emerụ mmadụ. Esonyela ya.", "Brave and kind! Always tell a teacher about bullying.": "Obi ike na obi ọma! Na-agwa onye nkuzi maka mmegbu mgbe niile.", "There are bottles of coloured liquid on the bench and no teacher.": "Karama mmiri nwere agba dị n'elu bench, onye nkuzi anọghịkwa.", "Smell or taste them": "Sie ha isi ma ọ bụ detụ ha ire", "Do not touch. Wait for the teacher": "Emetụla ha aka. Chere onye nkuzi", "Chemicals can burn your skin, eyes and mouth.": "Kemịkalụ nwere ike ịgba akpụkpọ ahụ gị, anya gị na ọnụ gị ọkụ.", "Correct! Only use the lab with a teacher.": "Ọ ziri ezi! Jiri ụlọ nyocha naanị mgbe onye nkuzi nọ.", "You have used the toilet. What next?": "I jirila ụlọ mposi. Gịnị na-esote?", "Go straight back to class": "Laghachi klas ozugbo", "Wash hands with soap and water for 20 seconds": "Jiri ncha na mmiri saa aka ruo sekọnd 20", "Germs on your hands can make you and others sick.": "Nje dị n'aka gị nwere ike ime ka gị na ndị ọzọ rịa ọrịa.", "Great! Clean hands stop germs.": "Ọ dị mma! Aka dị ọcha na-egbochi nje.", "Someone spilled hot pepper soup on the floor.": "Mmadụ wụfuru ofe ose dị ọkụ n'ala.", "Jump over it and run": "Wụfee ya ma gbaa ọsọ", "Walk around it and tell the canteen staff": "Gagharịa ya ma gwa ndị ọrụ ebe nri", "You could slip and get burnt.": "Ị nwere ike ịmị amị ma ọkụ gbaa gị.", "Correct! Report spills so they can be cleaned.": "Ọ ziri ezi! Kọọ ihe wụfuru ka e hichaa ya.", "One chain on the swing is broken.": "Otu agbụ nke swing agbajiela.", "Swing anyway, very high": "Fegharịa ka o sila dị, elu nke ukwuu", "Do not use it. Tell a teacher it is broken": "Ejila ya. Gwa onye nkuzi na ọ gbajiri agbaji", "Broken swings can throw you to the ground.": "Swing gbajiri agbaji nwere ike ịtụba gị n'ala.", "Well done! Report broken play equipment.": "I mere nke ọma! Kọọ ihe egwuregwu mebiri emebi.", "You fell and cut you akes at all. 🌟": "Ó pé! Kò sí àṣìṣe rárá. 🌟", "Try again": "Tún gbìyànjú", "Send to Mummy/Daddy": "Fi ránṣẹ́ sí Màmá/Bàbá", "The school bus is coming! Wait behind the yellow line.": "Ọkọ̀ ilé-ìwé ń bọ̀! Dúró sẹ́yìn ìlà aláwọ̀ ìyeyè.", "The bus has stopped. Now you can get on.": "Ọkọ̀ ti dúró. O lè wọ̀ ọ́ báyìí.", "Off to school! Seatbelt on.": "A ń lọ sí ilé-ìwé! So bẹ́líìtì ìjókòó.", "Get off the road! Only cross at the zebra crossing.": "Kúrò lójú ọ̀nà! Ọ̀nà abilà nìkan ni kí o ti sọdá.", "Well done! You crossed at the zebra and the cars stopped.": "O ṣe dáadáa! O sọdá ní ọ̀nà abilà, àwọn mọ́tò sì dúró.", "You reached the assembly point. Your teacher counted you!": "O ti dé ibi ìpéjọ. Olùkọ́ rẹ ti kà ọ́!", "Great job! Your teacher says: \"Let us practise a fire drill soon.\"": "Iṣẹ́ takuntakun! Olùkọ́ rẹ sọ pé: \"Ẹ jẹ́ ká ṣe ìdánrawò iná láìpẹ́.\"", "Fire drill! Walk quickly to the assembly point. Do not go back for anything.": "Ìdánrawò iná! Rìn kíákíá lọ sí ibi ìpéjọ. Má ṣe padà lọ mú nǹkan kankan.", "Bedroom": "Yàrá ìsùn", "Bathroom": "Balùwẹ̀", "Kitchen": "Ilé ìdáná", "Sitting room": "Pálọ̀", "Store room": "Yàrá ìkẹ́rùsí", "Generator": "Jẹnẹrétọ̀", "Well": "Kànga", "Gate": "Ẹnu-ọ̀nà", "Walkway": "Ọ̀nà ẹlẹ́sẹ̀", "Zebra crossing": "Ọ̀nà abilà", "Cross at the zebra": "Sọdá ní ọ̀nà abilà", "Cross the road on the zebra crossing": "Sọdá títì ní ọ̀nà abilà", "Bus stop": "Ibùdókọ̀", "Bus stop (wait)": "Ibùdókọ̀ (dúró)", "Board the bus": "Wọ ọkọ̀", "School gate": "Ẹnu-ọ̀nà ilé-ìwé", "Assembly ground": "Pápá ìpéjọ", "ASSEMBLY POINT": "IBI ÌPÉJỌ", "assembly point": "ibi ìpéjọ", "Classroom 1": "Kíláàsì 1", "Classroom 2": "Kíláàsì 2", "Corridor": "Ọ̀dẹ̀dẹ̀", "Behind the block": "Lẹ́yìn ilé", "Science lab": "Yàrá ìmọ̀ sáyẹ́ǹsì", "Toilets": "Ilé ìgbọ̀nsẹ̀", "Canteen staff": "Òṣìṣẹ́ ilé oúnjẹ", "Playground": "Pápá ìṣeré", "Sick bay": "Yàrá aláìsàn", "Bus park": "Ibi ìgbọ́kọ̀sí ọkọ̀ ilé-ìwé", "Teacher": "Olùkọ́", "Mummy": "Màmá", "Daddy": "Bàbá", "Stranger": "Àjèjì", "Brother": "Ẹ̀gbọ́n/Àbúrò ọkùnrin", "Your brother": "Àbúrò rẹ ọkùnrin", "Crossing guard": "Olùtọ́jú ọ̀nà", "Gatekeeper": "Olùṣọ́ ẹnu-ọ̀nà", "Nurse": "Nọ́ọ̀sì", "School nurse": "Nọ́ọ̀sì ilé-ìwé", "Bus attendant": "Olùtọ́jú ọkọ̀", "Your bedroom": "Yàrá rẹ", "Mummy in the kitchen": "Màmá ní ilé ìdáná", "The well": "Kànga náà", "A stranger at the gate": "Àjèjì ní ẹnu-ọ̀nà", "Walking to the bus stop": "Rírìn lọ sí ibùdókọ̀", "A man in a car outside": "Ọkùnrin kan nínú mọ́tò níta", "Your classmate": "Ọmọ kíláàsì rẹ", "A younger pupil": "Akẹ́kọ̀ọ́ kékeré kan", "Your phone charger wire is cut and you can see the copper inside. What should you do?": "Wáyà ṣájà fóònù rẹ ti gé, o sì ń rí bàbà inú rẹ̀. Kí ni o yẹ kí o ṣe?", "Use it quickly, it still works": "Lò ó kíákíá, ó ṣì ń ṣiṣẹ́", "Do not touch it. Unplug nothing. Tell Mummy or Daddy": "Má fọwọ́ kàn án. Má yọ nǹkan kankan. Sọ fún Màmá tàbí Bàbá", "Broken wires can shock you or start a fire. Never touch them.": "Wáyà tó ti gé lè gbá ọ ní iná tàbí dá iná sílẹ̀. Má ṣe fọwọ́ kàn wọ́n láé.", "Correct! Always tell an adult about broken wires.": "Ó tọ̀nà! Máa sọ fún àgbàlagbà nípa wáyà tó ti gé nígbà gbogbo.", "The bathroom floor is wet and soapy. What do you do?": "Ilẹ̀ balùwẹ̀ tutù, ọṣẹ sì wà níbẹ̀. Kí ni o máa ṣe?", "Run and slide, it is fun!": "Sáré kí o sì yọ̀, ó dùn!", "Walk slowly, hold on, and dry the floor or tell an adult": "Rìn díẹ̀díẹ̀, di nǹkan mú, kí o sì nu ilẹ̀ tàbí sọ fún àgbàlagbà", "Wet floors are slippery. You can fall and hit your head.": "Ilẹ̀ tó tutù máa ń yọ̀. O lè ṣubú kí orí rẹ sì fara pa.", "Well done! Walk slowly on wet floors.": "O ṣe dáadáa! Rìn díẹ̀díẹ̀ lórí ilẹ̀ tó tutù.", "A pot of stew is boiling on the gas cooker and the handle is sticking out. What should you do?": "Ìkòkò ọbẹ̀ ń hó lórí ìdáná gáàsì, ọwọ́ rẹ̀ sì yọ síta. Kí ni o yẹ kí o ṣe?", "Grab the handle to look inside": "Di ọwọ́ ìkòkò mú láti wo inú rẹ̀", "Stay away from the cooker and tell Mummy about the handle": "Jìnnà sí ìdáná kí o sì sọ fún Màmá nípa ọwọ́ ìkòkò", "Hot pots can fall and burn you badly. Stay away from the cooker.": "Ìkòkò gbígbóná lè ṣubú kí ó sì jó ọ gidigidi. Jìnnà sí ìdáná.", "Correct! Keep away from hot things in the kitchen.": "Ó tọ̀nà! Jìnnà sí àwọn nǹkan gbígbóná ní ilé ìdáná.", "NEPA has taken light. Your brother put a lit candle next to the curtain. What do you do?": "NEPA ti mú iná lọ. Àbúrò rẹ gbé àbẹ́là tó ń jó sí ẹ̀gbẹ́ aṣọ fèrèsé. Kí ni o máa ṣe?", "Leave it, the candle is small": "Fi sílẹ̀, àbẹ́là náà kéré", "Tell an adult to move it away and use a rechargeable lamp": "Sọ fún àgbàlagbà kí ó gbé e kúrò kí ẹ sì lo àtùpà ìgbàná", "Curtains catch fire very fast. A small flame can burn the whole house.": "Aṣọ fèrèsé máa ń tètè gbiná. Iná kékeré lè jó gbogbo ilé.", "Great! Keep flames away from curtains, or use a rechargeable lamp.": "Ó dára! Jẹ́ kí iná jìnnà sí aṣọ fèrèsé, tàbí lo àtùpà ìgbàná.", "You see some sweet-looking tablets on the table. What should you do?": "O rí àwọn òògùn tó dà bí súwíìtì lórí tábìlì. Kí ni o yẹ kí o ṣe?", "Taste one, it looks like sweets": "Tọ́ ọ̀kan wò, ó dà bí súwíìtì", "Do not touch. Tell an adult to keep it out of reach": "Má fọwọ́ kàn án. Sọ fún àgbàlagbà kí ó gbé e sí ibi tí ọwọ́ kò ti lè tó o", "Medicine can make you very sick. Only take medicine from a parent or doctor.": "Òògùn lè mú ọ ṣàìsàn gidigidi. Gba òògùn lọ́wọ́ òbí tàbí dókítà nìkan.", "Correct! Never eat medicine on your own.": "Ó tọ̀nà! Má ṣe lo òògùn fúnra rẹ láé.", "Daddy's generator is running close to the kitchen window. What should you do?": "Jẹnẹrétọ̀ Bàbá ń ṣiṣẹ́ nítòsí fèrèsé ilé ìdáná. Kí ni o yẹ kí o ṣe?", "Go and touch it to see if it is hot": "Lọ fọwọ́ kàn án láti mọ̀ bóyá ó gbóná", "Stay away and tell Daddy it must be far from windows and doors": "Jìnnà sí i kí o sì sọ fún Bàbá pé ó gbọ́dọ̀ jìnnà sí fèrèsé àti ilẹ̀kùn", "Generators are very hot and the smoke is poison (carbon monoxide).": "Jẹnẹrétọ̀ máa ń gbóná gan-an, èéfín rẹ̀ sì jẹ́ májèlé (carbon monoxide).", "Correct! Generator smoke can kill. It must be outside, far from windows.": "Ó tọ̀nà! Èéfín jẹnẹrétọ̀ lè pa ènìyàn. Ó gbọ́dọ̀ wà níta, jìnnà sí fèrèsé.", "The cover of the well is open. Your ball rolled next to it. What do you do?": "Ìdérí kànga wà ní ṣíṣí. Bọ́ọ̀lù rẹ yí lọ sí ẹ̀gbẹ́ rẹ̀. Kí ni o máa ṣe?", "Run and get the ball": "Sáré lọ mú bọ́ọ̀lù náà", "Stay away and call an adult to get the ball and close the well": "Jìnnà sí i kí o sì pe àgbàlagbà láti mú bọ́ọ̀lù kí ó sì dé kànga", "You could fall into the well. Always stay away from open wells.": "O lè já sínú kànga. Máa jìnnà sí kànga tó ṣí sílẹ̀ nígbà gbogbo.", "Correct! Never play near an open well or soakaway.": "Ó tọ̀nà! Má ṣe ṣeré nítòsí kànga tàbí ihò ìdọ̀tí tó ṣí sílẹ̀ láé.", "\"Hello! Your Mummy sent me to take you to school. Come with me.\"": "\"Ẹ n lẹ́ o! Màmá rẹ ló rán mi láti mú ọ lọ sí ilé-ìwé. Tẹ̀lé mi.\"", "Go with him, he knows Mummy": "Tẹ̀lé e, ó mọ Màmá", "Do not open the gate. Run back and tell Mummy": "Má ṣí ẹnu-ọ̀nà. Sáré padà kí o sì sọ fún Màmá", "Never go with someone you do not know. Strangers can say anything.": "Má ṣe tẹ̀lé ẹni tí o kò mọ̀ láé. Àjèjì lè sọ ohunkóhun.", "Excellent! Never go with a stranger. Always tell your parents.": "Ó dára jù! Má ṣe tẹ̀lé àjèjì láé. Máa sọ fún àwọn òbí rẹ nígbà gbogbo.", "Where should you walk on the street?": "Níbo ló yẹ kí o rìn lójú pópó?", "In the middle of the road": "Ní àárín títì", "On the walkway, holding an adult's hand": "Lórí ọ̀nà ẹlẹ́sẹ̀, kí o di ọwọ́ àgbàlagbà mú", "Cars, okadas and kekes use the road. You could be hit.": "Mọ́tò, ọ̀kadà àti kẹ̀kẹ́ ń lo títì. Wọ́n lè gbá ọ.", "Correct! Walk on the walkway and hold an adult's hand.": "Ó tọ̀nà! Rìn lórí ọ̀nà ẹlẹ́sẹ̀ kí o sì di ọwọ́ àgbàlagbà mú.", "You want to cross the road. What do you do first?": "O fẹ́ sọdá títì. Kí ni o máa kọ́kọ́ ṣe?", "Run across quickly": "Sáré sọdá kíákíá", "Stop at the zebra, look left, right, left again, and wait for the cars to stop": "Dúró ní ọ̀nà abilà, wo òsì, ọ̀tún, òsì lẹ́ẹ̀kan sí i, kí o sì dúró kí àwọn mọ́tò dúró", "Running across the road is very dangerous.": "Sísáré sọdá títì léwu gan-an.", "Well done! Stop, look and listen before you cross.": "O ṣe dáadáa! Dúró, wò, kí o sì fetí sílẹ̀ kí o tó sọdá.", "The school bus is coming. Where should you stand?": "Ọkọ̀ ilé-ìwé ń bọ̀. Níbo ló yẹ kí o dúró sí?", "At the edge of the road, ready to jump in": "Ní etí títì, ní ìmúrasílẹ̀ láti bẹ́ wọlé", "Behind the yellow line until the bus stops completely": "Lẹ́yìn ìlà aláwọ̀ ìyeyè títí ọkọ̀ yóò fi dúró pátápátá", "You could fall or be hit by the bus. Stay back.": "O lè ṣubú tàbí kí ọkọ̀ gbá ọ. Dúró sẹ́yìn.", "Correct! Wait behind the line until the bus stops.": "Ó tọ̀nà! Dúró sẹ́yìn ìlà títí ọkọ̀ yóò fi dúró.", "You are on the bus. What should you do?": "O ti wà nínú ọkọ̀. Kí ni o yẹ kí o ṣe?", "Stand up and put your head out of the window": "Dìde dúró kí o sì yọ orí rẹ síta fèrèsé", "Sit down, fasten your seatbelt and keep hands inside": "Jókòó, so bẹ́líìtì ìjókòó, kí o sì pa ọwọ́ mọ́ inú", "Never put your head or hands out of a moving bus.": "Má ṣe yọ orí tàbí ọwọ́ síta ọkọ̀ tó ń lọ láé.", "Excellent! Sit down and wear your seatbelt.": "Ó dára jù! Jókòó kí o sì so bẹ́líìtì ìjókòó.", "\"Your Daddy is busy. I will take you home. Get in my car.\"": "\"Bàbá rẹ kò ráyè. Màá gbé ọ lọ sí ilé. Wọ mọ́tò mi.\"", "Get in, he looks nice": "Wọlé, ó dà bí ènìyàn rere", "Say NO, stay inside, and tell the gatekeeper or teacher": "Sọ pé RÁRÁ, dúró sínú, kí o sì sọ fún olùṣọ́ ẹnu-ọ̀nà tàbí olùkọ́", "Never go with someone who is not on your pick-up list.": "Má ṣe tẹ̀lé ẹni tí kò sí lórí àkọsílẹ̀ àwọn tó máa wá gbé ọ láé.", "Excellent! Only go home with people your parents chose.": "Ó dára jù! Bá àwọn tí òbí rẹ yàn nìkan lọ sílé.", "\"This is our fire assembly point.\" If the fire alarm rings, where do you go?": "\"Ibí ni ibi ìpéjọ iná wa.\" Tí agogo iná bá dún, níbo ni o máa lọ?", "Hide under my desk": "Farapamọ́ sábẹ́ tábìlì mi", "Walk quickly to the assembly point and line up with my class": "Rìn kíákíá lọ sí ibi ìpéjọ kí o sì tò pẹ̀lú kíláàsì mi", "In a fire you must leave the building. Hiding is dangerous.": "Nígbà iná, o gbọ́dọ̀ jáde kúrò nínú ilé. Fífarapamọ́ léwu.", "Correct! Remember this place.": "Ó tọ̀nà! Rántí ibí yìí.", "The socket near your desk is sparking and smells like burning.": "Sọ́kẹ́ẹ̀tì nítòsí tábìlì rẹ ń ta iná, ó sì ń rùn bí ohun tó ń jóná.", "Pull out the plug yourself": "Yọ pulọ́ọ̀gì náà fúnra rẹ", "Move away and tell the teacher immediately": "Kúrò níbẹ̀ kí o sì sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "You could get an electric shock.": "Iná mànàmáná lè gbá ọ.", "Correct! Never touch sparking sockets.": "Ó tọ̀nà! Má ṣe fọwọ́ kan sọ́kẹ́ẹ̀tì tó ń ta iná láé.", "Your classmate is leaning back on two chair legs.": "Ọmọ kíláàsì rẹ ń fẹ̀yìn tì lórí ẹsẹ̀ àga méjì.", "Do it too, it is fun": "Ṣe é náà, ó dùn", "Sit with all four chair legs on the floor and tell him to stop": "Jókòó pẹ̀lú ẹsẹ̀ àga mẹ́rẹ̀ẹ̀rin lórí ilẹ̀ kí o sì sọ fún un kí ó dáwọ́ dúró", "The chair can fall back and you can hit your head.": "Àga lè ṣubú sẹ́yìn kí orí rẹ sì fara pa.", "Well done! Sit properly on your chair.": "O ṣe dáadáa! Jókòó dáadáa lórí àga rẹ.", "The break bell rings and everyone rushes out.": "Agogo ìsinmi dún, gbogbo ènìyàn sì ń sáré jáde.", "Push to be the first one out": "Tì àwọn ẹlòmíràn kí o lè jáde ṣáájú", "Walk, keep to the right, and do not push": "Rìn, tọ apá ọ̀tún, má sì ṣe tì ẹnikẹ́ni", "Pushing causes falls and injuries.": "Títì ẹlòmíràn máa ń fa ìṣubú àti ìpalára.", "Correct! Walk calmly in corridors.": "Ó tọ̀nà! Rìn jẹ́jẹ́ ní ọ̀dẹ̀dẹ̀.", "Some big pupils are pushing a small boy and taking his snacks.": "Àwọn akẹ́kọ̀ọ́ ńlá kan ń ti ọmọkùnrin kékeré kan, wọ́n sì ń gba ìpanu rẹ̀.", "Join them and laugh": "Dara pọ̀ mọ́ wọn kí o sì rẹ́rìn-ín", "Do not join. Go and tell a teacher at once": "Má dara pọ̀ mọ́ wọn. Lọ sọ fún olùkọ́ lẹ́sẹ̀kẹsẹ̀", "Bullying hurts people. Never join in.": "Ìfòòró ń pa àwọn ènìyà ay": "Sọ fún olùkọ́ kí o sì lọ sí yàrá aláìsàn", "A cut can get infected. Adults can help you.": "Ojú ọgbẹ́ lè kó àrùn. Àwọn àgbàlagbà lè ràn ọ́ lọ́wọ́.", "Correct! Always report injuries.": "Ó tọ̀nà! Máa jábọ̀ ìpalára nígbà gbogbo.", "Your school bus is parking. Where do you wait?": "Ọkọ̀ ilé-ìwé rẹ ń dúró sí ibi ìgbọ́kọ̀sí. Níbo ni o máa dúró?", "Behind the bus where the driver cannot see me": "Lẹ́yìn ọkọ̀ níbi tí awakọ̀ kò ti lè rí mi", "Behind the yellow line, where the driver can see me": "Lẹ́yìn ìlà aláwọ̀ ìyeyè, níbi tí awakọ̀ ti lè rí mi", "The driver cannot see behind the bus. You could be hit.": "Awakọ̀ kò lè rí ẹ̀yìn ọkọ̀. Ọkọ̀ lè gbá ọ.", "Correct! Stay where the driver can see you.": "Ó tọ̀nà! Dúró níbi tí awakọ̀ ti lè rí ọ."}};
// Site Life shared features for all games. Built into pages by src/build.py.
// SL.consent  privacy notice and consent (NDPA 2023)
// SL.t        translation with English fallback; SL.lang current language
// SL.settings graphics quality, text size, captions, colour-blind palette
// SL.caption  on-screen captions for spoken text
// SL.post     send a result to our server / Google Sheets with an offline queue (IndexedDB); SL.lastId, SL.certLink(id)
// SL.lms      SCORM 1.2 reporting when the game runs inside an LMS frame
const SL = (() => {
  const QS = new URLSearchParams(location.search);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('sl-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('sl-' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const escH = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- language ----------
  const LANGS = [
    { id: 'en', name: 'English', voice: 'en' },
    { id: 'pcm', name: 'Pidgin', voice: 'en' },
    { id: 'yo', name: 'Yorùbá', voice: 'yo' },
    { id: 'ha', name: 'Hausa', voice: 'ha' },
    { id: 'ig', name: 'Igbo', voice: 'ig' },
  ];
  const I18N = (typeof SL_I18N !== 'undefined') ? SL_I18N : {};
  let lang = QS.get('lang') || store.get('lang', 'en');
  if (!LANGS.some(l => l.id === lang)) lang = 'en';
  const misses = new Set();
  function t(s) { return s == null ? '' : trText(String(s)); }
  function setLang(id) { lang = id; store.set('lang', id); }

  // Automatic on-screen translation: every text node added to the page is looked up in the
  // dictionary (exact match, then with a leading emoji/symbol prefix removed, then {0}-patterns).
  const PAT = {}, VALUES = {};
  for (const [l, d] of Object.entries(I18N)) {
    PAT[l] = Object.keys(d).filter(k => k.includes('{0}')).map(k => {
      const parts = k.split(/\{\d\}/).map(x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
      return { re: new RegExp('^' + parts.join('(.+?)') + '$'), out: d[k] };
    });
    VALUES[l] = new Set(Object.values(d));
  }
  const PREFIX = /^([\s\p{Extended_Pictographic}\p{S}\p{P}‍️]*?)((?!\p{Extended_Pictographic})[\p{L}"'(].*?)([\s.!?…:]*)$/su;
  // OUT remembers what we produced, so text we already translated is not looked up (and reported missing) again
  const OUT = new Set();
  function trText(s) {
    if (lang === 'en' || !s) return s;
    if (OUT.has(String(s).trim())) return s;
    const r = trText0(s); if (r !== s) OUT.add(String(r).trim()); return r;
  }
  function trText0(s) {
    if (lang === 'en' || !s || !/\p{L}/u.test(s)) return s;
    const d = I18N[lang] || {}, core = s.trim();
    if (d[core] != null) return s.replace(core, d[core]);
    if (VALUES[lang] && VALUES[lang].has(core)) return s;
    const m = core.match(PREFIX);
    if (m) {
      const body = m[2] + m[3];
      if (d[body] != null) return s.replace(core, m[1] + d[body]);
      if (d[m[2]] != null) return s.replace(core, m[1] + d[m[2]] + m[3]);
    }
    const sub = v => (I18N[lang] || {})[v] != null ? I18N[lang][v] : v.split(', ').map(x => { const d2 = I18N[lang] || {}; return d2[x] != null ? d2[x] : x; }).join(', ');
    for (const p of PAT[lang] || []) {
      const mm = core.match(p.re); if (mm) return s.replace(core, p.out.replace(/\{(\d)\}/g, (_, i) => sub(mm[+i + 1])));
      if (m) { const m2 = (m[2] + m[3]).match(p.re); if (m2) return s.replace(core, m[1] + p.out.replace(/\{(\d)\}/g, (_, i) => sub(m2[+i + 1]))); }
    }
    if (core.length > 2 && core.length < 400) misses.add(core);
    return s;
  }
  function translateTree(root) {
    if (lang === 'en' || !root) return;
    if (root.nodeType === 3) { if (root.parentElement && root.parentElement.closest('[data-notr],textarea')) return; const v = trText(root.data); if (v !== root.data) root.data = v; return; }
    if (root.nodeType !== 1 || root.closest && root.closest('[data-notr],script,style,textarea')) return;
    for (const a of ['placeholder', 'title', 'aria-label']) if (root.hasAttribute && root.hasAttribute(a)) root.setAttribute(a, trText(root.getAttribute(a)));
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let n = w.nextNode(); n; n = w.nextNode()) {
      if (n.nodeType === 1) { if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName) || n.hasAttribute('data-notr')) continue;
        for (const a of ['placeholder', 'title', 'aria-label']) if (n.hasAttribute(a)) n.setAttribute(a, trText(n.getAttribute(a))); continue; }
      if (n.parentElement && n.parentElement.closest('[data-notr],textarea')) continue;
      const v = trText(n.data); if (v !== n.data) n.data = v;
    }
  }
  if (lang !== 'en') {
    const mo = new MutationObserver(ms => { for (const m of ms) { if (m.type === 'characterData') translateTree(m.target); else m.addedNodes.forEach(translateTree); } });
    const startObs = () => { translateTree(document.body); mo.observe(document.body, { childList: true, subtree: true, characterData: true }); };
    document.body ? startObs() : addEventListener('DOMContentLoaded', startObs);
  }

  // ---------- consent ----------
  const CONSENT_V = 1;
  const consent = {
    ok() { return store.get('consent', 0) >= CONSENT_V; },
    give() { store.set('consent', CONSENT_V); },
    notice(kids) {
      return kids
        ? t('A parent or teacher should read this: the game saves the child\'s first name, stars and answers so parents and teachers can see progress. It is only sent if the game is opened from a school or family link, is kept only as long as the school decides, and is never sold or shared.')
        : t('This induction saves your name, company, role, answers and result so the HSE team can confirm you completed it. Only HSE can see the results. They are kept for the period set by the company (normally 12 months) and then deleted. You can ask HSE to see or delete your record.');
    },
    // Returns HTML for a checkbox block; call bind(modal, startBtn) after rendering.
    html(kids) {
      const ok = this.ok();
      return `<div class="consent"><label><input type="checkbox" id="slConsent" ${ok ? 'checked' : ''}> ${escH(t(kids ? 'A parent or teacher agrees to the privacy notice' : 'I have read and agree to the privacy notice'))}</label>
        <details><summary>${escH(t('Privacy notice'))}</summary><p>${escH(this.notice(kids))}</p></details></div>`;
    },
    bind(m, btn) {
      const cb = m.querySelector('#slConsent'); if (!cb) return;
      const upd = () => { if (btn) btn.disabled = !cb.checked || btn.dataset.waiting === '1'; if (cb.checked) consent.give(); else store.set('consent', 0); };
      cb.onchange = upd; upd();
    },
  };

  // ---------- settings ----------
  const DEF = { quality: 'auto', text: 1, captions: true, cb: false, voice: true };
  const settings = Object.assign({}, DEF, store.get('settings', {}));
  const save = () => store.set('settings', settings);
  function applyCss() {
    document.documentElement.style.setProperty('--fs', settings.text);
    document.documentElement.classList.toggle('cbsafe', !!settings.cb);
  }
  const autoQuality = () => (Math.min(innerWidth, innerHeight) < 700 || /Android|iPhone|iPad/i.test(navigator.userAgent)) ? 'medium' : 'high';
  function quality() { return settings.quality === 'auto' ? (store.get('autoLow', false) ? 'low' : autoQuality()) : settings.quality; }
  const markerColor = () => settings.cb ? '#1f77ff' : '#ffd400';

  // fps watchdog: switch to low quality when the device struggles (auto mode only)
  const fps = { acc: 0, n: 0, low: 0, cb: null,
    tick(dt) {
      if (settings.quality !== 'auto' || quality() === 'low') return;
      this.acc += dt; this.n++;
      if (this.acc >= 2) { const f = this.n / this.acc; this.acc = 0; this.n = 0; this.low = f < 25 ? this.low + 1 : 0;
        if (this.low >= 3) { store.set('autoLow', true); this.cb && this.cb('low'); } }
    } };

  function settingsHtml() {
    const q = settings.quality, opt = (v, l) => `<option value="${v}" ${q === v ? 'selected' : ''}>${escH(t(l))}</option>`;
    return `<h2>⚙️ ${escH(t('Settings'))}</h2>
      <p><b>${escH(t('Language'))}</b></p><div class="row" id="slLangs">${LANGS.map(l => `<button data-lang="${l.id}" class="${l.id === lang ? 'primary' : ''}">${escH(l.name)}</button>`).join('')}</div>
      <p class="muted" style="font-size:.85rem">${escH(t('Yorùbá, Hausa and Igbo are draft translations being reviewed. Untranslated text shows in English.'))}</p>
      <p><b>${escH(t('Graphics quality'))}</b></p><select id="slQ">${opt('auto', 'Automatic')}${opt('low', 'Low (old phones)')}${opt('medium', 'Medium')}${opt('high', 'High')}</select>
      <p><b>${escH(t('Text size'))}</b></p><div class="row">${[[1, 'A'], [1.15, 'A+'], [1.3, 'A++']].map(([v, l]) => `<button data-fs="${v}" class="${settings.text == v ? 'primary' : ''}">${l}</button>`).join('')}</div>
      <p><label><input type="checkbox" id="slCap" ${settings.captions ? 'checked' : ''}> ${escH(t('Show captions for spoken words'))}</label></p>

er and collect a pass", "ok": true, "why": "Correct. Security controls who is inside so that everyone can be accounted for in an emergency."}]}, "reception": {"who": "💁🏾‍♀️ Receptionist", "text": "\"Welcome! Here are your safety boots, hi-vis vest, hard hat, goggles and ear plugs.\" The boots are a bit tight.", "o": [{"t": "Leave the PPE, \"na only small time I go spend\"", "ok": false, "fx": {"site": -1}, "ppe": false, "why": "Accident no dey give notice. Without ear plugs and goggles, noisy areas will now damage your hearing."}, {"t": "Ask for the correct size and wear everything", "ok": true, "ppe": true, "why": "Correct. PPE only works if you wear it, and it must fit. Your character is now wearing PPE."}]}, "admin": {"who": "🏢 Admin stairs", "text": "On the staircase, a cleaner has just mopped. There is no wet-floor sign and you are carrying files with both hands.", "o": [{"t": "Rush down, you are late", "ok": false, "fx": {"health": -3}, "why": "Slips, trips and falls are among the most common workplace injuries. Hold the rail."}, {"t": "Hold the handrail, go slowly and tell the cleaner to put up a sign", "ok": true, "why": "Correct. You protected yourself and the next person."}]}, "canteen": {"who": "👨🏾‍🍳 Cook", "text": "You smell gas near the kitchen burners. The cook is about to strike a match: \"Make I light am, food don late.\"", "o": [{"t": "Ignore it, cooks know their work", "ok": false, "fx": {"health": -3, "site": -3}, "why": "A gas leak plus a flame can cause an explosion."}, {"t": "Shout \"STOP, no fire!\", don't touch switches, open the windows, get people out and report it", "ok": true, "why": "Correct. No flames or switches, ventilate, evacuate and report."}]}, "workshop": {"who": "🛠️ Workshop", "text": "Someone is grinding metal. Sparks are flying and the machine is very loud. You need to pass through to the store.", "o": [{"t": "Pass quickly without goggles or ear plugs", "ok": false, "fx": {"eyes": -4, "hearing": -2}, "why": "Grinding sparks and chips damage eyes, and loud noise damages hearing permanently."}, {"t": "Put on goggles and ear plugs, wait for a pause, then pass behind the screen", "ok": true, "why": "Correct. Wear the right PPE for the area."}]}, "chemical": {"who": "🧪 Chemical store", "text": "You find a drink bottle with clear liquid in it and no label on the chemical shelf.", "o": [{"t": "Smell it to find out what it is", "ok": false, "fx": {"lungs": -3, "eyes": -2}, "why": "Never smell or taste an unknown chemical."}, {"t": "Don't touch it. Report it so it can be labelled or disposed of safely", "ok": true, "why": "Correct. Every chemical needs a label and a safety data sheet (SDS)."}]}, "diesel": {"who": "🚬 Contractor", "text": "A contractor near the diesel tanks lights a cigarette: \"Diesel no dey catch fire like petrol.\"", "o": [{"t": "Stand with him and gist", "ok": false, "fx": {"site": -4}, "why": "Diesel vapour, spills and nearby fuels can ignite. No smoking near fuel."}, {"t": "Ask him to put it out, show him the No Smoking sign and report it", "ok": true, "why": "Correct. Speaking up protects everyone on site."}]}, "warehouse": {"who": "🧔🏾 Oga (Supervisor)", "text": "\"Abeg climb that rack and bring the top box. No time for ladder, the customer dey wait!\"", "o": [{"t": "Climb the rack", "ok": false, "fatal": true, "why": "You fell from height. Falls from height are among the top killers at work."}, {"t": "\"I no fit do am like that.\" Use your Stop-Work right and get a ladder or order picker", "ok": true, "fx": {"site": 2}, "badge": "Stop-Work Hero", "why": "Correct. Everyone has the right to stop unsafe work, even when Oga is the one asking."}]}, "generator": {"who": "⛽ Generator house", "text": "The gen is running, the door is shut and a colleague is sleeping inside on a carton.", "o": [{"t": "Leave him to rest", "ok": false, "fx": {"lungs": -4, "site": -2}, "why": "Gen fumes contain carbon monoxide. You cannot smell it, and it kills people who are sleeping. Na quiet killer b  work", "ok": true, "fx": {"site": 2}, "badge": "LOTO Pro", "why": "Correct. Isolate, lock, tag, try. Production can wait; your life cannot."}]}, "electrical_default": {"who": "⚡ Electrical room", "text": "The door marked \"DANGER – Authorised Persons Only\" is open and the panel is humming. A friend says: \"Come see inside.\"", "o": [{"t": "Go in and look", "ok": false, "fx": {"health": -3, "site": -1}, "why": "High voltage can arc. Only authorised people may enter."}, {"t": "Stay out, close the door if it is safe to do so, and report it", "ok": true, "why": "Correct. Respect the signs."}]}}, "events": {"nepa": {"who": "⚡ NEPA has taken light!", "text": "Power is gone and the compound goes dark. Someone wants to \"back-feed\" the office by plugging the small gen straight into a wall socket.", "o": [{"t": "Help him plug it in", "ok": false, "fx": {"health": -3, "site": -2}, "why": "Back-feeding can electrocute people working on the lines and can cause a fire."}, {"t": "Stop him. Only the changeover switch should be used, by an electrician", "ok": true, "why": "Correct. Use the proper changeover."}]}, "rain": {"who": "🌧️ Heavy rain!", "text": "The yard is flooding and water is moving towards the electrical room door.", "o": [{"t": "Wade through to get to the canteen faster", "ok": false, "fx": {"health": -3}, "why": "Water and electricity kill. You also cannot see open drains under flood water."}, {"t": "Keep away, warn others and call the emergency number", "ok": true, "why": "Correct. Warn, keep away, report."}]}}, "hazards": [{"e": "🧯", "t": "Fire extinguisher hidden behind cartons"}, {"e": "🔌", "t": "Frayed extension cable across the path"}, {"e": "🚪", "t": "Fire exit blocked with pallets"}, {"e": "⚙️", "t": "Machine with its guard removed"}, {"e": "🧴", "t": "Unlabelled chemical bottle"}, {"e": "🪜", "t": "Ladder with a broken rung"}, {"e": "🛢️", "t": "Oil spill on the walkway"}, {"e": "🔥", "t": "Oily rags piled next to a hot pipe"}], "decoys": [{"e": "🩹", "t": "S function ensureAudio(){ if(!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f=880, d=0.12, type='square', v=0.05){
  if(muted||!audio) return;
  try{ const o=audio.createOscillator(), g=audio.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    const t=audio.currentTime; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d); }catch(e){}
}
const chime = ()=>{beep(660,.12,'sine',.08); setTimeout(()=>beep(990,.18,'sine',.08),110);};

let guideOn = true, guidePick = null;
const ROUTE = (COURSE ? COURSE.route : SITE.route || ZONES.map(z=>z.id)).filter(HAS);
const TARGET_PT = SITE.targets || {}, ZNAME = SITE.znames || {};
function nextTask(){
  if(S.alarm && !S.alarm.done) return {id:'muster', name:'MUSTER POINT', x:MUSTER.x, y:MUSTER.y};
  if(S.oga){ const a=S.oga.active.slice().sort((a,b)=>dist(S.p.x,S.p.y,a.inc.x,a.inc.y)-dist(S.p.x,S.p.y,b.inc.x,b.inc.y))[0]; return a ? {id:'oga-'+a.inc.id, name:a.inc.name, x:a.inc.x, y:a.inc.y} : null; }
  const pick = guidePick && !(guidePick in S.results) ? guidePick : ROUTE.find(id=>!(id in S.results));
  if(!pick) return null;
  const z=ZONES.find(z=>z.id===pick), pt=TARGET_PT[pick]||[z.x,z.y];
  return {id:pick, name:ZNAME[pick]||z.name, x:pt[0], y:pt[1]};
}
const GS=20, GW=Math.ceil(W/GS), GH=Math.ceil(H/GS); let GRID=null, GRID_GATE=null;
function buildGrid(){ const sol=solids(); GRID=new Uint8Array(GW*GH); for(let y=0;y<GH;y++) for(let x=0;x<GW;x++) GRID[y*GW+x]=blocked(x*GS+GS/2,y*GS+GS/2,15,sol)?1:0; GRID_GATE=S.gateOpen; }
function cellCost(x,y){ const cx=x*GS+GS/2, cy=y*GS+GS/2; if(cy>LANE.y1-8 && cy<LANE.y2+8 && cx>LANE.x1 && cx<LANE.x2) return CROSS.some(c=>cx>c.x1 && cx<c.x2)?1:40; return 1; }
function freeCell(cx,cy){ if(!GRID[cy*GW+cx]) return [cx,cy]; for(let r=1;r<6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const x=cx+dx,y=cy+dy; if(x>=0&&y>=0&&x<GW&&y<GH&&!GRID[y*GW+x]) return [x,y]; } return [cx,cy]; }
function findPath(sx,sy,tx,ty){
  if(!GRID||GRID_GATE!==S.gateOpen) buildGrid();
  const [ax,ay]=freeCell(clamp(Math.floor(sx/GS),0,GW-1),clamp(Math.floor(sy/GS),0,GH-1)), [bx,by]=freeCell(clamp(Math.floor(tx/GS),0,GW-1),clamp(Math.floor(ty/GS),0,GH-1));
  const N=GW*GH, g=new Float32Array(N).fill(1e9), from=new Int32Array(N).fill(-1), closed=new Uint8Array(N), heap=[];
  const h=(i)=>{ const x=i%GW,y=(i/GW)|0; return Math.hypot(x-bx,y-by); };
  const push=(i,f)=>{ heap.push([f,i]); let k=heap.length-1; while(k>0){ const pk=(k-1)>>1; if(heap[pk][0]<=heap[k][0]) break; [heap[pk],heap[k]]=[heap[k],heap[pk]]; k=pk; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let k=0; for(;;){ const l=2*k+1,r=l+1; let m=k; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===k) break; [heap[m],heap[k]]=[heap[k],heap[m]]; k=m; } } return top; };
  const start=ay*GW+ax, goal=by*GW+bx; g[start]=0; push(start,h(start));
  while(heap.length){ const [,i]=pop(); if(closed[i]) continue; closed[i]=1; if(i===goal) break; const x=i%GW, y=(i/GW)|0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=GW||ny>=GH) continue; const j=ny*GW+nx; if(GRID[j]||closed[j]) continue;
      if(dx&&dy && (GRID[y*GW+nx]||GRID[ny*GW+x])) continue;
      const ng=g[i]+(dx&&dy?1.414:1)*cellCost(nx,ny); if(ng<g[j]){ g[j]=ng; from[j]=i; push(j,ng+h(j)); } } }
  if(from[goal]<0 && goal!==start) return null;
  const cells=[]; for(let i=goal;i!==-1;i=from[i]) cells.push([(i%GW)*GS+GS/2,((i/GW)|0)*GS+GS/2]); cells.reverse();
  cells[0]=[sx,sy]; cells.push([tx,ty]); return cells;
}
function pathLen(pth){ let L=0; for(let i=1;i<pth.length;i++) L+=dist(pth[i-1][0],pth[i-1][1],pth[i][0],pth[i][1]); return L; }
function guideUpdate(dt){
  const p=S.p, T=guideOn? nextTask() : null; S.guide=S.guide||{t:0,key:'',path:null,esc:{x:200,y:1150,step:0,face:Math.PI,moving:false},said:''};
  const gd=S.guide; gd.target=T; gd.t-=dt;
  if(!T){ gd.path=null; return; }
  const key=T.id+'|'+S.gateOpen;
  if(key!==gd.key || gd.t<=0 || !gd.path){ gd.path=findPath(p.x,p.y,T.x,T.y); gd.key=key; gd.t=.6; }
  if(gd.said!==T.id){ gd.said=T.id; if(T.id==='muster' && S.alarm) toast('🦺 HSE Escort: "Follow me to the MUSTER POINT, quick quick!"'); else toast(`🦺 HSE Escort: "Follow me. Next stop: ${T.name}."`); }
  // escort walks ahead along the path
  const e=gd.esc, pth=gd.path; if(!pth) return;
  let acc=0, goal=pth[pth.length-1];
  for(let i=1;i<pth.length;i++){ acc+=dist(pth[i-1][0],pth[i-1][1],pth[i][0],pth[i][1]); if(acc>=70){ goal=pth[i]; break; } }

  e.moving=false;
  const behind = dist(e.x,e.y,T.x,T.y) > dist(p.x,p.y,T.x,T.y)+30;
  if(dP>380){ e.x=p.x+(goal[0]-p.x)*.4; e.y=p.y+(goal[1]-p.y)*.4; }
  else if((dP<170 || behind) && dG>12){ const sp=(S.alarm||behind?175:105)*dt, k=Math.min(1,sp/dG); const dx=(goal[0]-e.x)*k, dy=(goal[1]-e.y)*k; e.x+=dx; e.y+=dy; e.face=Math.atan2(-dx,-dy); e.step+=dt*9; e.moving=true; }
  else { e.face=Math.atan2(-(p.x-e.x),-(p.y-e.y)); }
}

    s.push({x:0,y:H-2,w:W,h:2}); s.push({x:0,y:0,w:4,h:H}); s.push({x:W-4,y:0,w:4,h:H});

function blocked(x,y,r,sol){
  for(const b of sol){ const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h); if((x-cx)**2+(y-cy)**2 < r*r) return true; }

}

// ================== UPDATE ==================
function update(dt){
  S.t += dt;
  const p=S.p, sol=solids();
  // look with arrow keys / Q E-less rotation
  if(keys.ArrowLeft) yaw += 2.2*dt; if(keys.ArrowRight) yaw -= 2.2*dt;
  let fwd=0, str=0;
  if(keys.KeyW||keys.ArrowUp) fwd+=1; if(keys.KeyS||keys.ArrowDown) fwd-=1;
  if(keys.KeyD) str+=1; if(keys.KeyA) str-=1;
  if(joy){ fwd=-joy.dy; str=joy.dx; }
  const fx=-Math.sin(yaw), fy=-Math.cos(yaw), rx=Math.cos(yaw), ry=-Math.sin(yaw);
  let mx=fx*fwd+rx*str, my=fy*fwd+ry*str; const len=Math.hypot(mx,my);
  p.moving = len>0.1;
  if(p.moving){
    const sp = 120*(len>1?1/len:1); mx*=sp; my*=sp; const r=13;
    if(!blocked(p.x+mx*dt,p.y,r,sol)) p.x+=mx*dt;
    if(!blocked(p.x,p.y+my*dt,r,sol)) p.y+=my*dt;
    p.x=clamp(p.x,10,W-10); p.y=clamp(p.y,10,H-10);
    p.face=Math.atan2(-mx,-my); p.step+=dt*9;
  }
  // forklift
  const f=S.forklift, inLane = p.y>LANE.y1-6 && p.y<LANE.y2+6 && p.x>LANE.x1 && p.x<LANE.x2;
  const onCross = CROSS.some(c=>p.x>c.x1-4 && p.x<c.x2+4);
  const ahead = (p.x-f.x)*f.dir;
  f.stop = inLane && ahead>0 && ahead<170;
  if(!f.stop){ f.x+=f.dir*110*dt; if(f.x>LANE.x2-60) f.dir=-1; if(f.x<LANE.x1+60) f.dir=1; }
  if(HAS('forklift') && inLane && !onCross && !('forklift' in S.results)){
    complete('forklift',false); S.mistakes.push({where:'Forklift Lane',why:'You cut across the forklift lane. Only cross at the zebra crossing, where drivers expect people.'});
    S.bars.site=clamp(S.bars.site-1,0,10); toast('⚠️ You are in the forklift lane! Only cross at the zebra crossing.','bad'); buzz();
  }
  if(HAS('forklift') && inLane && onCross && !('forklift' in S.results)){ complete('forklift',true); toast('✅ Nice. You used the zebra crossing and the forklift stopped for you.'); chime(); }
  if(inLane && Math.abs(p.x-f.x)<44 && Math.abs(p.y-440)<44 && !onCross && S.t-S.lastHit>2){
    S.lastHit=S.t; S.bars.health=clamp(S.bars.health-4,0,10); toast('💥 The forklift hit you! Health −4. The driver could not see you.','bad'); buzz(); G.shake=0.6;
    S.mistakes.push({where:'Forklift Lane',why:'You were hit by a forklift. Stay on walkways and only cross at the zebra crossing.'});
    p.y = p.y<440 ? LANE.y1-20 : LANE.y2+20;
  }
  // reversing van
  const v=S.van;
  if(v.wait>0) v.wait-=dt; else { v.y += v.dir*45*dt; if(v.y<900){v.dir=1;v.wait=2;} if(v.y>1050){v.dir=-1;v.wait=2;} }
  const reversing = v.dir<0 && v.wait<=0;
  if(reversing && Math.floor(S.t*2)%2===0 && Math.floor((S.t-dt)*2)%2!==0 && dist(p.x,p.y,1360,v.y)<380) beep(1150,.08,'square',.03);
  if(HAS('carpark') && !('carpark' in S.results) && dist(p.x,p.y,1360,v.y-40)<130) scenario(SC.carpark,'Car Park',o=>complete('carpark',o.ok));
  const inMuster = dist(p.x,p.y,MUSTER.x,MUSTER.y)<MUSTER.r;
  if(HAS('muster') && !('muster' in S.results) && inMuster && !S.alarm && !paused) scenario(SC.muster,'Muster Point',o=>complete('muster',o.ok));
  // noise area
  // consequences of missing PPE (once each)
  const pp=p.ppe, hit=(k,cond,fx,msg)=>{ if(cond && !S.ppeHit[k] && ('reception' in S.results)){ S.ppeHit[k]=1; for(const b in fx) S.bars[b]=clamp(S.bars[b]+fx[b],0,10); S.mistakes.push({where:'Missing PPE',why:msg}); toast('💥 '+msg,'bad'); buzz(); G.shake=.4; } };
  const zd=(id)=>{ const [zx,zy]=zpos(id); return dist(p.x,p.y,zx,zy); };
  hit('eyes', !pp.goggles && zd('workshop')<140, {eyes:-3}, 'A grinding spark flew into your eye at the Workshop. You had no safety goggles.');
  hit('head', !pp.hat && zd('warehouse')<120, {health:-3}, 'A carton fell from the top rack onto your head at the Warehouse. You had no hard hat.');
  hit('feet', !pp.boots && zd('loading')<150, {health:-2}, 'A pallet jack rolled over your foot at the Loading Bay. You had no safety boots.');
  hit('vest', !pp.vest && Math.abs(p.x-S.forklift.x)<180 && p.y>340 && p.y<540, {health:-1,site:-1}, 'The forklift driver nearly hit you. Without a hi-vis vest he could not see you.');
  hit('hands', !pp.gloves && needsGloves() && (zd('warehouse')<120 || zd('electrical')<120), {health:-1}, 'You cut your hand on a sharp edge. Your job needs work gloves.');
  if(dist(p.x,p.y,NOISE.x,NOISE.y)<NOISE.r && !S.alarm && !p.ppe.muffs){
    S.bars.hearing=clamp(S.bars.hearing-0.6*dt,0,10);
    if(S.t-S.noiseToastAt>6){S.noiseToastAt=S.t; toast('🔊 Too loud! No ear plugs. Your hearing is being damaged.','warn'); beep(3000,.25,'sine',.015);}
  }
  if(S.nepa>0) S.nepa-=dt;
  if(S.rain>0) S.rain-=dt;
  // alarm
  if(S.alarm && !S.alarm.done){
    S.alarm.left-=dt; S.smokeR+=dt*9;
    if(Math.floor(S.t*1.5)%2===0) beep(Math.floor(S.t*1.5)%4<2?900:700,.05,'square',.02);
    if(dist(p.x,p.y,1030,300)<S.smokeR && p.y>280){ S.bars.lungs=clamp(S.bars.lungs-1.4*dt,0,10); if(S.t-S.smokeToastAt>4){S.smokeToastAt=S.t; toast('😷 Smoke! Move away. Stay low and keep going.','bad');} }
    S.workers.forEach(w=>{ const a=Math.atan2(MUSTER.y-w.y,MUSTER.x-w.x); if(dist(w.x,w.y,MUSTER.x,MUSTER.y)>30){ w.x+=Math.cos(a)*80*dt; w.y+=Math.sin(a)*80*dt; w.step+=dt*9; w.face=Math.atan2(-Math.cos(a),-Math.sin(a)); } });
    $('timer').textContent='🚨 '+Math.max(0,Math.ceil(S.alarm.left))+'s';
    if(inMuster){ S.alarm.done=true; toast('✅ You made it to the Muster Point! The fire warden has counted you.'); endGame(); return; }
    if(S.alarm.left<=0){ S.mistakes.push({where:'Fire alarm',why:'You did not reach the muster point in time. Know your route before you need it.'}); endGame(); return; }
  }
  if(S.oga){ ogaUpdate(dt); if(S.over) return; }
  if(S.bars.health<=0 && !S.fatal){ S.fatal='Your health reached zero.'; endGame(); return; }
  if(S.bars.lungs<=0 && !S.fatal){ S.fatal='You collapsed from breathing smoke or fumes.'; endGame(); return; }
  guideUpdate(dt);
  const near = interactables().filter(i=>dist(p.x,p.y,i.x,i.y)<i.r).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y))[0];
  S.near = near;
  if(autoQ && near && near.auto && !paused && dist(p.x,p.y,near.x,near.y)<near.r*.75){ near.run(); return; }
  if(near){ $('prompt').textContent=near.name; $('prompt').classList.remove('hidden'); $('act').textContent=near.label; $('act').disabled=false; }
  else { $('prompt').classList.add('hidden'); $('act').textContent='E'; $('act').disabled=true; }
}
function doAct(){ if(!paused && S && S.near){ ensureAudio(); S.near.run(); } }

function mergeGeos(list){

// ---------- glTF models (ROADMAP 12/13): rigged avatars and scanned client buildings ----------
// Everything here is optional and lazy: nothing is fetched unless a glTF URL is given (opts.gltf,
// a global SL_AVATAR_URL, or placeSiteModel). On any failure (offline, blocked CDN, bad file) it
// logs one warning per URL and keeps the procedural fallback.
const GLTF_LIB='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
const GLTF_SKEL='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js';
const _gltf={cache:{}, scripts:{}, warned:new Set(), loader:null};
function loadScriptOnce(src){
  return _gltf.scripts[src] || (_gltf.scripts[src]=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=res; s.onerror=()=>rej(new Error('could not load '+src)); document.head.appendChild(s); }));
}
function gltfWarn(url,e){ if(_gltf.warned.has(url)) return; _gltf.warned.add(url); console.warn('Site Life: glTF '+url+' not loaded, using the built-in model ('+((e&&e.message)||e)+')'); }
// Resolves the loaded glTF scene (with .animations); the same object for every call with that URL, so clone it to place it twice.
function loadGLTF(url){
  if(_gltf.cache[url]) return _gltf.cache[url];
  const p=(async()=>{
    if(!window.THREE) throw new Error('three.js missing');
    if(navigator.onLine===false && !/^(blob|data):/.test(url)) throw new Error('offline');
    if(!THREE.GLTFLoader) await loadScriptOnce(GLTF_LIB);
    if(!_gltf.loader) _gltf.loader=new THREE.GLTFLoader();
    const g=await new Promise((res,rej)=>_gltf.loader.load(url,res,undefined,rej));
    g.scene.animations=g.animations||[]; return g.scene;
  })();
  p.catch(e=>gltfWarn(url,e)); // stays cached as failed: one warning, no retry storm
  return (_gltf.cache[url]=p);

// Copy a loaded glTF scene; skinned (rigged) models need SkeletonUtils so each copy has its own skeleton.
async function cloneGLTF(src){
  let skinned=false; src.traverse(o=>{ if(o.isSkinnedMesh) skinned=true; });
  if(skinned && !THREE.SkeletonUtils) { try{ await loadScriptOnce(GLTF_SKEL); }catch(e){} }

}
// makeHuman() now, swapped for the glTF avatar (opts.gltf or SL_AVATAR_URL) when it loads.
// Extra opts: gltf (URL), gltfHeight (m, default 1.75), gltfFacing ('+z' default glTF convention, or '-z').
function makeHumanGLTF(o={}){
  const g=makeHuman(o);

    const u=g.userData;
    g.children.forEach(ch=>{ if(!(ch===u.label || (ch.userData&&ch.userData.blob))) ch.visible=false; });
    g.add(holder); u.gltf=holder;
    const clips=model.animations||[];
    if(clips.length){

function animGLTF(u,moving,t){
