<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Site Life</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d1f22; --muted:#5d636b; --line:#ddd8cc;
  --brand:#0f7a4f; --brand-ink:#ffffff; --warn:#b26b00; --bad:#c0392b; --good:#1e8e3e; --chip:#f0ede5;
  --hud:rgba(255,255,255,.88);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
    --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
    --hud:rgba(25,27,30,.86);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
  --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
  --hud:rgba(25,27,30,.86);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#2b2d2f}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
.hidden{display:none !important}
.muted{color:var(--muted)}
/* HUD */
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.hbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);pointer-events:auto}
#bars{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;font-size:12px;align-items:center}
.b{min-width:58px}.b .t{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}.b .f{height:100%;background:var(--good)}
.b.low .f{background:var(--bad)}
#info{font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
#mini{display:block;border-radius:8px}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.tst{background:var(--hud);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
/* Controls */
#act{position:fixed;right:18px;bottom:22px;z-index:5;width:78px;height:78px;border-radius:50%;font-weight:800;font-size:13px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#phoneBtn{position:fixed;right:106px;bottom:30px;z-index:5;border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#muteBtn{position:fixed;left:12px;bottom:22px;z-index:5;border-radius:12px;padding:8px 10px;opacity:.85}
#prompt{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;pointer-events:none;white-space:nowrap}
#joy{position:fixed;z-index:4;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.7)}
/* Modal */
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal h2{margin:.1em 0 .4em;font-size:1.2rem}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .av{font-size:2rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--chip)}
.fb.bad{border-left-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.85rem}
.big{font-size:1.9rem;font-weight:800}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
ul.tasks{list-style:none;padding:0;margin:8px 0}
ul.tasks li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(220,30,30,.55);animation:pl 0.8s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 10px rgba(220,30,30,.25)}}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}}
#timer{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:6;background:var(--bad);color:#fff;font-weight:800;border-radius:12px;padding:6px 14px;font-size:20px}
@media (max-width:600px){
  .tst{font-size:13px;padding:6px 10px}
  #bars{grid-template-columns:repeat(3,auto)}
  #mini{width:110px;height:86px}
  #toast{top:128px}
  #timer{top:130px}
}
</style>
</head>

  <div class="hbox"><div id="bars"></div><div id="info"></div></div>
  <div class="hbox" style="padding:5px"><canvas id="mini" width="150" height="118"></canvas></div>

<div id="prompt" class="hidden"></div>
<div id="joy" class="hidden"><i></i></div>

<button id="phoneBtn" class="hidden">📱 Tasks</button>

const dist = (a,b,c,d) => Math.hypot(a-c,b-d);

// ================== AUDIO ==================
function ensureAudio(){ if(!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f=880, d=0.12, type='square', v=0.05){
  if(muted||!audio) return;
  try{
    const o=audio.createOscillator(), g=audio.createGain(); o.type=type; o.frequency.value=f;
    g.gain.value=v; o.connect(g); g.connect(audio.destination); const t=audio.currentTime;
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d);
  }catch(e){}
}
const chime = ()=>{beep(660,.12,'sine',.08); setTimeout(()=>beep(990,.18,'sine',.08),110);};
const buzz = ()=>{beep(140,.35,'sawtooth',.07);};

// ================== UI HELPERS ==================
function toast(msg, kind=''){
  const d=document.createElement('div'); d.className='tst '+kind; d.textContent=msg; $('toast').appendChild(d);
  setTimeout(()=>d.remove(), 3200);
  while($("toast").children.length>2) $('toast').firstChild.remove();
}

function applyChoice(o,label){
  for(const k in (o.fx||{})) S.bars[k]=clamp(S.bars[k]+o.fx[k],0,10);
  if(!o.ok) S.mistakes.push({where:label, why:o.why});

function complete(id, ok){
  if(id in S.results) return;

  const n = Object.keys(S.results).length;
  if(n===4 && !S.firedEvents.nepa){ S.firedEvents.nepa=1; setTimeout(()=>fireEvent('nepa'),1500); }
  if(n===8 && !S.firedEvents.rain){ S.firedEvents.rain=1; setTimeout(()=>fireEvent('rain'),1500); }

function fireEvent(k){

// ================== COLLISION ==================
function solids(){
  const s = BUILD.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h}));
  s.push({x:FENCE.l-10,y:FENCE.t-10,w:FENCE.r-FENCE.l+20,h:10});
  s.push({x:FENCE.l-10,y:FENCE.t,w:10,h:FENCE.b-FENCE.t});
  s.push({x:FENCE.r,y:FENCE.t,w:10,h:FENCE.b-FENCE.t});
  s.push({x:FENCE.l-10,y:FENCE.b,w:FENCE.gateL-FENCE.l+10,h:10});
  s.push({x:FENCE.gateR,y:FENCE.b,w:FENCE.r-FENCE.gateR+10,h:10});
  if(!S.gateOpen) s.push({x:FENCE.gateL,y:FENCE.b-2,w:FENCE.gateR-FENCE.gateL,h:12});
  s.push({x:1400,y:80,w:140,h:220}); // tank bund
  s.push(TRUCK); PARKED.forEach(c=>s.push(c));
  s.push({x:0,y:H-4,w:W,h:4}); s.push({x:0,y:0,w:4,h:H}); s.push({x:W-4,y:0,w:4,h:H});
  return s;
}
function blocked(x,y,r,sol){
  for(const b of sol){
    const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h);
    if((x-cx)**2+(y-cy)**2 < r*r) return true;
  }
  return false;
}

// ================== UPDATE ==================
function update(dt){
  S.t += dt;
  const p=S.p, sol=solids();
  let vx=0, vy=0;
  if(keys.ArrowLeft||keys.KeyA) vx-=1; if(keys.ArrowRight||keys.KeyD) vx+=1;
  if(keys.ArrowUp||keys.KeyW) vy-=1; if(keys.ArrowDown||keys.KeyS) vy+=1;
  if(joy && joy.active){ vx=joy.dx; vy=joy.dy; }
  const len=Math.hypot(vx,vy);
  if(len>0.1){
    const sp = 190*(len>1?1/len:1);
    vx*=sp; vy*=sp;
    const r=13;
    if(!blocked(p.x+vx*dt,p.y,r,sol)) p.x+=vx*dt;
    if(!blocked(p.x,p.y+vy*dt,r,sol)) p.y+=vy*dt;
    p.x=clamp(p.x,10,W-10); p.y=clamp(p.y,10,H-10);
    p.dir=Math.atan2(vy,vx); p.step+=dt*10;
  }

  // forklift
  const f=S.forklift, inLane = p.y>LANE.y1-6 && p.y<LANE.y2+6 && p.x>LANE.x1 && p.x<LANE.x2;
  const onCross = CROSS.some(c=>p.x>c.x1-4 && p.x<c.x2+4);
  const ahead = (p.x-f.x)*f.dir;
  f.stop = inLane && ahead>0 && ahead<170;
  if(!f.stop){ f.x+=f.dir*150*dt; if(f.x>LANE.x2-60){f.dir=-1;} if(f.x<LANE.x1+60){f.dir=1;} }
  if(inLane && !onCross && !('forklift' in S.results)){
    complete('forklift',false); S.mistakes.push({where:'Forklift Lane',why:'You cut across the forklift lane. Only cross at the zebra crossing, where drivers expect people.'});
    S.bars.site=clamp(S.bars.site-1,0,10); toast('⚠️ You are in the forklift lane! Only cross at the zebra crossing.','bad'); buzz();
  }
  if(inLane && onCross && !('forklift' in S.results)){
    complete('forklift',true); toast('✅ Nice. You used the zebra crossing and the forklift stopped for you.'); chime();
  }
  if(inLane && Math.abs(p.x-f.x)<44 && Math.abs(p.y-440)<44 && !onCross && S.t-S.lastHit>2){
    S.lastHit=S.t; S.bars.health=clamp(S.bars.health-4,0,10); toast('💥 The forklift hit you! Health −4. The driver could not see you.','bad'); buzz();
    S.mistakes.push({where:'Forklift Lane',why:'You were hit by a forklift. Stay on walkways and only cross at the zebra crossing.'});
    p.y = p.y<440 ? LANE.y1-20 : LANE.y2+20;
  }

  // reversing van in car park
  const v=S.van;
  if(v.wait>0) v.wait-=dt; else { v.y += v.dir*55*dt; if(v.y<900){v.dir=1;v.wait=2;} if(v.y>1050){v.dir=-1;v.wait=2;} }
  const reversing = v.dir<0 && v.wait<=0;
  if(reversing && Math.floor(S.t*2)%2===0 && Math.floor((S.t-dt)*2)%2!==0 && dist(p.x,p.y,1360,v.y)<380) beep(1150,.08,'square',.03);
  if(!('carpark' in S.results) && dist(p.x,p.y,1360,v.y-40)<130){
    scenario(SC.carpark,'Car Park',o=>complete('carpark',o.ok));
  }
  // muster first visit
  const inMuster = dist(p.x,p.y,MUSTER.x,MUSTER.y)<MUSTER.r;
  if(!('muster' in S.results) && inMuster && !S.alarm){ scenario(SC.muster,'Muster Point',o=>complete('muster',o.ok)); }

  // workshop noise
  if(dist(p.x,p.y,NOISE.x,NOISE.y)<NOISE.r && !S.alarm){
    if(!p.ppe){ S.bars.hearing=clamp(S.bars.hearing-0.6*dt,0,10); if(S.t-S.noiseToastAt>6){S.noiseToastAt=S.t; toast('🔊 Too loud! No ear plugs. Your hearing is being damaged.','warn');} }
  }

  // events timers
  if(S.nepa>0) S.nepa-=dt;
  if(S.rain>0){ S.rain-=dt; for(let i=0;i<6;i++) S.rainDrops.push({x:Math.random(),y:0,s:0.6+Math.random()*0.6}); }
  S.rainDrops.forEach(d=>d.y+=dt*d.s*1.6); S.rainDrops=S.rainDrops.filter(d=>d.y<1);

  // alarm
  if(S.alarm && !S.alarm.done){
    S.alarm.left-=dt; S.smokeR+=dt*9;
    if(Math.floor(S.t*1.5)%2===0) beep(Math.floor(S.t*1.5)%4<2?900:700,.05,'square',.02);
    if(dist(p.x,p.y,1030,200)<S.smokeR){ S.bars.lungs=clamp(S.bars.lungs-1.4*dt,0,10); if(S.t-S.smokeToastAt>4){S.smokeToastAt=S.t; toast('😷 Smoke! Move away. Stay low and keep going.','bad');} }
    S.workers.forEach(w=>{ const a=Math.atan2(MUSTER.y-w.y,MUSTER.x-w.x); if(dist(w.x,w.y,MUSTER.x,MUSTER.y)>30){ w.x+=Math.cos(a)*80*dt; w.y+=Math.sin(a)*80*dt; } });
    $('timer').textContent='🚨 '+Math.max(0,Math.ceil(S.alarm.left))+'s';
    if(inMuster){ S.alarm.done=true; toast('✅ You made it to the Muster Point! The fire warden has counted you.'); endGame(); return; }
    if(S.alarm.left<=0){ S.mistakes.push({where:'Fire alarm',why:'You did not reach the muster point in time. Know your route before you need it.'}); endGame(); return; }
  }

  if(S.bars.health<=0 && !S.fatal){ S.fatal='Your health reached zero.'; endGame(); return; }
  if(S.bars.lungs<=0 && !S.fatal){ S.fatal='You collapsed from breathing smoke or fumes.'; endGame(); return; }

  // prompt
  const near = interactables().filter(i=>dist(p.x,p.y,i.x,i.y)<i.r).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y))[0];
  S.near = near;
  if(near){ $('prompt').textContent=`${near.name}`; $('prompt').classList.remove('hidden'); $('act').textContent=near.label; $('act').disabled=false; }
  else { $('prompt').classList.add('hidden'); $('act').textContent='E'; $('act').disabled=true; }
}

  cx.fillStyle='#f1c40f'; cx.fillRect(LANE.x1,LANE.y1,LANE.x2-LANE.x1,4); cx.fillRect(LANE.x1,LANE.y2-4,LANE.x2-LANE.x1,4);
  cx.fillStyle='rgba(255,255,255,.75)'; cx.font='bold 14px system-ui';
  for(let x=LANE.x1+120;x<LANE.x2;x+=300){ cx.fillText('FORKLIFTS ONLY ⇄',x,446); }
  CROSS.forEach(c=>{ cx.fillStyle='#fff'; for(let y=LANE.y1+6;y<LANE.y2-6;y+=12) cx.fillRect(c.x1,y,c.x2-c.x1,6); });
  // loading bay & car park
  cx.fillStyle='#b7b2a5'; cx.fillRect(580,790,380,200);
  cx.strokeStyle='#f1c40f'; cx.lineWidth=3; for(let x=600;x<960;x+=90){cx.beginPath();cx.moveTo(x,790);cx.lineTo(x,980);cx.stroke();}
  cx.fillStyle='#333'; cx.font='bold 14px system-ui'; cx.fillText('LOADING BAY',590,980);
  cx.fillStyle='#8d8d8d'; cx.fillRect(1020,820,380,320);
  cx.strokeStyle='#fff'; cx.lineWidth=2; for(let x=1030;x<1400;x+=100){cx.strokeRect(x,1080,80,56);}
  cx.fillStyle='#fff'; cx.fillText('🅿 CAR PARK',1030,845);
  // puddle in rain
  if(S.rain>0){ cx.fillStyle='rgba(70,120,190,.55)'; cx.beginPath(); cx.ellipse(1085,520,120,26,0,0,7); cx.fill(); cx.beginPath(); cx.ellipse(700,1010,90,20,0,0,7); cx.fill(); }
  // buildings
  for(const b of BUILD){
    cx.fillStyle='rgba(0,0,0,.25)'; cx.fillRect(b.x+6,b.y+8,b.w,b.h);
    cx.fillStyle=b.c; cx.fillRect(b.x,b.y,b.w,b.h);
    cx.fillStyle='rgba(255,255,255,.12)'; cx.fillRect(b.x,b.y,b.w,b.h*0.35);
    cx.strokeStyle='rgba(0,0,0,.35)'; cx.lineWidth=3; cx.strokeRect(b.x,b.y,b.w,b.h);
    cx.textAlign='center'; cx.font=`${Math.min(42,b.h*0.35)}px ${EMOJI}`; cx.fillText(b.ic,b.x+b.w/2,b.y+b.h/2);
    cx.font='bold 14px system-ui'; cx.fillStyle='#fff'; cx.fillText(b.name,b.x+b.w/2,b.y+b.h/2+26);
    if(b.door){ cx.fillStyle='#3b2a1a'; const d=b.door; if(d.y<b.y) cx.fillRect(d.x-18,b.y-2,36,6); else if(d.y>b.y+b.h) cx.fillRect(d.x-18,b.y+b.h-4,36,6); else cx.fillRect(b.x-4,d.y-18,6,36); }
  }
  // workshop noise ring
  if(!S.alarm){ cx.strokeStyle='rgba(230,90,30,.35)'; cx.setLineDash([8,8]); cx.lineWidth=2; cx.beginPath(); cx.arc(NOISE.x,NOISE.y,NOISE.r,0,7); cx.stroke(); cx.setLineDash([]);
    cx.font='bold 12px system-ui'; cx.fillStyle='#b4410e'; cx.fillText('🔊 NOISE AREA – EAR PROTECTION',NOISE.x,NOISE.y+NOISE.r-130); }
  // diesel tanks
  cx.strokeStyle='#8a1'; cx.lineWidth=4; cx.strokeRect(1400,80,140,220);
  TANKS.forEach(t=>{ cx.fillStyle='#e9e9e9'; cx.beginPath(); cx.arc(t.x,t.y,t.r,0,7); cx.fill(); cx.strokeStyle='#999'; cx.lineWidth=3; cx.stroke(); cx.fillStyle='#c0392b'; cx.font='bold 11px system-ui'; cx.textAlign='center'; cx.fillText('DIESEL',t.x,t.y+4); });
  cx.font=`20px ${EMOJI}`; cx.fillText('🚭',1470,320);
  // truck at bay
  cx.fillStyle='#e8e8e8'; cx.fillRect(TRUCK.x,TRUCK.y,TRUCK.w-50,TRUCK.h); cx.fillStyle='#2e86c1'; cx.fillRect(TRUCK.x+TRUCK.w-50,TRUCK.y+8,50,TRUCK.h-16);
  cx.strokeStyle='#555'; cx.strokeRect(TRUCK.x,TRUCK.y,TRUCK.w,TRUCK.h);
  PARKED.forEach(c=>{ cx.fillStyle=c.c; cx.fillRect(c.x,c.y,c.w,c.h); cx.strokeStyle='#222'; cx.strokeRect(c.x,c.y,c.w,c.h); });
  // van
  const v=S.van; cx.fillStyle='#f5f5f5'; cx.fillRect(1335,v.y-80,50,90); cx.fillStyle='#4a90d9'; cx.fillRect(1338,v.y+0,44,10);
  cx.strokeStyle='#333'; cx.strokeRect(1335,v.y-80,50,90);
  if(v.dir<0 && v.wait<=0){ cx.fillStyle='rgba(255,60,60,.18)'; cx.fillRect(1335,v.y-200,50,120); cx.fillStyle='#c0392b'; cx.font='bold 12px system-ui'; cx.textAlign='center'; cx.fillText('BEEP! REVERSING',1360,v.y-90); }
  // muster
  cx.fillStyle='rgba(39,174,96,.35)'; cx.beginPath(); cx.arc(MUSTER.x,MUSTER.y,MUSTER.r,0,7); cx.fill();
  cx.strokeStyle='#1e8e3e'; cx.lineWidth=4; cx.stroke();
  cx.fillStyle='#145c2a'; cx.font='bold 13px system-ui'; cx.textAlign='center'; cx.fillText('MUSTER',MUSTER.x,MUSTER.y-2); cx.fillText('POINT',MUSTER.x,MUSTER.y+14);
  // gate & barrier
  cx.fillStyle='#777'; cx.fillRect(FENCE.l-6,FENCE.t-6,FENCE.r-FENCE.l+12,6); cx.fillRect(FENCE.l-6,FENCE.t,6,FENCE.b-FENCE.t);
  cx.fillRect(FENCE.r,FENCE.t,6,FENCE.b-FENCE.t); cx.fillRect(FENCE.l-6,FENCE.b,FENCE.gateL-FENCE.l+6,6); cx.fillRect(FENCE.gateR,FENCE.b,FENCE.r-FENCE.gateR+6,6);
  if(!S.gateOpen){ for(let x=FENCE.gateL;x<FENCE.gateR;x+=20){ cx.fillStyle=(x/20)%2?'#d22':'#fff'; cx.fillRect(x,FENCE.b,20,8);} }
  else { cx.fillStyle='#d22'; cx.fillRect(FENCE.gateL-4,FENCE.b-110,8,110); }
  cx.fillStyle='#fff'; cx.font='bold 13px system-ui'; cx.textAlign='center'; cx.fillText('MAIN GATE – ACME MFG, IKEJA',160,FENCE.b+36);
  // trees
  for(let x=70;x<FENCE.r;x+=140){ if(x>70&&x<260) continue; cx.fillStyle='#3f7d32'; cx.beginPath(); cx.arc(x,FENCE.b+48,16,0,7); cx.fill(); }
  // items
  for(const it of S.items){
    cx.fillStyle = it.done==='tag'?'rgba(220,40,40,.5)':it.done?'rgba(80,160,80,.35)':'rgba(255,255,255,.55)';
    cx.beginPath(); cx.arc(it.x,it.y,17,0,7); cx.fill();
    cx.font=`22px ${EMOJI}`; cx.textAlign='center'; cx.textBaseline='middle'; cx.fillText(it.e,it.x,it.y+1); cx.textBaseline='alphabetic';
    if(it.done==='tag'){ cx.font='bold 10px system-ui'; cx.fillStyle='#b00'; cx.fillText('TAGGED',it.x,it.y+28); }
  }
  // zone markers
  const bounce=Math.sin(S.t*4)*4;
  for(const z of ZONES){
    if(!z.r || (z.id in S.results)) continue;
    cx.fillStyle='#ffd400'; cx.beginPath(); cx.arc(z.x,z.y-34+bounce,13,0,7); cx.fill(); cx.strokeStyle='#5a4500'; cx.lineWidth=2; cx.stroke();
    cx.fillStyle='#3a2c00'; cx.font='bold 17px system-ui'; cx.textAlign='center'; cx.fillText('!',z.x,z.y-28+bounce);
  }
  if(S.alarm && !S.bagDone){ cx.font=`22px ${EMOJI}`; cx.fillText('👜',430,330+bounce); }
  // forklift
  const f=S.forklift;
  cx.save(); cx.translate(f.x,440); if(f.dir<0) cx.scale(-1,1);
  cx.fillStyle='#f39c12'; cx.fillRect(-26,-18,44,36); cx.fillStyle='#333'; cx.fillRect(18,-14,6,28); cx.fillRect(24,-14,18,4); cx.fillRect(24,10,18,4);
  cx.fillStyle='#8b5a2b'; cx.fillRect(26,-10,22,20); cx.restore();
  cx.fillStyle = f.stop?'#1e8e3e':'#c0392b'; cx.font='bold 11px system-ui'; cx.textAlign='center'; cx.fillText(f.stop?'STOPPED':'FORKLIFT',f.x,416);
  // NPCs
  for(const n of NPCS){
    person(n.x,n.y,n.c,'#6b4226',{label:n.label,hat:n.hat,vest:n.label==='Fire Warden'||n.label==='Oga'});
    if(n.smoke && !('diesel' in S.results)){ cx.fillStyle='rgba(200,200,200,.6)'; cx.beginPath(); cx.arc(n.x+14,n.y-24-((S.t*20)%20),5,0,7); cx.fill(); }
  }
  S.workers.forEach(w=>person(w.x,w.y,'#777','#6b4226',{vest:true,hat:'#fff'}));
  // smoke
  if(S.alarm){ const g=cx.createRadialGradient(1030,200,10,1030,200,S.smokeR); g.addColorStop(0,'rgba(60,60,60,.85)'); g.addColorStop(1,'rgba(90,90,90,0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(1030,200,S.smokeR,0,7); cx.fill();
    cx.font=`36px ${EMOJI}`; cx.fillText('🔥',1030,150); }
  // player
  const p=S.p;
  person(p.x,p.y,profile.shirt,profile.skin,{walk:p.step,vest:p.ppe,hat:p.ppe?'#f5f5f5':null,label:profile.name});
  // overlays in screen space
  cx.setTransform(dpr,0,0,dpr,0,0);
  if(S.nepa>0){ cx.fillStyle='rgba(5,10,30,.5)'; cx.fillRect(0,0,innerWidth,innerHeight); }
  if(S.rain>0){ cx.strokeStyle='rgba(180,200,255,.6)'; cx.lineWidth=1.5; cx.beginPath(); S.rainDrops.forEach(d=>{ const x=d.x*innerWidth, y=d.y*innerHeight; cx.moveTo(x,y); cx.lineTo(x-3,y+14); }); cx.stroke(); }
  drawHUD();
}

function drawHUD(){
  $('bars').innerHTML = BARS.map(b=>{const v=S.bars[b.k]; return `<div class="b ${v<5?'low':''}" title="${b.l}">${b.n} ${Math.ceil(v)}<div class="t"><div class="f" style="width:${v*10}%"></div></div></div>`}).join('');
  const mins = 8*60 + Math.floor(S.t); const hh=String(Math.floor(mins/60)%24).padStart(2,'0'), mm=String(mins%60).padStart(2,'0');
  $('info').innerHTML = `<span>🕗 ${hh}:${mm}</span><span>✅ ${Object.keys(S.results).length}/${ZONES.length}</span><span>🔎 ${S.hazFound}/${S.hazTotal}</span>${S.p.ppe?'<span>🦺 PPE on</span>':''}`;
  const m=$('mini'), c=m.getContext('2d'), sx=m.width/W, sy=m.height/H;
  c.clearRect(0,0,m.width,m.height); c.fillStyle='#cfcabd'; c.fillRect(0,0,m.width,m.height);
  c.fillStyle='#5d5e61'; c.fillRect(LANE.x1*sx,LANE.y1*sy,(LANE.x2-LANE.x1)*sx,(LANE.y2-LANE.y1)*sy); c.fillRect(80*sx,60*sy,160*sx,(FENCE.b-60)*sy);
  BUILD.forEach(b=>{c.fillStyle=b.c; c.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);});
  c.fillStyle='#27ae60'; c.beginPath(); c.arc(MUSTER.x*sx,MUSTER.y*sy,4,0,7); c.fill();
  ZONES.forEach(z=>{ if(!z.r||(z.id in S.results)) return; c.fillStyle='#ffd400'; c.fillRect(z.x*sx-2,z.y*sy-2,4,4); });
  c.fillStyle='#e00'; c.beginPath(); c.arc(S.p.x*sx,S.p.y*sy,3.5,0,7); c.fill();
}

// ================== LOOP ==================
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(S){ if(!paused && !S.over) update(dt); draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ================== INPUT ==================
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  keys[e.code]=true;
  if((e.code==='KeyE'||e.code==='Space'||e.code==='Enter') && !paused){ e.preventDefault(); doAct(); }
  if(e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); if(paused) return;
  joy={active:true,ox:e.clientX,oy:e.clientY,dx:0,dy:0,id:e.pointerId};
  const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform='';
});
cv.addEventListener('pointermove',e=>{
  if(!joy||e.pointerId!==joy.id) return;
  let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const l=Math.hypot(dx,dy), m=50;
  if(l>m){dx=dx/l*m; dy=dy/l*m;}
  joy.dx=dx/m; joy.dy=dy/m; $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`;
});
const endJoy=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; $('joy').classList.add('hidden'); } };
cv.addEventListener('pointerup',endJoy); cv.addEventListener('pointercancel',endJoy);
$('act').onclick=doAct;
$('phoneBtn').onclick=()=>{ if(!paused) openPhone(); };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };

// ================== START ==================
function setHud(on){ ['hud','act','phoneBtn','muteBtn'].forEach(id=>$(id).classList.toggle('hidden',!on)); if(!on){$('prompt').classList.add('hidden');$('timer').classList.add('hidden');$('alarmv').classList.add('hidden');} }

function showStart(){
  setHud(false); profile.role=null; newGame(); paused=true;
  const m=openModal(`<h1 style="margin:.1em 0">🦺 Site Life</h1>
    <p class="muted">The safety induction you <b>play</b>, not a paper you tick. Walk the compound, make the right calls, spot the hazards, and survive your first shift.<br>Demo site: <i>Acme Manufacturing, Ikeja</i>.</p>
    <p><b>Your name</b></p><input id="nm" placeholder="e.g. Tunde" maxlength="16" value="${esc(profile.name)}">
    <p><b>Your look</b></p>
    <div class="row" id="shirts">${SHIRTS.map(c=>`<button class="sw ${c===profile.shirt?'on':''}" data-c="${c}" style="background:${c}" aria-label="shirt colour"></button>`).join('')}</div>
    <div class="row" id="skins" style="margin-top:6px">${SKINS.map(c=>`<button class="sw ${c===profile.skin?'on':''}" data-s="${c}" style="background:${c}" aria-label="skin tone"></button>`).join('')}</div>
    <p><b>Role lottery 🎲</b> <span class="muted">Like Lagos Life's birth lottery, you don't choose.</span></p>
    <div class="big" id="rolebox">🎲 ?</div><p class="muted" id="roletask"></p>
    <div class="row"><button id="spin">Spin role</button><button class="primary" id="start" disabled>Start shift ▶</button></div>
    <p class="muted" style="font-size:.85rem;margin-top:12px">🎮 Move: WASD / arrows, or drag anywhere on the screen. Interact: E / Space or the green button. 📱 Your phone shows your tasks.</p>`);
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{profile.shirt=b.dataset.c; m.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{profile.skin=b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelector('#spin').onclick=()=>{
    ensureAudio(); m.querySelector('#spin').disabled=true; let n=0;
    const t=setInterval(()=>{ profile.role=ROLES[Math.floor(Math.random()*ROLES.length)]; m.querySelector('#rolebox').textContent=`${profile.role.icon} ${profile.role.name}`; beep(500+n*40,.05,'square',.03);
      if(++n>12){ clearInterval(t); m.querySelector('#roletask').textContent='📱 Task: '+profile.role.task; m.querySelector('#start').disabled=false; m.querySelector('#spin').disabled=false; chime(); } },90);
  };
  m.querySelector('#start').onclick=()=>{
    profile.name=(m.querySelector('#nm').value.trim()||'Guest').slice(0,16);
    closeModal(); setHud(true);
    toast('🛵 The okada has dropped you at the Main Gate. Walk up to Security.');
    setTimeout(()=>toast('📱 Tip: tap "Tasks" to see what to do. Yellow ! marks places to visit.'),2500);
  };
}
showStart();
</script>
