<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Site Life 3D</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d1f22; --muted:#5d636b; --line:#ddd8cc;
  --brand:#0f7a4f; --brand-ink:#ffffff; --warn:#b26b00; --bad:#c0392b; --good:#1e8e3e; --chip:#f0ede5;
  --hud:rgba(255,255,255,.86);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
    --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
    --hud:rgba(25,27,30,.84);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
  --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
  --hud:rgba(25,27,30,.84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#9cc3e6}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
.hidden{display:none !important}
.muted{color:var(--muted)}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.hbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);pointer-events:auto}
#bars{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;font-size:12px;align-items:center}
.b{min-width:58px}.b .t{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}.b .f{height:100%;background:var(--good)}
.b.low .f{background:var(--bad)}
#info{font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
#mini{display:block;border-radius:8px}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.tst{background:var(--hud);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
#act{position:fixed;right:18px;bottom:22px;z-index:5;width:78px;height:78px;border-radius:50%;font-weight:800;font-size:13px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fbtn{position:fixed;z-index:5;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#phoneBtn{right:106px;bottom:30px}
#camBtn{right:106px;bottom:86px}
#autoBtn{right:106px;bottom:142px;font-size:13px}
#guideBtn{right:106px;bottom:198px;font-size:13px}
#guidePanel{position:fixed;left:50%;bottom:164px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:14px;padding:6px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#gArrow{display:inline-block;font-size:22px;color:var(--brand);transition:transform .1s linear}
@media (max-width:600px){#guidePanel{bottom:120px;font-size:13px} #prompt{bottom:166px}}
.ppe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ppe-grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;font-size:13px}
.ppe-grid button .e{font-size:30px}
.ppe-grid button.on{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--chip))}
#muteBtn{left:12px;bottom:22px;opacity:.9}
#prompt{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#joy{position:fixed;z-index:4;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.75)}
#hint{position:fixed;left:12px;bottom:76px;z-index:5;font-size:12px;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:220px}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal h2{margin:.1em 0 .4em;font-size:1.2rem}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .av{font-size:2rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--chip)}
.fb.bad{border-left-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.85rem}
.big{font-size:1.9rem;font-weight:800}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
ul.tasks{list-style:none;padding:0;margin:8px 0}
ul.tasks li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(220,30,30,.55);animation:pl .8s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 10px rgba(220,30,30,.25)}}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}}
#timer{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--bad);color:#fff;font-weight:800;border-radius:12px;padding:6px 14px;font-size:20px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);font-weight:700}
@media (max-width:600px){
  #bars{grid-template-columns:repeat(3,auto)}
  #mini{width:104px;height:82px}
  #toast{top:150px}
  #timer{top:104px}
  .tst{font-size:13px;padding:6px 10px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="loading">Loading Site Life 3D…</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div class="hbox"><div id="bars"></div><div id="info"></div></div>

</div>
<div id="toast"></div>
<div id="prompt" class="hidden"></div>

<button id="phoneBtn" class="fbtn hidden">📱 Tasks</button>
<button id="camBtn" class="fbtn hidden">👁️ View</button>
<button id="autoBtn" class="fbtn hidden">⚡ Auto: ON</button>

<div id="alarmv" class="alarmv hidden"></div>

}

const GS=20, GW=Math.ceil(W/GS), GH=Math.ceil(H/GS); let GRID=null, GRID_GATE=null;

function freeCell(cx,cy){ if(!GRID[cy*GW+cx]) return [cx,cy]; for(let r=1;r<6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const x=cx+dx,y=cy+dy; if(x>=0&&y>=0&&x<GW&&y<GH&&!GRID[y*GW+x]) return [x,y]; } return [cx,cy]; }
function findPath(sx,sy,tx,ty){
  if(!GRID||GRID_GATE!==S.gateOpen) buildGrid();
  const [ax,ay]=freeCell(clamp(Math.floor(sx/GS),0,GW-1),clamp(Math.floor(sy/GS),0,GH-1)), [bx,by]=freeCell(clamp(Math.floor(tx/GS),0,GW-1),clamp(Math.floor(ty/GS),0,GH-1));

  const push=(i,f)=>{ heap.push([f,i]); let k=heap.length-1; while(k>0){ const pk=(k-1)>>1; if(heap[pk][0]<=heap[k][0]) break; [heap[pk],heap[k]]=[heap[k],heap[pk]]; k=pk; } };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let k=0; for(;;){ const l=2*k+1,r=l+1; let m=k; if(l<heap.length&&heap[l][0]<heap[m][0]) m=l; if(r<heap.length&&heap[r][0]<heap[m][0]) m=r; if(m===k) break; [heap[m],heap[k]]=[heap[k],heap[m]]; k=m; } } return top; };
  const start=ay*GW+ax, goal=by*GW+bx; g[start]=0; push(start,h(start));

function update(dt){
  S.t += dt;

  if(keys.ArrowLeft) yaw += 2.2*dt; if(keys.ArrowRight) yaw -= 2.2*dt;
  let fwd=0, str=0;
  if(keys.KeyW||keys.ArrowUp) fwd+=1; if(keys.KeyS||keys.ArrowDown) fwd-=1;
  if(keys.KeyD) str+=1; if(keys.KeyA) str-=1;
  if(joy){ fwd=-joy.dy; str=joy.dx; }
  const fx=-Math.sin(yaw), fy=-Math.cos(yaw), rx=Math.cos(yaw), ry=-Math.sin(yaw);
  let mx=fx*fwd+rx*str, my=fy*fwd+ry*str; const len=Math.hypot(mx,my);

    const sp = 120*(len>1?1/len:1); mx*=sp; my*=sp; const r=13;
    if(!blocked(p.x+mx*dt,p.y,r,sol)) p.x+=mx*dt;
    if(!blocked(p.x,p.y+my*dt,r,sol)) p.y+=my*dt;
    p.x=clamp(p.x,10,W-10); p.y=clamp(p.y,10,H-10);

  }

  const f=S.forklift, inLane = p.y>LANE.y1-6 && p.y<LANE.y2+6 && p.x>LANE.x1 && p.x<LANE.x2;

  const ahead = (p.x-f.x)*f.dir;
  f.stop = inLane && ahead>0 && ahead<170;
  if(!f.stop){ f.x+=f.dir*110*dt; if(f.x>LANE.x2-60) f.dir=-1; if(f.x<LANE.x1+60) f.dir=1; }
  if(inLane && !onCross && !('forklift' in S.results)){
    complete('forklift',false); S.mistakes.push({where:'Forklift Lane',why:'You cut across the forklift lane. Only cross at the zebra crossing, where drivers expect people.'});
    S.bars.site=clamp(S.bars.site-1,0,10); toast('⚠️ You are in the forklift lane! Only cross at the zebra crossing.','bad'); buzz();
  }

  if(inLane && Math.abs(p.x-f.x)<44 && Math.abs(p.y-440)<44 && !onCross && S.t-S.lastHit>2){
    S.lastHit=S.t; S.bars.health=clamp(S.bars.health-4,0,10); toast('💥 The forklift hit you! Health −4. The driver could not see you.','bad'); buzz(); G.shake=0.6;
    S.mistakes.push({where:'Forklift Lane',why:'You were hit by a forklift. Stay on walkways and only cross at the zebra crossing.'});
    p.y = p.y<440 ? LANE.y1-20 : LANE.y2+20;
  }

  const v=S.van;
  if(v.wait>0) v.wait-=dt; else { v.y += v.dir*45*dt; if(v.y<900){v.dir=1;v.wait=2;} if(v.y>1050){v.dir=-1;v.wait=2;} }
  const reversing = v.dir<0 && v.wait<=0;
  if(reversing && Math.floor(S.t*2)%2===0 && Math.floor((S.t-dt)*2)%2!==0 && dist(p.x,p.y,1360,v.y)<380) beep(1150,.08,'square',.03);
  if(!('carpark' in S.results) && dist(p.x,p.y,1360,v.y-40)<130) scenario(SC.carpark,'Car Park',o=>complete('carpark',o.ok));
  const inMuster = dist(p.x,p.y,MUSTER.x,MUSTER.y)<MUSTER.r;

  const pp=p.ppe, hit=(k,cond,fx,msg)=>{ if(cond && !S.ppeHit[k] && ('reception' in S.results)){ S.ppeHit[k]=1; for(const b in fx) S.bars[b]=clamp(S.bars[b]+fx[b],0,10); S.mistakes.push({where:'Missing PPE',why:msg}); toast('💥 '+msg,'bad'); buzz(); G.shake=.4; } };
  hit('eyes', !pp.goggles && dist(p.x,p.y,1030,300)<140, {eyes:-3}, 'A grinding spark flew into your eye at the Workshop. You had no safety goggles.');
  hit('head', !pp.hat && dist(p.x,p.y,770,524)<120, {health:-3}, 'A carton fell from the top rack onto your head at the Warehouse. You had no hard hat.');

  hit('vest', !pp.vest && Math.abs(p.x-S.forklift.x)<180 && p.y>340 && p.y<540, {health:-1,site:-1}, 'The forklift driver nearly hit you. Without a hi-vis vest he could not see you.');

    $('timer').textContent='🚨 '+Math.max(0,Math.ceil(S.alarm.left))+'s';
    if(inMuster){ S.alarm.done=true; toast('✅ You made it to the Muster Point! The fire warden has counted you.'); endGame(); return; }

  guideUpdate(dt);
  const near = interactables().filter(i=>dist(p.x,p.y,i.x,i.y)<i.r).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y))[0];

}

function mergeGeos(list){
  let vC=0,iC=0; for(const {geo} of list){ vC+=geo.attributes.position.count; iC+=geo.index?geo.index.count:geo.attributes.position.count; }
  const pos=new Float32Array(vC*3), nor=new Float32Array(vC*3), uv=new Float32Array(vC*2), idx=new Uint32Array(iC);
  let vo=0, io=0; const v=new THREE.Vector3(), nm=new THREE.Matrix3();
  for(const {geo,matrix} of list){ const P=geo.attributes.position, N=geo.attributes.normal, U=geo.attributes.uv; nm.getNormalMatrix(matrix);
    for(let i=0;i<P.count;i++){ v.fromBufferAttribute(P,i).applyMatrix4(matrix); pos[(vo+i)*3]=v.x; pos[(vo+i)*3+1]=v.y; pos[(vo+i)*3+2]=v.z;
      if(N){ v.fromBufferAttribute(N,i).applyMatrix3(nm).normalize(); nor[(vo+i)*3]=v.x; nor[(vo+i)*3+1]=v.y; nor[(vo+i)*3+2]=v.z; }
      if(U){ uv[(vo+i)*2]=U.getX(i); uv[(vo+i)*2+1]=U.getY(i); } }
    if(geo.index){ for(let i=0;i<geo.index.count;i++) idx[io+i]=geo.index.getX(i)+vo; io+=geo.index.count; } else { for(let i=0;i<P.count;i++) idx[io+i]=vo+i; io+=P.count; }
    vo+=P.count; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeBoundingSphere(); return g;
}
function consolidate(root){
  const groups=[]; root.traverse(o=>{ if(o.children && o.children.length) groups.push(o); });
  for(const grp of groups){
    const buckets=new Map();
    for(const c of grp.children.slice()){ if(!c.isMesh || c.isInstancedMesh || c.children.length || c.userData.keep || Array.isArray(c.material)) continue; const k=c.material.uuid; if(!buckets.has(k)) buckets.set(k,[]); buckets.get(k).push(c); }
    for(const arr of buckets.values()){ if(arr.length<2) continue; arr.forEach(m=>m.updateMatrix());
      const nmsh=new THREE.Mesh(mergeGeos(arr.map(m=>({geo:m.geometry,matrix:m.matrix}))),arr[0].material); nmsh.castShadow=arr.some(m=>m.castShadow); nmsh.receiveShadow=true; arr.forEach(m=>grp.remove(m)); grp.add(nmsh); }

  const {camera}=G; const a=t*0.05; const cxp=X(W/2), czp=Z(H/2);
  camera.position.set(cxp+Math.sin(a)*52, 24, czp+Math.cos(a)*44); camera.lookAt(cxp,0,czp);
  G.sun.position.set(cxp+30,60,czp+20); G.sun.target.position.set(cxp,0,czp);
  G.player.visible=false; G.npcs.forEach(({g},i)=>animHuman(g,0,false,t+i));
  G.renderer.render(G.scene,camera);
}

function drawHUD(){
  $('bars').innerHTML = BARS.map(b=>{const v=S.bars[b.k]; return `<div class="b ${v<5?'low':''}" title="${b.l}">${b.n} ${Math.ceil(v)}<div class="t"><div class="f" style="width:${v*10}%"></div></div></div>`}).join('');
  const mins = 8*60 + Math.floor(S.t); const hh=String(Math.floor(mins/60)%24).padStart(2,'0'), mm=String(mins%60).padStart(2,'0');
  $('info').innerHTML = `<span>🕗 ${hh}:${mm}</span><span>✅ ${Object.keys(S.results).length}/${ZONES.length}</span><span>🔎 ${S.hazFound}/${S.hazTotal}</span>${PPE_ITEMS.filter(i=>!i.bad&&S.p.ppe[i.k]).map(i=>i.e).join('')?'<span>PPE: '+PPE_ITEMS.filter(i=>!i.bad&&S.p.ppe[i.k]).map(i=>i.e).join(' ')+'</span>':''}`;
  const m=$('mini'), c=m.getContext('2d'), sx=m.width/W, sy=m.height/H;
  c.fillStyle='#cfcabd'; c.fillRect(0,0,m.width,m.height);
  c.fillStyle='#5d5e61'; c.fillRect(LANE.x1*sx,LANE.y1*sy,(LANE.x2-LANE.x1)*sx,(LANE.y2-LANE.y1)*sy); c.fillRect(80*sx,60*sy,160*sx,(FENCE.b-60)*sy);
  BUILD.forEach(b=>{c.fillStyle=b.c; c.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);});
  c.fillStyle='#27ae60'; c.beginPath(); c.arc(MUSTER.x*sx,MUSTER.y*sy,4,0,7); c.fill();
  ZONES.forEach(z=>{ if(!z.r||(z.id in S.results)) return; c.fillStyle='#e0b800'; c.fillRect(z.x*sx-2,z.y*sy-2,4,4); });
  if(S.guide&&S.guide.path&&guideOn){ c.strokeStyle='#0f7a4f'; c.lineWidth=2; c.setLineDash([3,2]); c.beginPath(); S.guide.path.forEach(([x,y],i)=>i?c.lineTo(x*sx,y*sy):c.moveTo(x*sx,y*sy)); c.stroke(); c.setLineDash([]); const T=S.guide.target; if(T){ c.fillStyle='#0f7a4f'; c.beginPath(); c.arc(T.x*sx,T.y*sy,4,0,7); c.fill(); } }
  const gp=$('guidePanel'), T=S.guide&&S.guide.target; if(guideOn&&T&&S.guide.path&&started&&!S.over){ gp.classList.remove('hidden'); const pth=S.guide.path, nx=pth[Math.min(3,pth.length-1)]; const dx=nx[0]-S.p.x, dy=nx[1]-S.p.y, fx=-Math.sin(yaw), fy=-Math.cos(yaw); const ang=Math.atan2(fx*dy-fy*dx, fx*dx+fy*dy); $('gArrow').style.transform=`rotate(${ang}rad)`; $('gText').textContent=`Next: ${T.name} · ${Math.max(1,Math.round(pathLen(pth)*K))} m`; } else gp.classList.add('hidden');
  const px=S.p.x*sx, py=S.p.y*sy; c.fillStyle='#e00'; c.beginPath(); c.moveTo(px-Math.sin(yaw)*7,py-Math.cos(yaw)*7); c.lineTo(px+Math.cos(yaw)*3.5,py-Math.sin(yaw)*3.5); c.lineTo(px-Math.cos(yaw)*3.5,py+Math.sin(yaw)*3.5); c.fill();
}

// ================== LOOP ==================
let last=performance.now(), hudT=0, started=false;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G && S){
    if(!started) renderIntro(now/1000);
    else { if(!paused && !S.over) update(dt); render3D(dt); hudT+=dt; if(hudT>0.12){hudT=0; drawHUD();} }
  }
  requestAnimationFrame(loop);
}

// ================== INPUT ==================
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(paused) return;
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doAct(); }
  if(e.code==='KeyV') toggleCam();
  if(e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
const cv=$('game');
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); if(paused||!started) return;
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType!=='mouse' && e.clientX < innerWidth*0.5 && !joy){
    joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};
    const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform='';
  } else if(!look) look={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(joy && e.pointerId===joy.id){ let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const l=Math.hypot(dx,dy), m=50; if(l>m){dx=dx/l*m; dy=dy/l*m;}
    joy.dx=dx/m; joy.dy=dy/m; $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`; }
  else if(look && e.pointerId===look.id){ yaw -= (e.clientX-look.x)*0.006; pitch = clamp(pitch+(e.clientY-look.y)*0.004,-0.35,1.0); look.x=e.clientX; look.y=e.clientY; }
});
const endPtr=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; $('joy').classList.add('hidden'); } if(look&&e.pointerId===look.id) look=null; };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function toggleCam(){ firstPerson=!firstPerson; toast(firstPerson?'👁️ First-person view: you are seeing through your own eyes.':'🎥 Third-person view'); }
$('act').onclick=doAct;
$('phoneBtn').onclick=()=>{ if(!paused) openPhone(); };
$('camBtn').onclick=()=>{ if(!paused) toggleCam(); };
$('guideBtn').onclick=()=>{ guideOn=!guideOn; guidePick=null; $('guideBtn').textContent='🧭 Guide: '+(guideOn?'ON':'OFF'); toast(guideOn?'🧭 Your HSE escort will lead you to the next task.':'Guide off. Explore on your own. Use 📱 Tasks if you get lost.'); };
$('autoBtn').onclick=()=>{ autoQ=!autoQ; $('autoBtn').textContent='⚡ Auto: '+(autoQ?'ON':'OFF'); toast(autoQ?'⚡ Questions now pop up automatically when you reach a place.':'Auto off. Press the green button to talk.'); };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };

// ================== START ==================
function setHud(on){ ['hud','act','phoneBtn','camBtn','autoBtn','guideBtn','muteBtn','hint'].forEach(id=>$(id).classList.toggle('hidden',!on)); if(!on){$('guidePanel').classList.add('hidden');$('prompt').classList.add('hidden');$('timer').classList.add('hidden');$('alarmv').classList.add('hidden');} }
function showStart(){
  setHud(false); started=false; profile.role=null; newGame(); paused=true;
  const m=openModal(`<h1 style="margin:.1em 0">🦺 Site Life 3D</h1>
    <p class="muted">The safety induction you <b>play</b>, not a paper you tick. Walk the compound, make the right calls, spot the hazards, and survive your first shift.<br>Demo site: <i>Acme Manufacturing, Ikeja</i>.</p>
    <p><b>Your name</b></p><input id="nm" placeholder="e.g. Tunde" maxlength="16" value="${esc(profile.name)}">
    <p><b>Your character</b></p>
    <div class="row" id="sex"><button data-x="m" class="${profile.sex==='m'?'primary':''}">👨🏾 Man</button><button data-x="f" class="${profile.sex==='f'?'primary':''}">👩🏾 Woman</button></div>
    <p class="muted" style="margin:.6em 0 .3em">Shirt colour and skin tone</p>
    <div class="row">${SHIRTS.map(c=>`<button class="sw ${c===profile.shirt?'on':''}" data-c="${c}" style="background:${c}" aria-label="shirt colour"></button>`).join('')}</div>
    <div class="row" style="margin-top:6px">${SKINS.map(c=>`<button class="sw ${c===profile.skin?'on':''}" data-s="${c}" style="background:${c}" aria-label="skin tone"></button>`).join('')}</div>
    <p><b>Role lottery 🎲</b> <span class="muted">Like Lagos Life's birth lottery, you don't choose.</span></p>
    <div class="big" id="rolebox">🎲 ?</div><p class="muted" id="roletask"></p>
    <div class="row"><button id="spin">Spin role</button><button class="primary" id="start" disabled>Start shift ▶</button></div>
    <p class="muted" style="font-size:.85rem;margin-top:12px">🎮 <b>Computer:</b> WASD to walk, drag the mouse to look, E to interact, V to switch first/third person.<br>📱 <b>Phone:</b> drag the left side of the screen to walk, drag the right side to look, and tap the green button to interact.</p>`);
  m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{profile.sex=b.dataset.x; m.querySelectorAll('[data-x]').forEach(x=>x.classList.toggle('primary',x===b));});
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{profile.shirt=b.dataset.c; m.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{profile.skin=b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelector('#spin').onclick=()=>{
    ensureAudio(); m.querySelector('#spin').disabled=true; let n=0;
    const t=setInterval(()=>{ profile.role=ROLES[Math.floor(Math.random()*ROLES.length)]; m.querySelector('#rolebox').textContent=`${profile.role.icon} ${profile.role.name}`; beep(500+n*40,.05,'square',.03);
      if(++n>12){ clearInterval(t); m.querySelector('#roletask').textContent='📱 Task: '+profile.role.task; m.querySelector('#start').disabled=false; m.querySelector('#spin').disabled=false; chime(); } },90);
  };
  m.querySelector('#start').onclick=()=>{
    profile.name=(m.querySelector('#nm').value.trim()||'Guest').slice(0,16);
    G.resetDynamic(); started=true; closeModal(); setHud(true);
    toast('🛵 The okada has dropped you at the Main Gate. Your HSE Escort will show you round. Follow the arrows.');
    setTimeout(()=>toast('📱 Tap "Tasks" to see what to do. Follow the yellow ! markers.'),2600);
  };
}

window.addEventListener('load',()=>{
  if(!window.THREE){ $('loading').innerHTML='Could not load the 3D engine. Check your internet connection, or play the <a href="lite.html">2D version</a>.'; return; }
  try{ newGame(); initThree(); }catch(err){ $('loading').innerHTML='Your device could not start 3D. Try the <a href="lite.html">2D version</a>.'; console.error(err); return; }
  $('loading').remove();
  showStart();
  requestAnimationFrame(loop);
});
</script>
