<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Site Life 3D</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d1f22; --muted:#5d636b; --line:#ddd8cc;
  --brand:#0f7a4f; --brand-ink:#ffffff; --warn:#b26b00; --bad:#c0392b; --good:#1e8e3e; --chip:#f0ede5;
  --hud:rgba(255,255,255,.86);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
    --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
    --hud:rgba(25,27,30,.84);
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1f2226; --ink:#eceae5; --muted:#a2a8b0; --line:#343940;
  --brand:#2fb57c; --brand-ink:#0b1a12; --warn:#f0a63a; --bad:#ff6b5e; --good:#4cc76d; --chip:#2a2e33;
  --hud:rgba(25,27,30,.84);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#9cc3e6}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:10px 14px}
button.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
.hidden{display:none !important}
.muted{color:var(--muted)}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.hbox{background:var(--hud);border:1px solid var(--line);border-radius:12px;padding:8px 10px;backdrop-filter:blur(4px);pointer-events:auto}
#bars{display:grid;grid-template-columns:repeat(5,auto);gap:4px 10px;font-size:12px;align-items:center}
.b{min-width:58px}.b .t{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}.b .f{height:100%;background:var(--good)}
.b.low .f{background:var(--bad)}
#info{font-size:12px;margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
#mini{display:block;border-radius:8px}
#toast{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.tst{background:var(--hud);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:10px;padding:8px 12px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tst.bad{border-left-color:var(--bad)}.tst.warn{border-left-color:var(--warn)}
#act{position:fixed;right:18px;bottom:22px;z-index:5;width:78px;height:78px;border-radius:50%;font-weight:800;font-size:13px;background:var(--brand);color:var(--brand-ink);border:none;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fbtn{position:fixed;z-index:5;border-radius:14px;padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#phoneBtn{right:106px;bottom:30px}
#camBtn{right:106px;bottom:86px}
#muteBtn{left:12px;bottom:22px;opacity:.9}
#prompt{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:5;background:var(--hud);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#joy{position:fixed;z-index:4;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.15);pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:rgba(255,255,255,.75)}
#hint{position:fixed;left:12px;bottom:76px;z-index:5;font-size:12px;background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:220px}
.ov{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal h2{margin:.1em 0 .4em;font-size:1.2rem}
.who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.who .av{font-size:2rem}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opts button{text-align:left}
.fb{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid var(--good);background:var(--chip)}
.fb.bad{border-left-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.85rem}
.big{font-size:1.9rem;font-weight:800}
.sw{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
ul.tasks{list-style:none;padding:0;margin:8px 0}
ul.tasks li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.alarmv{position:fixed;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 120px 40px rgba(220,30,30,.55);animation:pl .8s infinite}
@keyframes pl{50%{box-shadow:inset 0 0 60px 10px rgba(220,30,30,.25)}}
@media (prefers-reduced-motion: reduce){.alarmv{animation:none}}
#timer{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:6;background:var(--bad);color:#fff;font-weight:800;border-radius:12px;padding:6px 14px;font-size:20px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);font-weight:700}
@media (max-width:600px){
  #bars{grid-template-columns:repeat(3,auto)}
  #mini{width:104px;height:82px}
  #toast{top:150px}
  #timer{top:104px}
  .tst{font-size:13px;padding:6px 10px}
  #hint{display:none}
}
</style>
</head>
<body>
<div id="loading">Loading Site Life 3D…</div>
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div class="hbox"><div id="bars"></div><div id="info"></div></div>
  <div class="hbox" style="padding:5px"><canvas id="mini" width="150" height="118"></canvas></div>
</div>
<div id="toast"></div>
<div id="prompt" class="hidden"></div>
<div id="joy" class="hidden"><i></i></div>
<div id="hint" class="hidden">🎮 <b>WASD</b> move · <b>drag mouse</b> or <b>← →</b> look · <b>E</b> interact · <b>V</b> camera</div>
<button id="act" class="hidden">E</button>
<button id="phoneBtn" class="fbtn hidden">📱 Tasks</button>
<button id="camBtn" class="fbtn hidden">👁️ View</button>
<button id="muteBtn" class="fbtn hidden">🔊</button>
<div id="timer" class="hidden"></div>
<div id="alarmv" class="alarmv hidden"></div>
<div id="ovl"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const SC = {

    o:[{t:'Thank him and walk in', ok:false, fx:{site:-2}, why:'If you never sign in, nobody will know you are on site, so the muster count misses you in a fire.'},
       {t:'Wait, sign the visitor register and collect a pass', ok:true, why:'Correct. Security controls who is inside so that everyone can be accounted for in an emergency.'}]},
  reception:{who:'💁🏾‍♀️ Receptionist', text:'"Welcome! Here are your safety boots, hi-vis vest, hard hat, goggles and ear plugs." The boots are a bit tight.',
    o:[{t:'Leave the PPE, "na only small time I go spend"', ok:false, fx:{site:-1}, ppe:false, why:'Accident no dey give notice. Without ear plugs and goggles, noisy areas will now damage your hearing.'},
       {t:'Ask for the correct size and wear everything', ok:true, ppe:true, why:'Correct. PPE only works if you wear it, and it must fit. Your character is now wearing PPE.'}]},
  admin:{who:'🏢 Admin stairs', text:'On the staircase, a cleaner has just mopped. There is no wet-floor sign and you are carrying files with both hands.',
    o:[{t:'Rush down, you are late', ok:false, fx:{health:-3}, why:'Slips, trips and falls are among the most common workplace injuries. Hold the rail.'},
       {t:'Hold the handrail, go slowly and tell the cleaner to put up a sign', ok:true, why:'Correct. You protected yourself and the next person.'}]},
  canteen:{who:'👨🏾‍🍳 Cook', text:'You smell gas near the kitchen burners. The cook is about to strike a match: "Make I light am, food don late."',
    o:[{t:'Ignore it, cooks know their work', ok:false, fx:{health:-3,site:-3}, why:'A gas leak plus a flame can cause an explosion.'},
       {t:'Shout "STOP, no fire!", don\'t touch switches, open the windows, get people out and report it', ok:true, why:'Correct. No flames or switches, ventilate, evacuate and report.'}]},
  workshop:{who:'🛠️ Workshop', text:'Someone is grinding metal. Sparks are flying and the machine is very loud. You need to pass through to the store.',

  chemical:{who:'🧪 Chemical store', text:'You find a drink bottle with clear liquid in it and no label on the chemical shelf.',

  diesel:{who:'🚬 Contractor', text:'A contractor near the diesel tanks lights a cigarette: "Diesel no dey catch fire like petrol."',
    o:[{t:'Stand with him and gist', ok:false, fx:{site:-4}, why:'Diesel vapour, spills and nearby fuels can ignite. No smoking near fuel.'},
       {t:'Ask him to put it out, show him the No Smoking sign and report it', ok:true, why:'Correct. Speaking up protects everyone on site.'}]},
  warehouse:{who:'🧔🏾 Oga (Supervisor)', text:'"Abeg climb that rack and bring the top box. No time for ladder, the customer dey wait!"',

  generator:{who:'⛽ Generator house', text:'The gen is running, the door is shut and a colleague is sleeping inside on a carton.',

    o:[{t:'Start loading, the driver knows we\'re working', ok:false, fx:{health:-4}, why:'If the driver pulls away while someone is inside, that person falls or gets crushed.'},

  electrical_default:{who:'⚡ Electrical room', text:'The door marked "DANGER – Authorised Persons Only" is open and the panel is humming. A friend says: "Come see inside."',

const EVENTS = {
  nepa:{who:'⚡ NEPA has taken light!', text:'Power is gone and the compound goes dark. Someone wants to "back-feed" the office by plugging the small gen straight into a wall socket.',
    o:[{t:'Help him plug it in', ok:false, fx:{health:-3,site:-2}, why:'Back-feeding can electrocute people working on the lines and can cause a fire.'},
       {t:'Stop him. Only the changeover switch should be used, by an electrician', ok:true, why:'Correct. Use the proper changeover.'}]},
  rain:{who:'🌧️ Heavy rain!', text:'The yard is flooding and water is moving towards the electrical room door.',
    o:[{t:'Wade through to get to the canteen faster', ok:false, fx:{health:-3}, why:'Water and electricity kill. You also cannot see open drains under flood water.'},
       {t:'Keep away, warn others and call the emergency number', ok:true, why:'Correct. Warn, keep away, report.'}]},
};
const HAZARDS = [
  {e:'🧯', t:'Fire extinguisher hidden behind cartons'}, {e:'🔌', t:'Frayed extension cable across the path'},
  {e:'🚪', t:'Fire exit blocked with pallets'}, {e:'⚙️', t:'Machine with its guard removed'},
  {e:'🧴', t:'Unlabelled chemical bottle'}, {e:'🪜', t:'Ladder with a broken rung'},
  {e:'🛢️', t:'Oil spill on the walkway'}, {e:'🔥', t:'Oily rags piled next to a hot pipe'},
];
const DECOYS = [
  {e:'🩹', t:'Stocked first-aid box'}, {e:'🗑️', t:'Waste bin with lid'}, {e:'🚿', t:'Eye-wash station'},
  {e:'📞', t:'Emergency phone'}, {e:'🪧', t:'Lit exit sign'}, {e:'🧤', t:'Gloves on a PPE rack'},
];

// ================== WORLD (map units; 1 unit = 5 cm) ==================
const W = 1600, H = 1260, K = 0.05;
const FENCE = {l:40, t:40, r:1560, b:1180, gateL:100, gateR:220};
const LANE = {x1:260, x2:1540, y1:400, y2:480};
const CROSS = [{x1:640,x2:700},{x1:1180,x2:1240}];
const NOISE = {x:1030, y:180, r:210};
const BUILD = [
  {id:'admin', name:'ADMIN', x:300,y:80,w:260,h:200, c:'#7d9cc0', ht:9, door:{x:430,y:296}},
  {id:'canteen', name:'CANTEEN', x:620,y:80,w:220,h:200, c:'#d39468', ht:5, door:{x:730,y:296}},
  {id:'workshop', name:'WORKSHOP', x:900,y:80,w:260,h:200, c:'#9a9ca3', ht:7, door:{x:1030,y:296}},
  {id:'chemical', name:'CHEM STORE', x:1220,y:80,w:150,h:160, c:'#b07cbd', ht:4, door:{x:1295,y:256}},
  {id:'reception', name:'RECEPTION', x:300,y:560,w:220,h:160, c:'#5fae88', ht:5, door:{x:284,y:640}},
  {id:'warehouse', name:'WAREHOUSE', x:580,y:540,w:380,h:240, c:'#cdb26a', ht:9, door:{x:770,y:524}},
  {id:'electrical', name:'ELECTRICAL', x:1010,y:560,w:150,h:140, c:'#ddb840', ht:4, door:{x:1085,y:544}},
  {id:'generator', name:'GEN HOUSE', x:1220,y:560,w:180,h:140, c:'#8a8a8a', ht:4.5, door:{x:1310,y:544}},

const ZONES = [
  {id:'gate', name:'Security at the Main Gate', x:160,y:1196, r:70, hint:'Talk to Security at the gate'},
  {id:'reception', name:'Reception & PPE', x:284,y:640, r:60, hint:'Collect your PPE at Reception'},

// ================== STATE ==================
let S = null, profile = {name:'', role:null, shirt:SHIRTS[0], skin:SKINS[1]};
const keys = {}; let joy = null, look = null; let paused = true; let audio = null, muted = false;
let yaw = 0, pitch = 0.25, firstPerson = false;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const dist = (a,b,c,d) => Math.hypot(a-c,b-d);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function newGame(){
  const spots = shuffle(SPOTS);
  const hz = shuffle(HAZARDS).slice(0,6), dc = shuffle(DECOYS).slice(0,4);
  const items = [...hz.map(h=>({...h,hazard:true})), ...dc.map(d=>({...d,hazard:false}))]
    .map((it,i)=>({...it, x:spots[i][0], y:spots[i][1], done:null}));
  S = {
    p:{x:160,y:1235,face:0,step:0,ppe:false,moving:false},
    bars:{health:10,lungs:10,hearing:10,eyes:10,site:10},
    results:{}, mistakes:[], badges:[], items, hazTotal:6, hazFound:0,
    t:0, forklift:{x:400,dir:1,stop:false}, van:{y:1050,dir:-1,wait:0},
    gateOpen:false, nepa:0, rain:0, firedEvents:{},
    alarm:null, smokeR:0, workers:[], bagDone:false,

  if(G) G.resetDynamic();
}

// ================== AUDIO ==================
function ensureAudio(){ if(!audio){ try{ audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f=880, d=0.12, type='square', v=0.05){
  if(muted||!audio) return;
  try{ const o=audio.createOscillator(), g=audio.createGain(); o.type=type; o.frequency.value=f; o.connect(g); g.connect(audio.destination);
    const t=audio.currentTime; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.start(t); o.stop(t+d); }catch(e){}
}
const chime = ()=>{beep(660,.12,'sine',.08); setTimeout(()=>beep(990,.18,'sine',.08),110);};
const buzz = ()=>beep(140,.35,'sawtooth',.07);

function scenario(sc, label, onDone){
  const opts = shuffle(sc.o.map((o,i)=>({o,i})));
  const parts = sc.who.split(' ');
  const m = openModal(`<div class="who"><span class="av">${esc(parts[0])}</span><h2>${esc(parts.slice(1).join(' '))}</h2></div>
    <p>${esc(sc.text)}</p><div class="opts">${opts.map(({o,i})=>`<button data-i="${i}">${esc(o.t)}</button>`).join('')}</div><div id="fb"></div>`);
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const o = sc.o[+b.dataset.i];
    m.querySelectorAll('[data-i]').forEach(x=>x.disabled=true);
    applyChoice(o,label); o.ok?chime():buzz();
    m.querySelector('#fb').innerHTML = `<div class="fb ${o.ok?'':'bad'}">${o.ok?'✅':'❌'} ${esc(o.why)}${o.badge?`<br><b>🏅 Badge earned: ${esc(o.badge)}</b>`:''}</div>
      <div style="margin-top:10px"><button class="primary" id="cont">Continue</button></div>`;
    m.querySelector('#cont').onclick=()=>{ closeModal(); onDone&&onDone(o); if(S.fatal) endGame(); };
    m.querySelector('#cont').focus();
  });
}
function applyChoice(o,label){
  for(const k in (o.fx||{})) S.bars[k]=clamp(S.bars[k]+o.fx[k],0,10);
  if(!o.ok) S.mistakes.push({where:label, why:o.why});
  if(o.badge && !S.badges.includes(o.badge)) S.badges.push(o.badge);
  if(o.ppe!==undefined) S.p.ppe=o.ppe;
  if(o.fatal) S.fatal = label+': '+o.why;
}
function complete(id, ok){
  if(id in S.results) return;
  S.results[id]=ok;
  const n = Object.keys(S.results).length;
  if(n===4 && !S.firedEvents.nepa){ S.firedEvents.nepa=1; setTimeout(()=>fireEvent('nepa'),1500); }
  if(n===8 && !S.firedEvents.rain){ S.firedEvents.rain=1; setTimeout(()=>fireEvent('rain'),1500); }
  if(n===ZONES.length && !S.alarm){ toast('📱 Shift almost done. Head back towards Admin to sign out…'); setTimeout(startAlarm, 5000); }
}
function fireEvent(k){
  if(!S||S.over||S.alarm) return;
  if(paused){ setTimeout(()=>fireEvent(k),1000); return; }
  if(k==='nepa'){ S.nepa=45; beep(200,.4,'sine',.06); }
  if(k==='rain') S.rain=45;
  scenario(EVENTS[k], EVENTS[k].who);
}
function zoneScenario(id){
  if(id==='electrical') return SC[profile.role.id==='electrician'?'electrical_electrician':'electrical_default'];
  return SC[id];
}

function inspect(it){
  const m = openModal(`<div class="who"><span class="av">${it.e}</span><h2>Inspect</h2></div><p>You see: <b>${esc(it.t)}</b></p>
    <div class="opts"><button id="r1">⚠️ Report as a hazard</button><button id="r2">👍 Looks fine, move on</button></div><div id="fb"></div>`);

// ================== COLLISION ==================
let SOLIDS_BASE = null;
function solids(){
  if(!SOLIDS_BASE){
    const s = BUILD.map(b=>({x:b.x,y:b.y,w:b.w,h:b.h}));
    s.push({x:FENCE.l-10,y:FENCE.t-10,w:FENCE.r-FENCE.l+20,h:10});
    s.push({x:FENCE.l-10,y:FENCE.t,w:10,h:FENCE.b-FENCE.t});
    s.push({x:FENCE.r,y:FENCE.t,w:10,h:FENCE.b-FENCE.t});
    s.push({x:FENCE.l-10,y:FENCE.b,w:FENCE.gateL-FENCE.l+10,h:10});
    s.push({x:FENCE.gateR,y:FENCE.b,w:FENCE.r-FENCE.gateR+10,h:10});
    s.push({x:1400,y:80,w:140,h:220});
    s.push(TRUCK); PARKED.forEach(c=>s.push(c));
    s.push({x:0,y:H-4,w:W,h:4}); s.push({x:0,y:0,w:4,h:H}); s.push({x:W-4,y:0,w:4,h:H});
    SOLIDS_BASE = s;
  }
  return S.gateOpen ? SOLIDS_BASE : SOLIDS_BASE.concat([{x:FENCE.gateL,y:FENCE.b-2,w:FENCE.gateR-FENCE.gateL,h:12}]);
}
function blocked(x,y,r,sol){
  for(const b of sol){ const cx=clamp(x,b.x,b.x+b.w), cy=clamp(y,b.y,b.y+b.h); if((x-cx)**2+(y-cy)**2 < r*r) return true; }
  return false;
}

// ================== UPDATE ==================
function update(dt){
  S.t += dt;
  const p=S.p, sol=solids();
  // look with arrow keys / Q E-less rotation
  if(keys.ArrowLeft) yaw += 2.2*dt; if(keys.ArrowRight) yaw -= 2.2*dt;
  let fwd=0, str=0;
  if(keys.KeyW||keys.ArrowUp) fwd+=1; if(keys.KeyS||keys.ArrowDown) fwd-=1;
  if(keys.KeyD) str+=1; if(keys.KeyA) str-=1;
  if(joy){ fwd=-joy.dy; str=joy.dx; }
  const fx=-Math.sin(yaw), fy=-Math.cos(yaw), rx=Math.cos(yaw), ry=-Math.sin(yaw);
  let mx=fx*fwd+rx*str, my=fy*fwd+ry*str; const len=Math.hypot(mx,my);
  p.moving = len>0.1;
  if(p.moving){
    const sp = 120*(len>1?1/len:1); mx*=sp; my*=sp; const r=13;
    if(!blocked(p.x+mx*dt,p.y,r,sol)) p.x+=mx*dt;
    if(!blocked(p.x,p.y+my*dt,r,sol)) p.y+=my*dt;
    p.x=clamp(p.x,10,W-10); p.y=clamp(p.y,10,H-10);
    p.face=Math.atan2(-mx,-my); p.step+=dt*9;
  }
  // forklift
  const f=S.forklift, inLane = p.y>LANE.y1-6 && p.y<LANE.y2+6 && p.x>LANE.x1 && p.x<LANE.x2;
  const onCross = CROSS.some(c=>p.x>c.x1-4 && p.x<c.x2+4);
  const ahead = (p.x-f.x)*f.dir;
  f.stop = inLane && ahead>0 && ahead<170;
  if(!f.stop){ f.x+=f.dir*110*dt; if(f.x>LANE.x2-60) f.dir=-1; if(f.x<LANE.x1+60) f.dir=1; }
  if(inLane && !onCross && !('forklift' in S.results)){
    complete('forklift',false); S.mistakes.push({where:'Forklift Lane',why:'You cut across the forklift lane. Only cross at the zebra crossing, where drivers expect people.'});
    S.bars.site=clamp(S.bars.site-1,0,10); toast('⚠️ You are in the forklift lane! Only cross at the zebra crossing.','bad'); buzz();
  }
  if(inLane && onCross && !('forklift' in S.results)){ complete('forklift',true); toast('✅ Nice. You used the zebra crossing and the forklift stopped for you.'); chime(); }
  if(inLane && Math.abs(p.x-f.x)<44 && Math.abs(p.y-440)<44 && !onCross && S.t-S.lastHit>2){
    S.lastHit=S.t; S.bars.health=clamp(S.bars.health-4,0,10); toast('💥 The forklift hit you! Health −4. The driver could not see you.','bad'); buzz(); G.shake=0.6;
    S.mistakes.push({where:'Forklift Lane',why:'You were hit by a forklift. Stay on walkways and only cross at the zebra crossing.'});
    p.y = p.y<440 ? LANE.y1-20 : LANE.y2+20;
  }
  // reversing van
  const v=S.van;
  if(v.wait>0) v.wait-=dt; else { v.y += v.dir*45*dt; if(v.y<900){v.dir=1;v.wait=2;} if(v.y>1050){v.dir=-1;v.wait=2;} }
  const reversing = v.dir<0 && v.wait<=0;
  if(reversing && Math.floor(S.t*2)%2===0 && Math.floor((S.t-dt)*2)%2!==0 && dist(p.x,p.y,1360,v.y)<380) beep(1150,.08,'square',.03);
  if(!('carpark' in S.results) && dist(p.x,p.y,1360,v.y-40)<130) scenario(SC.carpark,'Car Park',o=>complete('carpark',o.ok));
  const inMuster = dist(p.x,p.y,MUSTER.x,MUSTER.y)<MUSTER.r;
  if(!('muster' in S.results) && inMuster && !S.alarm && !paused) scenario(SC.muster,'Muster Point',o=>complete('muster',o.ok));
  // noise area
  if(dist(p.x,p.y,NOISE.x,NOISE.y)<NOISE.r && !S.alarm && !p.ppe){
    S.bars.hearing=clamp(S.bars.hearing-0.6*dt,0,10);
    if(S.t-S.noiseToastAt>6){S.noiseToastAt=S.t; toast('🔊 Too loud! No ear plugs. Your hearing is being damaged.','warn'); beep(3000,.25,'sine',.015);}
  }
  if(S.nepa>0) S.nepa-=dt;
  if(S.rain>0) S.rain-=dt;
  // alarm
  if(S.alarm && !S.alarm.done){
    S.alarm.left-=dt; S.smokeR+=dt*9;
    if(Math.floor(S.t*1.5)%2===0) beep(Math.floor(S.t*1.5)%4<2?900:700,.05,'square',.02);
    if(dist(p.x,p.y,1030,300)<S.smokeR && p.y>280){ S.bars.lungs=clamp(S.bars.lungs-1.4*dt,0,10); if(S.t-S.smokeToastAt>4){S.smokeToastAt=S.t; toast('😷 Smoke! Move away. Stay low and keep going.','bad');} }
    S.workers.forEach(w=>{ const a=Math.atan2(MUSTER.y-w.y,MUSTER.x-w.x); if(dist(w.x,w.y,MUSTER.x,MUSTER.y)>30){ w.x+=Math.cos(a)*80*dt; w.y+=Math.sin(a)*80*dt; w.step+=dt*9; w.face=Math.atan2(-Math.cos(a),-Math.sin(a)); } });
    $('timer').textContent='🚨 '+Math.max(0,Math.ceil(S.alarm.left))+'s';
    if(inMuster){ S.alarm.done=true; toast('✅ You made it to the Muster Point! The fire warden has counted you.'); endGame(); return; }
    if(S.alarm.left<=0){ S.mistakes.push({where:'Fire alarm',why:'You did not reach the muster point in time. Know your route before you need it.'}); endGame(); return; }
  }
  if(S.bars.health<=0 && !S.fatal){ S.fatal='Your health reached zero.'; endGame(); return; }
  if(S.bars.lungs<=0 && !S.fatal){ S.fatal='You collapsed from breathing smoke or fumes.'; endGame(); return; }
  const near = interactables().filter(i=>dist(p.x,p.y,i.x,i.y)<i.r).sort((a,b)=>dist(p.x,p.y,a.x,a.y)-dist(p.x,p.y,b.x,b.y))[0];
  S.near = near;
  if(near){ $('prompt').textContent=near.name; $('prompt').classList.remove('hidden'); $('act').textContent=near.label; $('act').disabled=false; }
  else { $('prompt').classList.add('hidden'); $('act').textContent='E'; $('act').disabled=true; }
}

let G = null;

function canvasTex(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; fn(c.getContext('2d'),w,h); const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t; }
function textSprite(text,{font='bold 44px system-ui',bg='rgba(0,0,0,.6)',color='#fff',h=0.6,pad=18}={}){
  const m=document.createElement('canvas').getContext('2d'); m.font=font; const tw=Math.ceil(m.measureText(text).width)+pad*2;
  const tex=canvasTex(tw,72,(c,w,hh)=>{ if(bg){c.fillStyle=bg; const r=20; c.beginPath(); c.moveTo(r,0); c.arcTo(w,0,w,hh,r); c.arcTo(w,hh,0,hh,r); c.arcTo(0,hh,0,0,r); c.arcTo(0,0,w,0,r); c.fill();}
    c.font=font; c.fillStyle=color; c.textAlign='center'; c.textBaseline='middle'; c.fillText(text,w/2,hh/2+2); });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true})); s.scale.set(h*tw/72,h,1); return s;
}
function emojiSprite(e,size=1){
  const tex=canvasTex(128,128,(c)=>{ c.font=`100px ${EMOJI}`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(e,64,70); });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true})); s.scale.set(size,size,1); return s;
}
const lam = (c,o={}) => new THREE.MeshLambertMaterial({color:c,...o});
function box(w,h,d,mat,x,y,z,shadow=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; return m; }

function makePerson(shirt,skin,o={}){
  const g=new THREE.Group();
  const pants=lam('#2c3e50'), sh=lam(shirt), sk=lam(skin);
  const legL=box(.18,.8,.2,pants,-.12,.4,0), legR=box(.18,.8,.2,pants,.12,.4,0);
  g.add(legL,legR);
  const body=box(.5,.7,.3,sh,0,1.15,0); g.add(body);
  const armL=box(.13,.65,.15,sh,-.33,1.15,0), armR=box(.13,.65,.15,sh,.33,1.15,0); g.add(armL,armR);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.2,14,12),sk); head.position.y=1.72; head.castShadow=true; g.add(head);
  const eyeM=lam('#111'); const e1=box(.05,.05,.02,eyeM,-.07,1.75,-.19,false), e2=box(.05,.05,.02,eyeM,.07,1.75,-.19,false); g.add(e1,e2);

function render3D(dt){

  // player
  player.position.set(X(p.x),0,Z(p.y)); player.rotation.y=p.face; animPerson(player,p.step,p.moving&&!paused);
  player.userData.vest.visible=p.ppe; player.userData.stripe.visible=p.ppe; player.userData.hat.visible=p.ppe;
  player.visible=!firstPerson;
  // camera
  const P=new THREE.Vector3(X(p.x),0,Z(p.y));
  if(firstPerson){
    camera.position.set(P.x,1.65,P.z); camera.rotation.set(-(pitch-0.25),yaw,0);

  G.beacon.material.color.set(f.stop?'#22cc55':(Math.floor(t*4)%2?'#ff9900':'#552200'));
  // van (rear faces +z, so it reverses toward smaller y? it moves y decreasing when reversing -> rear must face -z)
  const v=S.van; G.van.position.set(X(1360),0,Z(v.y-35)); G.van.rotation.y=Math.PI;
  const rev = v.dir<0 && v.wait<=0; G.beepS.visible=rev && Math.floor(t*2)%2===0; G.revL.material.color.set(rev?'#ffffff':'#552222'); G.revR.material.color.copy(G.revL.material.color);
  // NPCs face player when near
  G.npcs.forEach(({g,n})=>{ const dd=dist(p.x,p.y,n.x,n.y); if(dd<260) g.rotation.y=Math.atan2(-(p.x-n.x),-(p.y-n.y)); if(g.userData.smoke){ g.userData.smoke.visible=!('diesel' in S.results); g.userData.smoke.position.y=1.9+((t*.6)%1)*.6; } });
  // markers & items
  G.dyn.markers.forEach(({z,s})=>{ s.visible=!(z.id in S.results); s.position.y=3+Math.sin(t*3)*.25; });
  G.dyn.items.forEach(({it,s,disc,tag})=>{ tag.visible=it.done==='tag'; s.material.opacity=it.done==='seen'?.45:1; disc.material.color.set(it.done==='tag'?'#ff4444':it.done?'#66bb66':'#ffffff');
    const near=dist(p.x,p.y,it.x,it.y)<48 && !it.done; s.position.y=.6+(near?Math.sin(t*6)*.08:0); });
  // alarm
  const al=!!S.alarm && !S.over;
  G.alarmLight.intensity = al ? (Math.sin(t*8)>0?2.2:0.2) : 0;
  G.fireLight.intensity = al ? 2+Math.random()*1.5 : 0; G.flame.visible=al;
  G.smoke.forEach(s=>{ s.visible=al; if(al){ const u=s.userData; const r=u.r*S.smokeR; const plume = u.r<0.35;
      if(plume){ const rise=((t*.25+u.h)%1); s.position.set(X(1030+Math.cos(u.a)*50)+rise*3, 7+rise*14, Z(180+Math.sin(u.a)*50)); const sz=5+rise*8; s.scale.set(sz,sz,1); s.material.opacity=.9*(1-rise*.7); }
      else { s.position.set(X(1030+Math.cos(u.a)*r), 1+u.h*3+Math.sin(t+u.a)*.3, Z(300+Math.abs(Math.sin(u.a))*r)); const sz=3+S.smokeR*K*.25; s.scale.set(sz,sz,1); } } });
  G.dyn.workers.forEach((g,i)=>{ const w=S.workers[i]; if(!w) return; g.position.set(X(w.x),0,Z(w.y)); if(w.face!==undefined) g.rotation.y=w.face; animPerson(g,w.step,dist(w.x,w.y,MUSTER.x,MUSTER.y)>30); });
  if(G.dyn.bag) G.dyn.bag.visible = al && !S.bagDone;
  G.renderer.render(scene,camera);
}
function renderIntro(t){
  const {camera}=G; const a=t*0.08; const cxp=X(W/2), czp=Z(H/2);
  camera.position.set(cxp+Math.sin(a)*55, 32, czp+Math.cos(a)*45); camera.lookAt(cxp,0,czp);
  G.player.visible=false;
  G.renderer.render(G.scene,camera);
}

function drawHUD(){
  $('bars').innerHTML = BARS.map(b=>{const v=S.bars[b.k]; return `<div class="b ${v<5?'low':''}" title="${b.l}">${b.n} ${Math.ceil(v)}<div class="t"><div class="f" style="width:${v*10}%"></div></div></div>`}).join('');
  const mins = 8*60 + Math.floor(S.t); const hh=String(Math.floor(mins/60)%24).padStart(2,'0'), mm=String(mins%60).padStart(2,'0');
  $('info').innerHTML = `<span>🕗 ${hh}:${mm}</span><span>✅ ${Object.keys(S.results).length}/${ZONES.length}</span><span>🔎 ${S.hazFound}/${S.hazTotal}</span>${S.p.ppe?'<span>🦺 PPE on</span>':''}`;
  const m=$('mini'), c=m.getContext('2d'), sx=m.width/W, sy=m.height/H;
  c.fillStyle='#cfcabd'; c.fillRect(0,0,m.width,m.height);
  c.fillStyle='#5d5e61'; c.fillRect(LANE.x1*sx,LANE.y1*sy,(LANE.x2-LANE.x1)*sx,(LANE.y2-LANE.y1)*sy); c.fillRect(80*sx,60*sy,160*sx,(FENCE.b-60)*sy);
  BUILD.forEach(b=>{c.fillStyle=b.c; c.fillRect(b.x*sx,b.y*sy,b.w*sx,b.h*sy);});
  c.fillStyle='#27ae60'; c.beginPath(); c.arc(MUSTER.x*sx,MUSTER.y*sy,4,0,7); c.fill();
  ZONES.forEach(z=>{ if(!z.r||(z.id in S.results)) return; c.fillStyle='#e0b800'; c.fillRect(z.x*sx-2,z.y*sy-2,4,4); });
  const px=S.p.x*sx, py=S.p.y*sy; c.fillStyle='#e00'; c.beginPath(); c.moveTo(px-Math.sin(yaw)*7,py-Math.cos(yaw)*7); c.lineTo(px+Math.cos(yaw)*3.5,py-Math.sin(yaw)*3.5); c.lineTo(px-Math.cos(yaw)*3.5,py+Math.sin(yaw)*3.5); c.fill();
}

// ================== LOOP ==================
let last=performance.now(), hudT=0, started=false;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G && S){
    if(!started) renderIntro(now/1000);
    else { if(!paused && !S.over) update(dt); render3D(dt); hudT+=dt; if(hudT>0.12){hudT=0; drawHUD();} }
  }
  requestAnimationFrame(loop);
}

// ================== INPUT ==================
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(paused) return;
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Space'||e.code==='Enter'){ e.preventDefault(); doAct(); }
  if(e.code==='KeyV') toggleCam();
  if(e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
const cv=$('game');
cv.addEventListener('pointerdown',e=>{
  ensureAudio(); if(paused||!started) return;
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType!=='mouse' && e.clientX < innerWidth*0.5 && !joy){
    joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0};
    const j=$('joy'); j.style.left=e.clientX+'px'; j.style.top=e.clientY+'px'; j.classList.remove('hidden'); j.firstElementChild.style.transform='';
  } else if(!look) look={id:e.pointerId,x:e.clientX,y:e.clientY};
});
cv.addEventListener('pointermove',e=>{
  if(joy && e.pointerId===joy.id){ let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const l=Math.hypot(dx,dy), m=50; if(l>m){dx=dx/l*m; dy=dy/l*m;}
    joy.dx=dx/m; joy.dy=dy/m; $('joy').firstElementChild.style.transform=`translate(${dx}px,${dy}px)`; }
  else if(look && e.pointerId===look.id){ yaw -= (e.clientX-look.x)*0.006; pitch = clamp(pitch+(e.clientY-look.y)*0.004,-0.35,1.0); look.x=e.clientX; look.y=e.clientY; }
});
const endPtr=e=>{ if(joy&&e.pointerId===joy.id){ joy=null; $('joy').classList.add('hidden'); } if(look&&e.pointerId===look.id) look=null; };
cv.addEventListener('pointerup',endPtr); cv.addEventListener('pointercancel',endPtr);
function toggleCam(){ firstPerson=!firstPerson; toast(firstPerson?'👁️ First-person view: you are seeing through your own eyes.':'🎥 Third-person view'); }
$('act').onclick=doAct;
$('phoneBtn').onclick=()=>{ if(!paused) openPhone(); };
$('camBtn').onclick=()=>{ if(!paused) toggleCam(); };
$('muteBtn').onclick=()=>{ muted=!muted; $('muteBtn').textContent=muted?'🔇':'🔊'; };

// ================== START ==================
function setHud(on){ ['hud','act','phoneBtn','camBtn','muteBtn','hint'].forEach(id=>$(id).classList.toggle('hidden',!on)); if(!on){$('prompt').classList.add('hidden');$('timer').classList.add('hidden');$('alarmv').classList.add('hidden');} }
function showStart(){
  setHud(false); started=false; profile.role=null; newGame(); paused=true;
  const m=openModal(`<h1 style="margin:.1em 0">🦺 Site Life 3D</h1>
    <p class="muted">The safety induction you <b>play</b>, not a paper you tick. Walk the compound, make the right calls, spot the hazards, and survive your first shift.<br>Demo site: <i>Acme Manufacturing, Ikeja</i>.</p>
    <p><b>Your name</b></p><input id="nm" placeholder="e.g. Tunde" maxlength="16" value="${esc(profile.name)}">
    <p><b>Your look</b></p>
    <div class="row">${SHIRTS.map(c=>`<button class="sw ${c===profile.shirt?'on':''}" data-c="${c}" style="background:${c}" aria-label="shirt colour"></button>`).join('')}</div>
    <div class="row" style="margin-top:6px">${SKINS.map(c=>`<button class="sw ${c===profile.skin?'on':''}" data-s="${c}" style="background:${c}" aria-label="skin tone"></button>`).join('')}</div>
    <p><b>Role lottery 🎲</b> <span class="muted">Like Lagos Life's birth lottery, you don't choose.</span></p>
    <div class="big" id="rolebox">🎲 ?</div><p class="muted" id="roletask"></p>
    <div class="row"><button id="spin">Spin role</button><button class="primary" id="start" disabled>Start shift ▶</button></div>
    <p class="muted" style="font-size:.85rem;margin-top:12px">🎮 <b>Computer:</b> WASD to walk, drag the mouse to look, E to interact, V to switch first/third person.<br>📱 <b>Phone:</b> drag the left side of the screen to walk, drag the right side to look, and tap the green button to interact.</p>`);
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{profile.shirt=b.dataset.c; m.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{profile.skin=b.dataset.s; m.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));});
  m.querySelector('#spin').onclick=()=>{
    ensureAudio(); m.querySelector('#spin').disabled=true; let n=0;
    const t=setInterval(()=>{ profile.role=ROLES[Math.floor(Math.random()*ROLES.length)]; m.querySelector('#rolebox').textContent=`${profile.role.icon} ${profile.role.name}`; beep(500+n*40,.05,'square',.03);
      if(++n>12){ clearInterval(t); m.querySelector('#roletask').textContent='📱 Task: '+profile.role.task; m.querySelector('#start').disabled=false; m.querySelector('#spin').disabled=false; chime(); } },90);
  };
  m.querySelector('#start').onclick=()=>{
    profile.name=(m.querySelector('#nm').value.trim()||'Guest').slice(0,16);
    G.resetDynamic(); started=true; closeModal(); setHud(true);
    toast('🛵 The okada has dropped you at the Main Gate. Walk up to Security.');
    setTimeout(()=>toast('📱 Tap "Tasks" to see what to do. Follow the yellow ! markers.'),2600);
  };
}

window.addEventListener('load',()=>{
  if(!window.THREE){ $('loading').innerHTML='Could not load the 3D engine. Check your internet connection, or play the <a href="lite.html">2D version</a>.'; return; }
  try{ newGame(); initThree(); }catch(err){ $('loading').innerHTML='Your device could not start 3D. Try the <a href="lite.html">2D version</a>.'; console.error(err); return; }
  $('loading').remove();
  showStart();
  requestAnimationFrame(loop);
});
</script>
